<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>受付カウンター | NEON FESTA</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #0b0b20; color: #fff; font-family: "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; touch-action: manipulation; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 14px 14px 30px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .top b { font-size: 15px; letter-spacing: .15em; color: #ffd36e; }
  .top span { font-size: 13px; color: rgba(255,255,255,.6); font-weight: 700; }
  .total { text-align: center; margin: 14px 0 6px; }
  .total .n { font-size: 84px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; background: linear-gradient(90deg,#ff6fa5,#ffd36e,#5ee7ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .total .l { font-size: 14px; font-weight: 800; color: rgba(255,255,255,.7); }
  .now { text-align: center; font-size: 14px; font-weight: 800; color: #5cff8d; min-height: 20px; }
  .big { display: block; width: 100%; margin: 14px 0 10px; padding: 26px 0; border: 0; border-radius: 22px; font: inherit; font-size: 34px; font-weight: 900; color: #10102a; background: linear-gradient(135deg,#ffd36e,#ff9f43); box-shadow: 0 8px 0 #b86a14; cursor: pointer; }
  .big:active { transform: translateY(5px); box-shadow: 0 3px 0 #b86a14; }
  .grp { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grp button, .sub button { padding: 16px 0; border-radius: 16px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; font: inherit; font-size: 20px; font-weight: 900; cursor: pointer; }
  .grp button:active, .sub button:active { background: rgba(255,255,255,.2); }
  .sub { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .sub button { font-size: 15px; padding: 12px 0; }
  .sub .undo { color: #ffb0b0; }
  h2 { font-size: 15px; margin: 22px 0 6px; color: rgba(255,255,255,.8); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td { padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,.1); }
  td.t { color: rgba(255,255,255,.7); font-weight: 700; width: 9em; }
  td.c { text-align: right; font-weight: 900; width: 3.5em; font-variant-numeric: tabular-nums; }
  td.bar span { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg,#ff6fa5,#ffd36e); }
  .note { font-size: 12.5px; color: rgba(255,255,255,.6); line-height: 1.7; margin-top: 16px; }
  .note b { color: #fff; }
  .danger { margin-top: 10px; width: 100%; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,90,90,.4); background: transparent; color: #ff9a9a; font: inherit; font-weight: 800; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>NEON FESTA 受付カウンター</b><span id="day"></span></div>
  <div class="total"><div class="n" id="total">0</div><div class="l">きょう入った人（7F パソコン室）</div></div>
  <div class="now" id="now"></div>
  <button class="big" id="plus1">＋1 人</button>
  <div class="grp"><button data-n="2">＋2</button><button data-n="3">＋3</button><button data-n="4">＋4</button><button data-n="5">＋5</button></div>
  <div class="sub"><button class="undo" id="undo">↩ 1 回もどす</button><button id="copy">📋 報告用にコピー</button></div>
  <h2>30 分ごと</h2>
  <table id="slots"></table>
  <div class="note">
    <b>数え方</b>：入口から部屋に入った人を 1 人ずつ（グループは人数ぶん）。同じ人がもう一度入ってきたら、学校の数え方のきまりに合わせる（わからなければ先生に確認）。<br>
    記録はこのスマホ（ブラウザ）の中にだけ保存されます。受付を交代するときは、<b>このスマホごと</b>次の人にわたす。画面を閉じても消えません。
  </div>
  <button class="danger" id="reset">きょうの記録を消す（2 回押す）</button>
</div>
<script>
'use strict';
// 記録: 日付ごとに [時刻(ms), 人数] の配列を localStorage に保存（このブラウザだけ）
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const KEY = () => 'fes:counter:' + today();
const load = () => { try { const v = JSON.parse(localStorage.getItem(KEY())); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
const save = v => { try { localStorage.setItem(KEY(), JSON.stringify(v)); } catch (e) { alert('保存できませんでした。紙にも書いておいてください'); } };
let log = load();
function add(n) { log.push([Date.now(), n]); save(log); render(); flash(`＋${n} 人`); if (navigator.vibrate) navigator.vibrate(25); }
function flash(t) { const e = document.getElementById('now'); e.textContent = t; clearTimeout(flash.tm); flash.tm = setTimeout(() => { e.textContent = ''; }, 1200); }
function slots() {
  const m = new Map();
  log.forEach(([t, n]) => { const d = new Date(t); const k = d.getHours() * 2 + (d.getMinutes() >= 30 ? 1 : 0); m.set(k, (m.get(k) || 0) + n); });
  return [...m.entries()].sort((a, b) => a[0] - b[0]).map(([k, n]) => [`${Math.floor(k / 2)}:${k % 2 ? '30' : '00'}〜${Math.floor((k + 1) / 2)}:${(k + 1) % 2 ? '30' : '00'}`, n]);
}
function render() {
  const total = log.reduce((a, [, n]) => a + n, 0);
  document.getElementById('total').textContent = total;
  document.getElementById('day').textContent = today().replace(/-/g, '/');
  const s = slots(), max = Math.max(1, ...s.map(x => x[1]));
  document.getElementById('slots').innerHTML = s.length ? s.map(([t, n]) => `<tr><td class="t">${t}</td><td class="bar"><span style="width:${Math.round(n / max * 100)}%"></span></td><td class="c">${n}</td></tr>`).join('') : '<tr><td style="color:rgba(255,255,255,.5)">まだ記録がありません</td></tr>';
}
document.getElementById('plus1').addEventListener('click', () => add(1));
document.querySelectorAll('.grp button').forEach(b => b.addEventListener('click', () => add(+b.dataset.n)));
document.getElementById('undo').addEventListener('click', () => { if (!log.length) return; const [, n] = log.pop(); save(log); render(); flash(`−${n} 人（もどした）`); });
document.getElementById('copy').addEventListener('click', () => {
  const total = log.reduce((a, [, n]) => a + n, 0);
  const text = `NEON FESTA（7F パソコン室）${today().replace(/-/g, '/')} 来場者 ${total} 人\n` + slots().map(([t, n]) => `${t}  ${n} 人`).join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => flash('コピーしました')).catch(() => prompt('この文をコピーしてください', text));
});
let armed = 0;
document.getElementById('reset').addEventListener('click', e => {
  if (Date.now() - armed > 3000) { armed = Date.now(); e.target.textContent = 'もう一度押すと消えます'; setTimeout(() => { e.target.textContent = 'きょうの記録を消す（2 回押す）'; }, 3000); return; }
  log = []; save(log); render(); e.target.textContent = 'きょうの記録を消す（2 回押す）'; flash('消しました');
});
render();
</script>
</body>
</html>
