<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全ゲーム 自動チェック | NEON FESTA</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0c0c1e; color: #fff; font-family: "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 18px; background: rgba(255,255,255,.05); border-bottom: 1px solid rgba(255,255,255,.12); position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 18px; margin: 0 10px 0 0; }
  button { padding: 8px 16px; border-radius: 999px; border: 0; font-weight: 900; cursor: pointer; font-family: inherit; color: #fff; background: linear-gradient(135deg,#6a5cff,#b04dff); }
  button.alt { background: rgba(255,255,255,.12); }
  button:disabled { opacity: .4; cursor: default; }
  label { font-size: 13px; font-weight: 700; color: rgba(255,255,255,.75); display: flex; align-items: center; gap: 6px; }
  select, input { font-family: inherit; font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,.2); background: #1a1a30; color: #fff; }
  .wrap { display: grid; grid-template-columns: minmax(360px, 520px) 1fr; gap: 16px; padding: 16px 18px; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 7px 8px; border-bottom: 1px solid rgba(255,255,255,.1); text-align: left; vertical-align: top; }
  th { color: rgba(255,255,255,.6); font-weight: 700; font-size: 12px; }
  .st { font-weight: 900; white-space: nowrap; }
  .ok { color: #5cff8d; } .ng { color: #ff6b6b; } .run { color: #ffd36e; } .wait { color: rgba(255,255,255,.4); }
  .msg { color: rgba(255,255,255,.75); font-size: 12px; white-space: pre-wrap; word-break: break-all; max-width: 300px; }
  .stage { position: relative; background: #000; border: 1px solid rgba(255,255,255,.15); border-radius: 10px; overflow: hidden; min-height: 420px; }
  .stage iframe { border: 0; width: 100%; height: 100%; position: absolute; inset: 0; background: #07071a; }
  .stage .lbl { position: absolute; left: 10px; top: 8px; z-index: 2; font-size: 12px; font-weight: 800; background: rgba(0,0,0,.6); padding: 3px 8px; border-radius: 6px; pointer-events: none; }
  .sum { font-size: 15px; font-weight: 900; padding: 10px 18px 0; }
  .sum .big { font-size: 26px; }
  .log { font-family: Consolas, monospace; font-size: 11px; color: rgba(255,255,255,.55); padding: 8px 18px 30px; white-space: pre-wrap; max-height: 260px; overflow: auto; }
  .note { font-size: 12px; color: rgba(255,255,255,.55); padding: 0 18px 8px; }
</style>
</head>
<body>
<div class="bar">
  <h1>🧪 全ゲーム 自動チェック</h1>
  <button id="runAll">▶ 全部チェック</button>
  <button id="stop" class="alt" disabled>■ 止める</button>
  <label>1本あたり <select id="dur"><option value="4">4秒（超高速）</option><option value="8" selected>8秒（当日・はやい）</option><option value="20">20秒（ふつう）</option><option value="45">45秒（じっくり）</option></select></label>
  <label><input type="checkbox" id="chkResize" checked> 画面サイズ変更もテスト</label>
  <label><input type="checkbox" id="chkPause" checked> ポーズ→再開もテスト</label>
  <label>1本だけ: <select id="one"><option value="">（選ぶ）</option></select></label>
  <button id="runOne" class="alt">▶ これだけ</button>
</div>
<div class="sum" id="sum">まだ実行していません。「▶ 全部チェック」を押してください（約 <span id="eta">4</span> 分）。</div>
<div class="note">やること: 各ゲームを読み込む → 開始キー・タップ → ランダムにキーとタップを送り続ける → エラー（例外・console.error・エラー画面）が出ないか、画面が止まっていないかを見る。当日の朝、各PCでこのページを開いて「8秒」で回すと、そのPCで全ゲームが動くことを確認できます。</div>
<div class="wrap">
  <div><table><thead><tr><th>#</th><th>ゲーム</th><th>結果</th><th>メモ</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="stage" id="stage"><div class="lbl" id="stageLbl">（ここにゲームが表示されます）</div></div>
</div>
<div class="log" id="log"></div>

<script>
'use strict';
const GAMES = [
  { id: 'rhythm', name: 'リズムスターズ', keys: ['KeyD', 'KeyF', 'KeyJ', 'KeyK', 'Space', 'Enter'] },
  { id: 'shooter', name: 'ギャラクシーブラスター', keys: ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'ShiftLeft', 'Space', 'Enter'] },
  { id: 'puzzle', name: 'ジュエルラッシュ', keys: ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Enter'] },
  { id: 'typing', name: 'タイピングバトル', keys: ['KeyA', 'KeyS', 'KeyD', 'KeyK', 'KeyI', 'KeyN', 'KeyO', 'KeyU', 'KeyE', 'KeyT', 'Space', 'Enter', 'Backspace'] },
  { id: 'racing', name: 'ネオンドライブ', keys: ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Enter'] },
  { id: 'runner', name: 'ダッシュ！ネコ忍者', keys: ['Space', 'ArrowDown', 'ArrowUp', 'Enter'] },
  { id: 'mole', name: 'もぐらパニック', keys: ['Numpad1', 'Numpad2', 'Numpad3', 'Numpad4', 'Numpad5', 'Numpad6', 'Numpad7', 'Numpad8', 'Numpad9', 'Digit1', 'Digit5', 'Digit9', 'Space', 'Enter'] },
  { id: 'hockey', name: 'ネオンエアホッケー', keys: ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Enter'] },
  { id: 'quiz', name: '早押しクイズ王', keys: ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Space', 'Enter'] },
  { id: 'breakout', name: 'ネオンブレイカー', keys: ['ArrowLeft', 'ArrowRight', 'Space', 'Enter'] },
  { id: 'duel', name: 'ネオンデュエル', keys: ['KeyA', 'KeyL', 'Space', 'Enter'] },
  { id: 'stack', name: 'ネオンスタック', keys: ['Space', 'Enter', 'ArrowDown'] },
  { id: 'memory', name: 'メモリーフラッシュ', keys: ['KeyQ', 'KeyW', 'KeyE', 'KeyA', 'KeyS', 'KeyD', 'KeyZ', 'KeyX', 'KeyC', 'Digit5', 'Space', 'Enter'] },
  { id: 'fps', name: 'ネオンストライク', keys: ['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyR', 'Enter'] },
];
const KEYMAP = { Space: ' ', Enter: 'Enter', Escape: 'Escape', Backspace: 'Backspace', ShiftLeft: 'Shift', ArrowLeft: 'ArrowLeft', ArrowRight: 'ArrowRight', ArrowUp: 'ArrowUp', ArrowDown: 'ArrowDown' };
const keyOf = code => KEYMAP[code] || (code.startsWith('Key') ? code.slice(3).toLowerCase() : code.startsWith('Digit') ? code.slice(5) : code.startsWith('Numpad') ? code.slice(6) : code);
const $ = id => document.getElementById(id);
const rows = $('rows'), stage = $('stage'), logEl = $('log');
const sleep = ms => new Promise(r => setTimeout(r, ms));
let stopFlag = false, running = false;
const results = {};

GAMES.forEach((g, i) => {
  const tr = document.createElement('tr'); tr.innerHTML = `<td>${i + 1}</td><td><b>${g.name}</b><br><span style="color:rgba(255,255,255,.45);font-size:11px">${g.id}.html</span></td><td class="st wait" id="st_${g.id}">—</td><td class="msg" id="msg_${g.id}"></td>`; rows.appendChild(tr);
  const o = document.createElement('option'); o.value = g.id; o.textContent = g.name; $('one').appendChild(o);
});
function log(s) { logEl.textContent += s + '\n'; logEl.scrollTop = logEl.scrollHeight; }
function setStatus(id, cls, text, msg) { const st = $('st_' + id); st.className = 'st ' + cls; st.textContent = text; if (msg != null) $('msg_' + id).textContent = msg; }
function updateEta() { $('eta').textContent = Math.ceil(GAMES.length * (+$('dur').value + 3) / 60); }
$('dur').addEventListener('change', updateEta); updateEta();

/** iframe の中で起きた問題を集める */
function attachWatch(fr, errs) {
  const cw = fr.contentWindow; if (!cw) return;
  try {
    cw.addEventListener('error', e => errs.push('例外: ' + (e.message || (e.error && e.error.message) || '?') + (e.lineno ? ` (行 ${e.lineno})` : '')));
    cw.addEventListener('unhandledrejection', e => errs.push('Promise: ' + ((e.reason && (e.reason.message || e.reason)) || '?')));
    const ce = cw.console.error.bind(cw.console); cw.console.error = (...a) => { errs.push('console.error: ' + a.map(x => (x && x.message) || String(x)).join(' ').slice(0, 200)); ce(...a); };
  } catch (e) { errs.push('監視できません: ' + e.message); }
}
function fire(cw, target, type, code, extra) {
  const ev = new cw.KeyboardEvent(type, Object.assign({ key: keyOf(code), code, bubbles: true, cancelable: true }, extra || {}));
  (target || cw.document).dispatchEvent(ev);
}
function tapAt(cw, el, x, y, holdMs) {
  const r = el.getBoundingClientRect();
  const cx = r.left + x * r.width, cy = r.top + y * r.height;
  const mk = (type, extra) => new cw.PointerEvent(type, Object.assign({ clientX: cx, clientY: cy, pointerId: 1, pointerType: 'touch', isPrimary: true, bubbles: true, cancelable: true, button: 0, buttons: 1 }, extra || {}));
  const top = cw.document.elementFromPoint(cx, cy) || el;
  top.dispatchEvent(mk('pointerdown'));
  top.dispatchEvent(new cw.MouseEvent('mousedown', { clientX: cx, clientY: cy, bubbles: true, cancelable: true, button: 0, buttons: 1 }));
  return sleep(holdMs || 60).then(() => { top.dispatchEvent(mk('pointerup', { buttons: 0 })); top.dispatchEvent(new cw.MouseEvent('mouseup', { clientX: cx, clientY: cy, bubbles: true, cancelable: true, button: 0 })); top.dispatchEvent(new cw.MouseEvent('click', { clientX: cx, clientY: cy, bubbles: true, cancelable: true, button: 0 })); });
}
function snapshot(cw) {
  // 画面が動いているかを見るため、いちばん大きい canvas を小さく縮めて数値にする
  const cs = [...cw.document.querySelectorAll('canvas')].filter(c => c.width > 50 && c.height > 50).sort((a, b) => b.width * b.height - a.width * a.height);
  if (!cs.length) return null;
  const c = cs[0], o = document.createElement('canvas'); o.width = 32; o.height = 18; const g = o.getContext('2d');
  try { g.drawImage(c, 0, 0, 32, 18); const d = g.getImageData(0, 0, 32, 18).data; let s = 0; for (let i = 0; i < d.length; i += 7) s = (s * 31 + d[i]) >>> 0; return s; } catch (e) { return null; }
}
function hasErrorOverlay(cw) { try { return !!cw.document.querySelector('.fes-err'); } catch (e) { return false; } }

async function testGame(g, durSec) {
  const errs = [], notes = [];
  setStatus(g.id, 'run', '実行中…', '');
  $('stageLbl').textContent = `${g.name}（${g.id}.html）`;
  stage.querySelectorAll('iframe').forEach(f => f.remove());
  stage.style.height = '420px';
  const fr = document.createElement('iframe'); fr.src = `../games/${g.id}.html?fescheck=1&t=${Date.now()}`;   // fescheck=1: 記録・スタンプを残さない（common.js）
  stage.appendChild(fr);
  const t0 = performance.now();
  await new Promise(res => { fr.addEventListener('load', res, { once: true }); setTimeout(res, 8000); });
  const cw = fr.contentWindow;
  if (!cw || !cw.document || !cw.document.body) { setStatus(g.id, 'ng', '❌ 失敗', '読み込めませんでした'); return false; }
  attachWatch(fr, errs);
  notes.push(`読み込み ${Math.round(performance.now() - t0)}ms`);
  await sleep(400);
  if (!cw.FES) errs.push('FES（common.js）が読み込まれていません');
  if (!cw.document.title || cw.document.title === 'Document') errs.push('document.title が未設定');
  const canvas = cw.document.querySelector('canvas');
  if (!canvas) notes.push('canvas なし（DOM のみ）');
  const s0 = snapshot(cw);
  // 開始: タップ → Space → Enter
  const target = canvas || cw.document.body;
  await tapAt(cw, target, 0.5, 0.6); await sleep(120);
  fire(cw, null, 'keydown', 'Space'); fire(cw, null, 'keyup', 'Space'); await sleep(120);
  fire(cw, null, 'keydown', 'Enter'); fire(cw, null, 'keyup', 'Enter'); await sleep(120);
  // クイズの選択肢ボタンなど
  [...cw.document.querySelectorAll('button')].slice(0, 6).forEach(b => { try { if (b.offsetParent) tapAt(cw, b, 0.5, 0.5); } catch (e) {} });
  // ランダム操作
  const endAt = performance.now() + durSec * 1000; let n = 0, held = null, pauseDone = false, resizeDone = false, frozen = 0, lastSnap = s0, sameCount = 0;
  while (performance.now() < endAt && !stopFlag) {
    const code = g.keys[Math.floor(Math.random() * g.keys.length)];
    if (held && Math.random() < 0.5) { fire(cw, null, 'keyup', held); held = null; }
    fire(cw, null, 'keydown', code); if (Math.random() < 0.3) held = code; else setTimeout(() => fire(cw, null, 'keyup', code), 40 + Math.random() * 120);
    if (Math.random() < 0.6) tapAt(cw, target, 0.1 + Math.random() * 0.8, 0.15 + Math.random() * 0.8, 40 + Math.random() * 200);
    if (Math.random() < 0.15) { const bs = [...cw.document.querySelectorAll('button, .fes-act')].filter(b => b.offsetParent && !/ホーム|home/i.test(b.textContent + (b.getAttribute('href') || ''))); if (bs.length) tapAt(cw, bs[Math.floor(Math.random() * bs.length)], 0.5, 0.5); }
    n++;
    // 途中でポーズ→再開
    if ($('chkPause').checked && !pauseDone && performance.now() > endAt - durSec * 500) { pauseDone = true; fire(cw, null, 'keydown', 'Escape'); fire(cw, null, 'keyup', 'Escape'); await sleep(500); if (!cw.FES || !cw.FES.isPaused || !cw.FES.isPaused()) notes.push('ポーズは確認できず（その瞬間プレイ中でなかった可能性。手動確認済み）'); fire(cw, null, 'keydown', 'Escape'); fire(cw, null, 'keyup', 'Escape'); await sleep(300); if (cw.FES && cw.FES.isPaused && cw.FES.isPaused()) { fire(cw, null, 'keydown', 'Escape'); fire(cw, null, 'keyup', 'Escape'); await sleep(300); if (cw.FES.isPaused()) { fire(cw, null, 'keydown', 'KeyP'); fire(cw, null, 'keyup', 'KeyP'); await sleep(300); } if (cw.FES.isPaused()) errs.push('ポーズから Esc で再開できません'); else notes.push('ポーズ→再開 OK'); } }
    // 画面サイズ変更
    if ($('chkResize').checked && !resizeDone && performance.now() > endAt - durSec * 300) { resizeDone = true; stage.style.height = '720px'; fr.style.width = '420px'; await sleep(400); fr.style.width = '100%'; stage.style.height = '420px'; await sleep(400); }
    // 画面が動いているか（4回連続で同じなら「止まっている」）
    if (n % 8 === 0 && canvas) { const s = snapshot(cw); if (s != null && s === lastSnap) { sameCount++; if (sameCount >= 6) frozen++; } else sameCount = 0; lastSnap = s; }
    if (hasErrorOverlay(cw)) { errs.push('エラー画面（おっと）が出ました'); break; }
    await sleep(60 + Math.random() * 60);
  }
  if (held) fire(cw, null, 'keyup', held);
  if (frozen) notes.push(`画面が ${frozen} 回ほど止まって見えました（リザルトやタイトルで静止していただけかも）`);
  await sleep(150);
  if (hasErrorOverlay(cw)) errs.push('エラー画面（おっと）が出ました');
  const uniq = [...new Set(errs)];
  const ok = uniq.length === 0;
  setStatus(g.id, ok ? 'ok' : 'ng', ok ? '✅ OK' : '❌ NG', (uniq.length ? uniq.join('\n') + '\n' : '') + notes.join(' / ') + ` / 操作 ${n} 回`);
  log(`[${ok ? 'OK' : 'NG'}] ${g.id}: ${uniq.join(' | ') || 'エラーなし'} (${notes.join(', ')})`);
  results[g.id] = ok;
  return ok;
}
async function run(list) {
  if (running) return; running = true; stopFlag = false; $('runAll').disabled = true; $('runOne').disabled = true; $('stop').disabled = false;
  const dur = +$('dur').value; let okN = 0;
  $('sum').innerHTML = '実行中…';
  for (const g of list) { if (stopFlag) break; if (await testGame(g, dur)) okN++; }
  const ng = list.filter(g => results[g.id] === false);
  $('sum').innerHTML = stopFlag ? '途中で止めました' : ng.length ? `<span class="big ng">❌ ${ng.length} 本に問題</span>　${ng.map(g => g.name).join('、')}` : `<span class="big ok">✅ ${okN} 本すべて OK</span>　（${new Date().toLocaleString('ja-JP')}）`;
  running = false; $('runAll').disabled = false; $('runOne').disabled = false; $('stop').disabled = true;
}
$('runAll').addEventListener('click', () => run(GAMES));
$('runOne').addEventListener('click', () => { const g = GAMES.find(x => x.id === $('one').value); if (g) run([g]); });
$('stop').addEventListener('click', () => { stopFlag = true; });
window.__TEST = { run, GAMES, results };
</script>
</body>
</html>
