<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ネオンストライク</title>
<style>
  html, body { margin: 0; height: 100%; background: #07071a; overflow: hidden; font-family: "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; }
  #game { position: absolute; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; cursor: none; }
  #game.title { cursor: default; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="../common.js"></script>
<script>
'use strict';
/* =====================================================================
   ネオンストライク — 一人称視点のガンシューティング。
   60 秒のミッション。奥から迫るドローンを撃ちまくり、パワーアップを集め、44 秒で現れるボス「マザードローン」の 3 つのコアを壊せ。
   操作: マウスで照準・押しっぱなしで連射 / タップした所を撃つ・指でなぞって連射 / 矢印・WASD で照準・Space で発射。R でリロード。Esc / P でポーズ。
   画面: 横長なら 960×540、スマホの縦なら 540×960 に切りかわる（どちらでも遊べる）。
   ===================================================================== */
FES.init({ id: 'fps', title: 'ネオンストライク', portraitOk: true });

const { clamp, lerp, rand, randInt, pick } = FES;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const fx = FES.fx();
const FONT = '"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif';
const TAU = Math.PI * 2;

/* ------------------------------------------------------------ ルール */
const GAME_TIME = 60, BOSS_AT = 44, MAG = 8, RELOAD_T = 0.85, LIVES = 3;
const FIRE_IV = 0.2, RAPID_IV = 0.085, POWER_T = 8, FEVER_T = 6, COMBO_KEEP = 2.5;
const RANK = { S: 30000, A: 18000, B: 9000, C: 3500 };
const TYPES = {
  drone:   { hp: 1,  pts: 100,  speed: 0.19, size: 1.0,  color: '#5ee7ff', core: '#fff',    sides: 6, label: 'ドローン' },
  swarm:   { hp: 1,  pts: 80,   speed: 0.27, size: 0.62, color: '#8dffb0', core: '#fff',    sides: 3, label: '小型機' },
  armor:   { hp: 3,  pts: 300,  speed: 0.12, size: 1.3,  color: '#ff9f43', core: '#ffd36e', sides: 6, label: '装甲機' },
  bomber:  { hp: 1,  pts: 200,  speed: 0.24, size: 0.95, color: '#ff4d8d', core: '#fff',    sides: 4, label: '爆撃機' },
  shield:  { hp: 2,  pts: 400,  speed: 0.14, size: 1.2,  color: '#b06bff', core: '#fff',    sides: 8, label: '盾ドローン' },
  gold:    { hp: 1,  pts: 500,  speed: 0.34, size: 0.75, color: '#ffd36e', core: '#fff',    sides: 5, label: '金ドローン' },
  missile: { hp: 1,  pts: 150,  speed: 0.23, size: 0.7,  color: '#ff2a4a', core: '#fff',    sides: 3, label: 'ミサイル' },
  boss:    { hp: 99, pts: 3000, speed: 0,    size: 3.0,  color: '#ff4d8d', core: '#fff',    sides: 6, label: 'マザードローン' },
};
const POWERS = {
  rapid:  { icon: '⚡', name: 'RAPID',  desc: '超連射！',        color: '#ffe66d' },
  spread: { icon: '✸', name: 'SPREAD', desc: '3体まとめて撃つ！', color: '#c86bff' },
  shield: { icon: '🛡', name: 'SHIELD', desc: 'シールド回復',     color: '#5cff8d' },
  time:   { icon: '⏱', name: '+5 SEC', desc: '時間 +5 秒',      color: '#5ee7ff' },
};

/* ------------------------------------------------------------ 画面（横長 960×540 ／ 縦長 540×960） */
let W = 960, H = 540, CX = 480, HORIZON = 248, PORTRAIT = false;
const view = { scale: 1, offsetX: 0, offsetY: 0, toGame(cx, cy) { return { x: (cx - view.offsetX) / view.scale, y: (cy - view.offsetY) / view.scale }; } };
const HUD = { m: 70, top: 14 };   // m = 左右の余白（common.js の 🏠・🔊 ボタンをよける）
let stars = [], skyline = [];
function fit() {
  const vw = innerWidth, vh = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  PORTRAIT = vh > vw * 1.05;
  W = PORTRAIT ? 540 : 960; H = PORTRAIT ? 960 : 540; CX = W / 2; HORIZON = Math.round(H * (PORTRAIT ? 0.40 : 0.46));
  const s = Math.min(vw / W, vh / H);
  view.scale = s; view.offsetX = (vw - W * s) / 2; view.offsetY = (vh - H * s) / 2;
  canvas.width = Math.round(W * s * dpr); canvas.height = Math.round(H * s * dpr);
  canvas.style.width = (W * s) + 'px'; canvas.style.height = (H * s) + 'px'; canvas.style.left = view.offsetX + 'px'; canvas.style.top = view.offsetY + 'px';
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  HUD.m = Math.max(PORTRAIT ? 12 : 70, Math.ceil(62 / s));   // 画面上の 60px ぶんは空ける
  HUD.top = PORTRAIT ? Math.max(14, Math.ceil(58 / s)) : 14;  // 縦のときは共通ボタンの下に HUD を置く
  stars = Array.from({ length: PORTRAIT ? 60 : 90 }, (_, i) => ({ x: (i * 7919) % W, y: (i * 104729) % Math.round(HORIZON * 0.95), r: 0.5 + (i % 3) * 0.5, p: (i % 7) / 7, d: 0.3 + (i % 5) * 0.2 }));
  skyline = []; let x = -20; let k = 0;
  while (x < W + 40) { const w = 14 + ((k * 37) % 40), h = 12 + ((k * 53) % 70) * (PORTRAIT ? 0.8 : 1); skyline.push({ x, w, h, win: (k * 13) % 5 }); x += w + 4 + (k % 3) * 6; k++; }
  if (G) { G.aim.x = clamp(G.aim.x, 10, W - 10); G.aim.y = clamp(G.aim.y, 10, H - 10); }
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 60));

/* 透視: 奥行き z (1=いちばん奥 … 0=目の前) */
const depthScale = z => 0.06 + (1 - z) * (1 - z) * 1.1;
function project(x, y, z) {
  const s = depthScale(z);
  const kx = PORTRAIT ? W * 0.5 : W * 0.54, ky = PORTRAIT ? H * 0.26 : H * 0.44;
  return { sx: CX + x * s * kx + (G ? G.sway * (1 - z) * 6 : 0), sy: HORIZON + y * s * ky + s * 60 * (PORTRAIT ? 1.2 : 1), s };
}
const enemyR = (e, p) => 34 * p.s * TYPES[e.type].size;

/* ------------------------------------------------------------ 状態 */
let G = null;
function newGame() {
  return {
    state: 'title', t: 0, time: GAME_TIME, elapsed: 0, score: 0, dispScore: 0, combo: 0, comboT: 0, maxCombo: 0, shots: 0, hits: 0, kills: 0, crits: 0,
    lives: LIVES, ammo: MAG, reload: 0, aim: { x: CX, y: H * 0.5 }, enemies: [], capsules: [], tracers: [], markers: [], spawnT: 1.0, wave: 1,
    recoil: 0, hurt: 0, feverT: 0, power: { rapid: 0, spread: 0 }, powerFlash: 0, lastPower: null,
    titleT: 0, countT: 0, countStep: -1, over: false, overT: 0, floorT: 0, keys: {}, sway: 0, beat: 0, beatN: 0, beatQueue: [],
    banner: null, boss: null, bossDone: false, bossBonus: 0, slow: 1, slowT: 0, danger: 0, swarmT: 9, lastTick: -1, demoT: 0, resultShown: false,
  };
}
const input = { firing: false, pointerId: null, lastFire: -9, pointerType: 'mouse' };
let paused = false;

/* ------------------------------------------------------------ 効果音（ゲーム固有） */
const SND = {
  shoot: () => { FES.tone({ freq: 880, slide: 180, dur: 0.07, type: 'square', vol: 0.12 }); FES.noise({ dur: 0.06, freq: 2400, slide: 400, vol: 0.14 }); },
  rapid: () => { FES.tone({ freq: 1200, slide: 300, dur: 0.05, type: 'square', vol: 0.08 }); FES.noise({ dur: 0.04, freq: 3000, slide: 600, vol: 0.1 }); },
  spread: () => { FES.tone({ freq: 520, slide: 120, dur: 0.1, type: 'sawtooth', vol: 0.12 }); FES.noise({ dur: 0.09, freq: 1800, slide: 200, vol: 0.18 }); },
  hit: () => FES.tone({ freq: 1400, slide: 900, dur: 0.05, type: 'triangle', vol: 0.12 }),
  crit: () => { FES.tone({ freq: 1800, slide: 2600, dur: 0.08, type: 'square', vol: 0.1 }); FES.tone({ freq: 2400, slide: 3200, dur: 0.12, type: 'sine', vol: 0.1, delay: 0.04 }); },
  kill: (type) => {
    if (type === 'gold') { [0, 0.06, 0.12].forEach((d, i) => FES.tone({ freq: [1320, 1760, 2640][i], dur: 0.14, type: 'triangle', vol: 0.14, delay: d })); return; }
    if (type === 'armor') { FES.noise({ dur: 0.35, freq: 900, slide: 80, vol: 0.4 }); FES.tone({ freq: 110, slide: 40, dur: 0.3, type: 'sine', vol: 0.35 }); return; }
    if (type === 'missile') { FES.noise({ dur: 0.25, freq: 2200, slide: 200, vol: 0.3 }); FES.tone({ freq: 700, slide: 90, dur: 0.2, type: 'sawtooth', vol: 0.12 }); return; }
    FES.noise({ dur: 0.22, freq: 1500, slide: 120, vol: 0.3 }); FES.tone({ freq: 220, slide: 50, dur: 0.18, type: 'sine', vol: 0.25 });
  },
  blocked: () => { FES.tone({ freq: 2200, slide: 1800, dur: 0.05, type: 'square', vol: 0.08 }); FES.tone({ freq: 3300, dur: 0.04, type: 'sine', vol: 0.06, delay: 0.02 }); },
  pickup: (kind) => { const base = kind === 'shield' ? 660 : kind === 'time' ? 784 : 880; [0, 0.07, 0.14, 0.21].forEach((d, i) => FES.tone({ freq: base * [1, 1.25, 1.5, 2][i], dur: 0.16, type: 'triangle', vol: 0.14, delay: d })); },
  reload: () => { FES.tone({ freq: 300, slide: 200, dur: 0.06, type: 'square', vol: 0.1 }); FES.noise({ dur: 0.05, freq: 1200, vol: 0.1, delay: 0.05 }); },
  ready: () => { FES.tone({ freq: 900, dur: 0.05, type: 'square', vol: 0.09 }); FES.tone({ freq: 1350, dur: 0.08, type: 'square', vol: 0.09, delay: 0.06 }); },
  missileWarn: () => { FES.tone({ freq: 1500, dur: 0.07, type: 'square', vol: 0.09 }); FES.tone({ freq: 1500, dur: 0.07, type: 'square', vol: 0.09, delay: 0.12 }); },
  alarm: () => { for (let i = 0; i < 4; i++) { FES.tone({ freq: 520, slide: 780, dur: 0.28, type: 'sawtooth', vol: 0.09, delay: i * 0.5 }); FES.tone({ freq: 780, slide: 520, dur: 0.22, type: 'sawtooth', vol: 0.07, delay: i * 0.5 + 0.28 }); } },
  wave: () => { FES.noise({ dur: 0.4, freq: 400, slide: 4000, vol: 0.18, filter: 'bandpass' }); FES.tone({ freq: 440, slide: 880, dur: 0.3, type: 'triangle', vol: 0.1 }); },
  bossHit: () => { FES.tone({ freq: 240, slide: 120, dur: 0.12, type: 'sawtooth', vol: 0.14 }); FES.noise({ dur: 0.1, freq: 800, slide: 200, vol: 0.2 }); },
  coreBreak: () => { FES.noise({ dur: 0.5, freq: 1200, slide: 60, vol: 0.45 }); FES.tone({ freq: 160, slide: 30, dur: 0.5, type: 'sine', vol: 0.4 }); FES.tone({ freq: 1200, slide: 2400, dur: 0.3, type: 'square', vol: 0.08, delay: 0.1 }); },
  bossDie: () => { for (let i = 0; i < 6; i++) { FES.noise({ dur: 0.5, freq: 1000 - i * 100, slide: 60, vol: 0.35, delay: i * 0.18 }); FES.tone({ freq: 90, slide: 30, dur: 0.5, type: 'sine', vol: 0.35, delay: i * 0.18 }); } },
  damage: () => { FES.noise({ dur: 0.5, freq: 700, slide: 80, vol: 0.5 }); FES.tone({ freq: 140, slide: 40, dur: 0.45, type: 'sawtooth', vol: 0.25 }); },
};

/* ------------------------------------------------------------ BGM（FES.tone をスケジュール。WAVE が進むほど音が増える） */
const BGM = { on: false, next: 0, step: 0, mode: 'w1' };
const NOTE = m => 440 * Math.pow(2, (m - 69) / 12);
const ARP = [0, 1, 2, 3, 2, 1, 0, 2, 1, 3, 2, 1, 0, 1, 3, 2];
function bgmStart(mode) { const ac = FES.audioContext(); BGM.on = true; BGM.mode = mode || BGM.mode; BGM.step = 0; BGM.next = ac ? ac.currentTime + 0.05 : 0; }
function bgmMode(mode) { BGM.mode = mode; }
function bgmStop() { BGM.on = false; }
function bgmUpdate() {
  if (!BGM.on) return;
  const ac = FES.audioContext(); if (!ac) return;
  const boss = BGM.mode === 'boss', fever = G.feverT > 0;
  const st = 60 / (boss ? 168 : fever ? 160 : 150) / 4;
  if (BGM.next < ac.currentTime - 0.3) BGM.next = ac.currentTime;   // タブ復帰時の暴走防止
  let guard = 0;
  while (BGM.next < ac.currentTime + 0.22 && guard++ < 8) {
    const d = Math.max(0, BGM.next - ac.currentTime), step = BGM.step, bar = (step >> 4) & 3, s = step & 15;
    const level = boss ? 4 : BGM.mode === 'w3' ? 3 : BGM.mode === 'w2' ? 2 : 1;
    const roots = boss ? [45, 46, 45, 43] : [45, 41, 48, 43];
    const chords = boss ? [[0, 3, 7, 10], [0, 3, 7, 10], [0, 3, 7, 12], [0, 4, 7, 10]] : [[0, 3, 7, 12], [0, 4, 7, 12], [0, 3, 7, 12], [0, 4, 7, 12]];
    const root = roots[bar], ch = chords[bar];
    // ベース（常に）
    if (s % 4 === 0 || s === 6 || s === 14 || (level >= 3 && s === 10)) FES.tone({ freq: NOTE(root), dur: st * 1.8, delay: d, type: 'sawtooth', vol: 0.055 });
    // キック・ハット（常に）／ スネア（WAVE 2 から）
    if (s % 4 === 0 || (level >= 3 && s === 14)) FES.tone({ freq: 150, slide: 40, dur: 0.12, delay: d, type: 'sine', vol: 0.22 });
    if (s % 2 === 1) FES.noise({ dur: 0.03, freq: 7000, vol: level >= 3 ? 0.035 : 0.02, delay: d, filter: 'highpass' });
    if (level >= 2 && (s === 4 || s === 12)) FES.noise({ dur: 0.11, freq: 1800, vol: 0.09, delay: d, filter: 'highpass' });
    // アルペジオ（WAVE 2 から）
    if (level >= 2) FES.tone({ freq: NOTE(root + 24 + ch[ARP[s]] + (boss && (step & 32) ? 12 : 0)), dur: st * 0.9, delay: d, type: boss ? 'sawtooth' : 'square', vol: boss ? 0.028 : 0.035 });
    // リード（WAVE 3・ボス・フィーバー）
    if ((level >= 3 || fever) && s % 8 === 0) FES.tone({ freq: NOTE(root + 36 + ch[(bar + (s >> 3)) % 4]), dur: st * 3, delay: d, type: 'square', vol: 0.025 });
    if (boss && s === 0 && bar % 2 === 0) FES.tone({ freq: NOTE(root + 12), slide: NOTE(root + 12) * 0.5, dur: st * 6, delay: d, type: 'sawtooth', vol: 0.03 });
    BGM.step = (step + 1) % 64;
    BGM.next += st;
    if (s % 4 === 0) G.beatQueue.push(ac.currentTime + d);   // 画面の拍の光
  }
}

/* ------------------------------------------------------------ ゲーム進行 */
function startGame() {
  FES.howto(['🎯 マウス / 指 を押しっぱなしで連射', '💠 まん中のコアを撃つと CRITICAL ×2', '🎁 金ドローンのカプセルを撃ってパワーアップ'], 4500);
  FES.hideResult(); FES.pause(false); FES.fever(false); fx.clear();
  const keep = G ? G.titleT : 0;
  G = newGame(); G.titleT = keep; canvas.classList.remove('title');
  G.state = 'count'; G.countT = 0; G.countStep = -1; paused = false; input.firing = false;
}
function beginPlay() { G.state = 'play'; G.t = 0; FES.sfx('go'); bgmStart('w1'); setBanner('WAVE 1', 'ドローン接近中', '#5ee7ff', 1.6); }
function setBanner(text, sub, color, dur) { G.banner = { text, sub, color, t: 0, dur: dur || 1.8 }; }

/* 出現 */
function spawn(type, opts) {
  const T = TYPES[type]; opts = opts || {};
  const lane = opts.lane != null ? opts.lane : (Math.random() * 5 | 0) - 2;
  const tm = G.elapsed;
  G.enemies.push({ type, hp: T.hp, x: opts.x != null ? opts.x : lane * 0.42 + (Math.random() - 0.5) * 0.2, y: opts.y != null ? opts.y : -0.9 + Math.random() * 1.1, z: opts.z != null ? opts.z : 1,
    vx: opts.vx != null ? opts.vx : (Math.random() - 0.5) * 0.12, bob: Math.random() * TAU, hit: 0, dead: false, deadT: 0, speed: (opts.speed || T.speed) * (1 + Math.min(0.6, tm / 100)), fired: false, phase: Math.random() * TAU, flash: 0 });
  return G.enemies[G.enemies.length - 1];
}
function spawnSwarm() {
  const cx = ((Math.random() * 3 | 0) - 1) * 0.5, n = 3 + (G.elapsed > 30 ? 2 : 0), wob = Math.random() * TAU;
  for (let i = 0; i < n; i++) { const e = spawn('swarm', { x: cx + (i - (n - 1) / 2) * 0.22, y: -0.6 - Math.abs(i - (n - 1) / 2) * 0.25, z: 1 + i * 0.03, vx: 0 }); e.phase = wob; e.swarm = true; }
}
function spawnMissile(from) {
  const p = from || { x: 0, y: -0.5, z: 0.6 };
  const e = spawn('missile', { x: p.x, y: p.y, z: p.z, vx: 0, speed: TYPES.missile.speed }); e.speed = TYPES.missile.speed * (p.z < 0.4 ? 0.8 : 1);
  SND.missileWarn();
  const pr = project(e.x, e.y, e.z); fx.text(pr.sx, pr.sy - 30, '⚠ ミサイル！ 撃ち落とせ', { color: '#ff2a4a', size: 15, life: 0.9 });
}
function spawnBoss() {
  G.boss = { type: 'boss', x: 0, y: -0.35, z: 1.02, hit: 0, dead: false, deadT: 0, dying: false, t: 0, entering: true, fireT: 2.2, cores: [
    { dx: -0.62, dy: 0.05, hp: 4, max: 4, hit: 0 }, { dx: 0.62, dy: 0.05, hp: 4, max: 4, hit: 0 }, { dx: 0, dy: -0.5, hp: 4, max: 4, hit: 0 }], flash: 0, phase: 0 };
  setBanner('⚠ WARNING', 'マザードローン 接近 — コアを 3 つ壊せ！', '#ff2a4a', 2.6);
  SND.alarm(); bgmMode('boss'); fx.shake(0.6, 0.6);
}
function director(d) {
  const tm = G.elapsed;
  // WAVE の切りかわり
  if (G.wave === 1 && tm >= 20) { G.wave = 2; setBanner('WAVE 2', '装甲機・爆撃機・盾ドローン 出現', '#ff9f43', 2); SND.wave(); bgmMode('w2'); }
  if (G.wave === 2 && tm >= 40) { G.wave = 3; setBanner('WAVE 3', '全機、突撃してくる！', '#ff4d8d', 2); SND.wave(); bgmMode('w3'); }
  if (!G.boss && !G.bossDone && tm >= BOSS_AT) spawnBoss();
  // 通常の出現
  G.spawnT -= d;
  const bossUp = G.boss && !G.boss.dying;
  if (G.spawnT <= 0) {
    const base = bossUp ? 1.6 : Math.max(0.36, 1.05 - tm * 0.014);
    G.spawnT = base * (0.7 + Math.random() * 0.6);
    const r = Math.random();
    let type = 'drone';
    if (r < 0.09) type = 'gold';
    else if (G.wave >= 2 && r < 0.31) type = 'armor';
    else if (G.wave >= 2 && r < 0.51) type = 'bomber';
    else if (G.wave >= 2 && r < 0.65) type = 'shield';
    if (bossUp && type !== 'gold') type = Math.random() < 0.5 ? 'drone' : 'bomber';
    spawn(type);
    if (!bossUp && tm > 24 && Math.random() < 0.35) spawn(Math.random() < 0.5 ? 'drone' : 'armor');
  }
  // 編隊
  G.swarmT -= d;
  if (G.swarmT <= 0 && !bossUp) { spawnSwarm(); G.swarmT = G.wave >= 3 ? 4 : G.wave === 2 ? 7 : 9; }
}

/* 発射 */
function fireInterval() { return G.power.rapid > 0 ? RAPID_IV : FIRE_IV; }
function shoot() {
  if (G.state !== 'play' || paused) return;
  if (G.reload > 0) return;
  if (G.ammo <= 0) { startReload(); return; }
  const free = G.feverT > 0 || G.power.rapid > 0;
  if (!free) G.ammo--;
  G.shots++; G.recoil = 1; input.lastFire = G.t;
  const spread = G.power.spread > 0;
  if (G.power.rapid > 0) SND.rapid(); else if (spread) SND.spread(); else SND.shoot();
  FES.vibrate(8);
  const ax = G.aim.x, ay = G.aim.y;
  // 照準に当たっている敵（手前優先）。SPREAD は近くの敵を最大 3 体
  const hits = [];
  const consider = (e, px, py, r, isBoss) => { const dd = Math.hypot(ax - px, ay - py); if (dd <= r + (spread ? 70 : 8)) hits.push({ e, px, py, r, dd, isBoss }); };
  for (const e of G.enemies) { if (e.dead) continue; const p = project(e.x, e.y, e.z); consider(e, p.sx, p.sy, enemyR(e, p), false); }
  if (G.boss && !G.boss.dying) { const b = G.boss, p = project(b.x, b.y, b.z); consider(b, p.sx, p.sy, 34 * p.s * TYPES.boss.size, true); }
  for (const c of G.capsules) { if (c.dead) continue; const p = project(c.x, c.y, c.z); const dd = Math.hypot(ax - p.sx, ay - p.sy); if (dd <= 30 * p.s + 14) hits.push({ cap: c, px: p.sx, py: p.sy, dd }); }
  hits.sort((a, b) => a.dd - b.dd);
  const targets = spread ? hits.slice(0, 3) : hits.slice(0, 1);
  const gunX = PORTRAIT ? CX + 60 : CX + 90, gunY = H + 10;
  if (!targets.length) {
    G.tracers.push({ x0: gunX, y0: gunY, x1: ax, y1: ay, life: 0.1, color: '#ffd36e' });
    fx.ring(ax, ay, { color: 'rgba(255,255,255,.45)', r: 4, r1: 26, life: 0.22 });

function hitEnemy(e, px, py, crit) {

/* ボス */

  }

}

/* ------------------------------------------------------------ 更新 */
function update(dtRaw) {
  G.t += dtRaw;

  const dt = dtRaw * G.slow;
  const d = fx.update(dt);
  G.floorT += d * (G.state === 'play' ? 1.6 : 0.6);
  G.recoil = Math.max(0, G.recoil - dtRaw * 6); G.hurt = Math.max(0, G.hurt - dtRaw * 2); G.powerFlash = Math.max(0, G.powerFlash - dtRaw * 1.5);
  G.dispScore += (G.score - G.dispScore) * Math.min(1, dtRaw * 8);
  G.sway = lerp(G.sway, (G.aim.x - CX) / CX, Math.min(1, dtRaw * 4));
  G.beat = Math.max(0, G.beat - dtRaw * 3);
  if (G.beatQueue.length) { const ac = FES.audioContext(); if (ac) while (G.beatQueue.length && G.beatQueue[0] <= ac.currentTime) { G.beatQueue.shift(); G.beat = 1; G.beatN++; } }
  if (G.banner) { G.banner.t += dtRaw; if (G.banner.t > G.banner.dur) G.banner = null; }
  // キーボードで照準
  const k = G.keys, sp = 540 * dtRaw;
  if (k.ArrowLeft || k.KeyA) G.aim.x -= sp; if (k.ArrowRight || k.KeyD) G.aim.x += sp; if (k.ArrowUp || k.KeyW) G.aim.y -= sp; if (k.ArrowDown || k.KeyS) G.aim.y += sp;
  G.aim.x = clamp(G.aim.x, 10, W - 10); G.aim.y = clamp(G.aim.y, 10, H - 10);
  for (let i = G.tracers.length - 1; i >= 0; i--) { G.tracers[i].life -= dtRaw; if (G.tracers[i].life <= 0) G.tracers.splice(i, 1); }
  for (let i = G.markers.length - 1; i >= 0; i--) { G.markers[i].life -= dtRaw; if (G.markers[i].life <= 0) G.markers.splice(i, 1); }
  if (G.state === 'title') { updateDemo(dtRaw); return; }
  if (G.state === 'count') {
    G.countT += dtRaw; const step = Math.min(3, Math.floor(G.countT / 0.7));
    if (step !== G.countStep) { G.countStep = step; if (step < 3) FES.sfx('countdown'); else beginPlay(); }
    return;
  }
  if (G.state === 'over') { G.overT += dtRaw; updateEntities(d, true); return; }
  // ---- play ----
  bgmUpdate();
  G.time -= d; G.elapsed += d;
  if (G.feverT > 0) { G.feverT -= d; if (G.feverT <= 0) FES.fever(false); }
  for (const key of ['rapid', 'spread']) if (G.power[key] > 0) { G.power[key] -= d; if (G.power[key] <= 0) { G.power[key] = 0; fx.text(CX, H * 0.6, `${POWERS[key].name} 終了`, { color: 'rgba(255,255,255,.7)', size: 16, life: 0.8 }); } }
  if (G.comboT > 0) { G.comboT -= d; if (G.comboT <= 0 && G.combo > 0) { G.combo = 0; if (FES.isFever() && G.feverT <= 0) FES.fever(false); } }
  if (G.reload > 0) { G.reload -= d; if (G.reload <= 0) { G.ammo = MAG; SND.ready(); } }
  // 連射（押しっぱなし）
  if ((input.firing || k.Space) && G.t - input.lastFire >= fireInterval()) shoot();
  director(d);
  updateEntities(d, false);
  // 時間
  if (G.time <= 10 && Math.ceil(G.time) !== G.lastTick && G.time > 0) { G.lastTick = Math.ceil(G.time); FES.sfx('tick'); }
  if (G.time <= 0) { G.time = 0; finishTime(); }
}
function updateEntities(d, ending) {
  let danger = 0;
  for (let i = G.enemies.length - 1; i >= 0; i--) {
    const e = G.enemies[i];
    if (e.dead) { e.deadT += d; if (e.deadT > 0.3) G.enemies.splice(i, 1); continue; }
    if (ending) { e.z += d * 0.3; if (e.z > 1.1) G.enemies.splice(i, 1); continue; }
    e.z -= e.speed * d; e.bob += d * 3; e.hit = Math.max(0, e.hit - d * 5); e.flash = Math.max(0, (e.flash || 0) - d * 4);
    if (e.swarm) e.x += Math.sin(G.t * 2.2 + e.phase) * d * 0.5; else e.x += e.vx * d;
    if (e.type === 'bomber' && !e.fired && e.z < 0.45) { e.fired = true; spawnMissile(e); e.vx = (e.x > 0 ? -1 : 1) * 0.25; }
    if (e.z < 0.2) danger = Math.max(danger, (0.2 - e.z) / 0.2);
    if (e.z <= 0.04) { G.enemies.splice(i, 1); damage(e); }
  }
  for (let i = G.capsules.length - 1; i >= 0; i--) {

  if (G.boss) {
    const b = G.boss; b.t += d; b.hit = Math.max(0, b.hit - d * 4); for (const c of b.cores) c.hit = Math.max(0, c.hit - d * 4);
    if (b.dying) {
      b.deadT += d;
      if (Math.random() < d * 14) { const p = project(b.x + rand(-0.6, 0.6), b.y + rand(-0.5, 0.5), b.z); fx.burst(p.sx, p.sy, { color: ['#fff', '#ffd36e', '#ff4d8d'], n: 12, speed: 220, life: 0.5, size: 4 }); fx.shake(0.3, 0.1); }
      if (b.deadT > 1.5) finishBoss();
    } else if (!ending) {
      if (b.entering) { b.z = lerp(b.z, 0.3, Math.min(1, d * 1.4)); if (b.z < 0.33) b.entering = false; }
      else { b.x = Math.sin(b.t * 0.55) * 0.45; b.y = -0.35 + Math.sin(b.t * 1.3) * 0.06; b.z = 0.31 + Math.sin(b.t * 0.8) * 0.04; }
      b.fireT -= d;
      if (b.fireT <= 0 && !b.entering) { b.fireT = 3.2 + Math.random(); spawnMissile({ x: b.x + rand(-0.3, 0.3), y: b.y + 0.3, z: b.z }); b.flash = 1; }
      b.flash = Math.max(0, b.flash - d * 3);
    }
  }
  G.danger = lerp(G.danger, danger, Math.min(1, d * 6));
}
function updateDemo(dt) {   // タイトル画面: ドローンが流れるデモ
  G.demoT -= dt;
  if (G.demoT <= 0) { G.demoT = 0.9 + Math.random(); const e = spawn(pick(['drone', 'drone', 'armor', 'gold', 'shield']), {}); e.speed *= 0.6; }
  for (let i = G.enemies.length - 1; i >= 0; i--) { const e = G.enemies[i]; e.z -= e.speed * dt; e.bob += dt * 3; e.x += e.vx * dt; if (e.z <= 0.12) G.enemies.splice(i, 1); }
}

/* ------------------------------------------------------------ 描画 */

  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = size * 0.5; }

}

function drawCorridor() {

  // 床

  // 床の横線（奥へ収束・流れる・拍で光る）

  for (let i = 0; i < 14; i++) { const z = ((i / 14 + (G.floorT * 0.12) % (1 / 14)) % 1); const p = project(0, 1, z); if (p.sy < HORIZON + 2) continue; ctx.globalAlpha = (1 - z) * (0.55 + beat * 0.4) + 0.05; ctx.strokeStyle = 'rgba(94,231,255,.5)'; ctx.beginPath(); ctx.moveTo(0, p.sy); ctx.lineTo(W, p.sy); ctx.stroke(); }
  ctx.globalAlpha = 1;
  for (let i = -3; i <= 3; i++) { const a = project(i * 0.42, 1, 1), b = project(i * 0.42, 1, 0); ctx.strokeStyle = i === 0 ? 'rgba(255,77,141,.35)' : 'rgba(94,231,255,.22)'; ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke(); }
  // 壁・ネオン柱
  const wallX = PORTRAIT ? 1.08 : 1.35, wallTop = PORTRAIT ? -2.6 : -1.6;

  ctx.fillStyle = 'rgba(4,4,20,.6)'; ctx.fillRect(0, 0, W, H);
  const flick = Math.sin(t * 23) > 0.97 ? 0.6 : 1;
  const ty = PORTRAIT ? 150 : 110, S = PORTRAIT ? 0.78 : 1;
  ctx.save(); ctx.globalAlpha = flick;
  text('NEON STRIKE', CX, ty - 50 * S, 16 * S, '#5ee7ff', { w: 700 });
  text('ネオンストライク', CX, ty, 72 * S, '#fff', { glow: '#ff4d8d', stroke: 'rgba(0,0,0,.5)' });
  ctx.restore();
  text('— FPS SHOOTING ／ 60 秒のミッション —', CX, ty + 52 * S, 17 * S, 'rgba(255,255,255,.75)', { w: 700 });
  text(`HI-SCORE ${FES.getHiScore().toLocaleString()}`, CX, ty + 88 * S, 20 * S, '#ffd36e');
  const bw = Math.min(W - 40, 560), bx = CX - bw / 2, by = ty + 112 * S, lh = PORTRAIT ? 30 : 28, lines = [
    ['🎯', '奥から迫るドローンを撃ちまくれ！ まん中のコアで CRITICAL ×2'],
    ['🎁', '金ドローンのカプセルを撃つと パワーアップ（連射・3WAY・回復・＋5秒）'],
    ['🛡', '盾ドローンは「OPEN」の時だけ当たる。ミサイルは撃ち落とせ'],
    ['👑', '44 秒でボス登場！ コアを 3 つ壊せば MISSION COMPLETE で大ボーナス'],
  ];
  ctx.fillStyle = 'rgba(0,0,0,.4)'; rr(bx, by, bw, lh * lines.length + 16, 16); ctx.fill();
  lines.forEach(([ic, s], i) => { const y = by + 8 + lh * (i + 0.5); text(ic, bx + 24, y, 16 * S, '#fff'); text(s, bx + 44, y, PORTRAIT ? 12.5 : 14, i === 3 ? '#ffd36e' : 'rgba(255,255,255,.9)', { align: 'left', w: 700 }); });
  const btnY = by + lh * lines.length + 16 + (PORTRAIT ? 70 : 56);
  const pulse = 1 + Math.sin(t * 4) * 0.04;
  ctx.save(); ctx.translate(CX, btnY); ctx.scale(pulse, pulse);
  ctx.shadowColor = '#ff4d8d'; ctx.shadowBlur = 24; ctx.fillStyle = '#ff4d8d'; rr(-130, -30, 260, 60, 30); ctx.fill(); ctx.shadowBlur = 0;
  text('▶ スタート！', 0, 2, 26, '#fff'); ctx.restore();
  text(PORTRAIT ? 'タップで照準＆発射 ／ 押しっぱなしで連射' : 'マウス（押しっぱなしで連射）／ タップ・なぞって連射 ／ 矢印・WASD ＋ Space', CX, btnY + 52, PORTRAIT ? 12 : 13, 'rgba(255,255,255,.6)', { w: 700 });
  text('タップ / クリック / Enter / Space でスタート', CX, btnY + 74, 12, 'rgba(255,255,255,.45)', { w: 700 });
}
function drawCount() {
  const step = G.countStep, k = (G.countT - step * 0.7) / 0.7; const label = ['3', '2', '1'][step] || 'GO!'; const sc = 1.6 - Math.min(1, k) * 0.6;
  ctx.save(); ctx.translate(CX, H * 0.38); ctx.scale(sc, sc); text(label, 0, 0, 120, label === 'GO!' ? '#5cff8d' : '#fff', { glow: label === 'GO!' ? '#5cff8d' : '#ff4d8d', stroke: 'rgba(0,0,0,.6)' }); ctx.restore();
  text('MISSION START', CX, H * 0.38 + 90, 22, 'rgba(255,255,255,.85)');
}
function render() {
  fx.begin(ctx);
  drawCorridor();
  const list = G.enemies.slice().sort((a, b) => b.z - a.z);
  let bossDrawn = !G.boss;
  for (const e of list) { if (!bossDrawn && e.z < G.boss.z) { drawBoss(G.boss); bossDrawn = true; } drawEnemy(e); }
  if (!bossDrawn) drawBoss(G.boss);
  for (const c of G.capsules) drawCapsule(c);
  for (const tr of G.tracers) { ctx.save(); ctx.globalAlpha = clamp(tr.life / 0.1, 0, 1); ctx.strokeStyle = tr.color; ctx.shadowColor = tr.color; ctx.shadowBlur = 10; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(tr.x0, tr.y0 - 170 * (PORTRAIT ? 0.8 : 1)); ctx.lineTo(tr.x1, tr.y1); ctx.stroke(); ctx.restore(); }
  fx.draw(ctx);
  if (G.state !== 'title') drawGun();
  fx.end(ctx);
  fx.drawFlash(ctx, W, H);
  drawHUD(); drawCrosshair();
  if (G.state === 'title') drawTitle();
  if (G.state === 'count') drawCount();
}

/* ------------------------------------------------------------ 入力 */
function togglePause() {
  if (G.state !== 'play') return;
  paused = !paused; input.firing = false;
  if (paused) { bgmStop(); FES.pause(true, { onResume: () => { if (paused) togglePause(); }, onRetry: () => { FES.pause(false); paused = false; startGame(); FES.sfx('start'); } }); }
  else { FES.pause(false); bgmStart(BGM.mode); }
}
function pressStart() { if (G.state === 'title') { startGame(); FES.sfx('start'); return true; } return false; }
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.code === 'Escape' || e.code === 'KeyP') { if (!e.repeat) togglePause(); return; }
  if (paused) return;
  G.keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') { if (!pressStart()) shoot(); }
  if (e.code === 'KeyR') startReload();
});
window.addEventListener('keyup', e => { G.keys[e.code] = false; });
canvas.addEventListener('pointermove', e => {
  if (G.state === 'title' || paused) return;
  if (e.pointerType !== 'mouse' && input.pointerId !== null && e.pointerId !== input.pointerId) return;
  const p = view.toGame(e.clientX, e.clientY); G.aim.x = p.x; G.aim.y = p.y;
});
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); if (paused) return;
  if (pressStart()) return;
  const p = view.toGame(e.clientX, e.clientY); G.aim.x = p.x; G.aim.y = p.y;
  input.pointerId = e.pointerId; input.pointerType = e.pointerType; input.firing = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  shoot();
});
const endPointer = e => { if (e.pointerId === input.pointerId || input.pointerType === 'mouse') { input.firing = false; input.pointerId = null; } };
canvas.addEventListener('pointerup', endPointer); canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play' && !paused) togglePause(); });
canvas.classList.add('title');

/* ------------------------------------------------------------ ループ */
G = newGame();
fit();
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) update(dt);
  render();
}
requestAnimationFrame(frame);
</script>
</body>
