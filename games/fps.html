<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ネオンストライク</title>
<style>
  html, body { margin: 0; height: 100%; background: #07071a; overflow: hidden; font-family: "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; }
  #game { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; cursor: none; }
  #game.title { cursor: default; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="../common.js"></script>
<script>
'use strict';
/* =====================================================================
   ネオンストライク — 一人称視点のガンシューティング。奥から迫るドローンを 60 秒で撃ちまくる。
   操作: マウスで照準・クリックで発射 / タップした所を撃つ / 矢印・WASD で照準・Space で発射。R でリロード。Esc / P でポーズ。
   ===================================================================== */
FES.init({ id: 'fps', title: 'ネオンストライク' });

const W = 960, H = 540, CX = W / 2, HORIZON = H * 0.46;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const view = FES.fitCanvas(canvas, W, H);
const fx = FES.fx();
const FONT = '"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif';
const TAU = Math.PI * 2;
const GAME_TIME = 60, MAG = 8, RELOAD_T = 0.9, LIVES = 3;
const RANK = { S: 15000, A: 9000, B: 5000, C: 2000 };
const TYPES = {
  drone:  { hp: 1, pts: 100, speed: 0.19, size: 1.0, color: '#5ee7ff', core: '#fff' },
  armor:  { hp: 3, pts: 300, speed: 0.12, size: 1.3, color: '#ff9f43', core: '#ffd36e' },
  bomber: { hp: 1, pts: 200, speed: 0.30, size: 0.9, color: '#ff4d8d', core: '#fff' },
  gold:   { hp: 1, pts: 500, speed: 0.34, size: 0.75, color: '#ffd36e', core: '#fff' },
};

let G = null;
const stars = Array.from({ length: 70 }, (_, i) => ({ x: (i * 7919) % W, y: (i * 104729) % Math.round(HORIZON), r: 0.5 + (i % 3) * 0.5, p: (i % 7) / 7 }));
function newGame() {
  return { state: 'title', t: 0, time: GAME_TIME, score: 0, dispScore: 0, combo: 0, maxCombo: 0, shots: 0, hits: 0, kills: 0, crits: 0, lives: LIVES,
    ammo: MAG, reload: 0, aim: { x: CX, y: H * 0.5 }, aimTarget: null, enemies: [], tracers: [], spawnT: 1.2, wave: 1, recoil: 0, hurt: 0, feverT: 0,
    titleT: 0, countT: 0, countStep: -1, over: false, overT: 0, floorT: 0, keys: {} };
}
G = newGame();

/* ------------------------------------------------------------ 透視: 奥行き z (1=いちばん奥 … 0=目の前) */
const depthScale = z => 0.06 + (1 - z) * (1 - z) * 1.1;        // 近いほど大きい（2乗で手前が速く見える）
const project = (x, y, z) => { const s = depthScale(z); return { sx: CX + x * s * 520, sy: HORIZON + y * s * 240 + s * 60, s }; };

function startGame() {
  FES.howto(['🎯 マウス / タップ で照準、クリック / Space で発射', '💠 まん中のコアを撃つと CRITICAL ×2', '🔄 弾は 8 発。R か 自動でリロード']);
  FES.hideResult(); FES.pause(false); FES.fever(false); fx.clear();
  G = newGame(); canvas.classList.remove('title');
  G.state = 'count'; G.countT = 0; G.countStep = -1;
}
function beginPlay() { G.state = 'play'; G.t = 0; FES.sfx('go'); }

/* ------------------------------------------------------------ 敵 */
function spawn() {
  const r = Math.random(), tm = GAME_TIME - G.time;
  let type = 'drone';
  if (r < 0.08) type = 'gold'; else if (r < 0.08 + Math.min(0.3, tm / 120)) type = 'armor'; else if (r < 0.08 + Math.min(0.3, tm / 120) + Math.min(0.3, tm / 100)) type = 'bomber';
  const T = TYPES[type];
  const lane = (Math.random() * 5 | 0) - 2;
  G.enemies.push({ type, hp: T.hp, x: lane * 0.42 + (Math.random() - 0.5) * 0.2, y: -0.9 + Math.random() * 1.1, z: 1, vx: (Math.random() - 0.5) * 0.12, bob: Math.random() * TAU, hit: 0, dead: false, deadT: 0, speed: T.speed * (1 + tm / 90) });
}
function shoot() {
  if (G.state !== 'play') return;
  if (G.reload > 0) return;
  if (G.ammo <= 0) { startReload(); return; }
  if (G.feverT <= 0) G.ammo--;
  G.shots++; G.recoil = 1;
  FES.sfx('shoot'); FES.noise({ dur: 0.08, freq: 1800, slide: 300, vol: 0.2 }); FES.vibrate(10);
  const ax = G.aim.x, ay = G.aim.y;
  // いちばん手前（z が小さい）で照準に当たっている敵
  let best = null, bestD = 9, crit = false;
  for (const e of G.enemies) {
    if (e.dead) continue;
    const p = project(e.x, e.y, e.z), r = 34 * p.s * TYPES[e.type].size;
    const d = Math.hypot(ax - p.sx, ay - p.sy);
    if (d <= r + 6 && e.z < bestD) { best = e; bestD = e.z; crit = d <= r * 0.32; }
  }
  const tgt = best ? project(best.x, best.y, best.z) : { sx: ax, sy: ay, s: 0.3 };
  G.tracers.push({ x0: CX + 90, y0: H + 10, x1: tgt.sx, y1: tgt.sy, life: 0.12 });
  if (!best) { fx.ring(ax, ay, { color: 'rgba(255,255,255,.5)', r: 4, r1: 26, life: 0.25 }); G.combo = 0; if (FES.isFever() && G.feverT <= 0) FES.fever(false); if (G.ammo <= 0) startReload(); return; }
  G.hits++;
  const T = TYPES[best.type];
  const dmg = crit ? 2 : 1;
  best.hp -= dmg; best.hit = 1;
  fx.burst(tgt.sx, tgt.sy, { color: [T.color, '#fff'], n: crit ? 16 : 8, speed: 180 * tgt.s + 60, life: 0.4, size: 3 + tgt.s * 3, gravity: 120, shape: 'spark' });
  if (crit) { fx.text(tgt.sx, tgt.sy - 40 * tgt.s - 10, 'CRITICAL!', { color: '#ffd36e', size: 20 + tgt.s * 10, life: 0.7 }); G.crits++; FES.sfx('perfect'); }
  if (best.hp <= 0) {
    best.dead = true; best.deadT = 0; G.kills++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
    const mult = 1 + Math.min(10, Math.floor(G.combo / 5)) * 0.5;
    const pts = Math.round(T.pts * (crit ? 2 : 1) * mult);
    G.score += pts;
    fx.text(tgt.sx, tgt.sy - 20, `+${pts}`, { color: best.type === 'gold' ? '#ffd36e' : '#fff', size: 18 + tgt.s * 14, life: 0.8 });
    fx.burst(tgt.sx, tgt.sy, { color: [T.color, T.core, '#fff'], n: 24, speed: 260 * tgt.s + 80, life: 0.6, size: 4 + tgt.s * 4, gravity: 300, shape: best.type === 'armor' ? 'rect' : 'circle' });
    fx.ring(tgt.sx, tgt.sy, { color: T.color, r: 10, r1: 90 * tgt.s + 30, life: 0.4 });
    if (best.z < 0.25) { fx.shake(0.5, 0.25); fx.hitStop(0.03); }
    FES.sfx(best.type === 'gold' ? 'coin' : 'explode');
    if (G.combo > 0 && G.combo % 5 === 0) { fx.text(CX, H * 0.3, `${G.combo} COMBO!`, { color: '#ff9ee8', size: 34, life: 1 }); FES.sfx('combo'); }
    if (G.combo === 10) { FES.fever(true, 'FEVER! 弾が減らない'); G.feverT = 6; G.ammo = MAG; }
  } else { FES.sfx('hit'); }
  if (G.ammo <= 0 && G.feverT <= 0) startReload();
}
function startReload() { if (G.reload > 0 || G.ammo >= MAG) return; G.reload = RELOAD_T; FES.sfx('tick'); fx.text(CX, H * 0.62, 'RELOAD…', { color: '#5ee7ff', size: 22, life: 0.6, vy: -20 }); }
function damage(e) {
  G.lives--; G.hurt = 1; G.combo = 0; if (FES.isFever() && G.feverT <= 0) FES.fever(false);
  fx.shake(1.2, 0.5); fx.flash('#ff2a4a', 0.45, 0.25); FES.sfx('wrong'); FES.vibrate([50, 40, 60]);
  fx.text(CX, H * 0.5, e.type === 'bomber' ? '💥 爆発！' : 'ぶつかった！', { color: '#ff4d8d', size: 36, life: 1 });
  if (G.lives <= 0) { G.state = 'over'; G.overT = 0; FES.fever(false); FES.sfx('gameover'); setTimeout(showResult, 1500); }
}
function finishTime() { G.state = 'over'; G.overT = 0; FES.fever(false); FES.sfx('fanfare'); fx.flash('#fff', 0.4, 0.3); setTimeout(showResult, 1500); }
function showResult() {
  const acc = G.shots ? Math.round(G.hits / G.shots * 100) : 0;
  FES.showResult({
    score: G.score, scoreLabel: 'pt', title: G.lives > 0 ? 'TIME UP!' : 'GAME OVER',
    subtitle: `${G.kills} 機撃破 ／ 命中率 ${acc}%`,
    rank: RANK, titles: { S: '伝説のガンナー', A: 'エースガンナー', B: 'いい腕！', C: 'まずまず', D: 'つぎはもっと！' },
    stats: [{ label: '撃破', value: G.kills }, { label: 'CRITICAL', value: G.crits }, { label: '命中率', value: acc + '%' }, { label: 'MAX COMBO', value: G.maxCombo }],
  }, startGame);
}

/* ------------------------------------------------------------ 更新 */
function update(dt) {
  G.t += dt;
  const d = fx.update(dt);
  G.floorT += d * (G.state === 'play' ? 1.6 : 0.6);
  G.recoil = Math.max(0, G.recoil - d * 6); G.hurt = Math.max(0, G.hurt - d * 2);
  G.dispScore += (G.score - G.dispScore) * Math.min(1, d * 8);
  // キーボードで照準
  const k = G.keys, sp = 520 * d;
  if (k.ArrowLeft || k.KeyA) G.aim.x -= sp; if (k.ArrowRight || k.KeyD) G.aim.x += sp; if (k.ArrowUp || k.KeyW) G.aim.y -= sp; if (k.ArrowDown || k.KeyS) G.aim.y += sp;
  G.aim.x = FES.clamp(G.aim.x, 10, W - 10); G.aim.y = FES.clamp(G.aim.y, 10, H - 10);
  for (let i = G.tracers.length - 1; i >= 0; i--) { G.tracers[i].life -= d; if (G.tracers[i].life <= 0) G.tracers.splice(i, 1); }
  if (G.state === 'count') {
    G.countT += dt; const step = Math.min(3, Math.floor(G.countT / 0.7));
    if (step !== G.countStep) { G.countStep = step; if (step < 3) FES.sfx('countdown'); else beginPlay(); }
  }
  if (G.state !== 'play') { if (G.state === 'over') G.overT += d; return; }
  G.time -= d;
  if (G.feverT > 0) { G.feverT -= d; if (G.feverT <= 0) FES.fever(false); }
  if (G.reload > 0) { G.reload -= d; if (G.reload <= 0) { G.ammo = MAG; FES.sfx('select'); } }
  // 出現（時間がたつほど多く）
  G.spawnT -= d;
  if (G.spawnT <= 0) { spawn(); const tm = GAME_TIME - G.time; G.spawnT = Math.max(0.35, 1.1 - tm * 0.012) * (0.7 + Math.random() * 0.6); if (tm > 20 && Math.random() < 0.3) spawn(); }
  for (let i = G.enemies.length - 1; i >= 0; i--) {
    const e = G.enemies[i];
    if (e.dead) { e.deadT += d; if (e.deadT > 0.3) G.enemies.splice(i, 1); continue; }
    e.z -= e.speed * d; e.x += e.vx * d; e.bob += d * 3; e.hit = Math.max(0, e.hit - d * 5);
    if (e.z <= 0.04) { G.enemies.splice(i, 1); damage(e); }
  }
  if (G.time <= 10 && Math.floor(G.time) !== Math.floor(G.time + d) && G.time > 0) FES.sfx('tick');
  if (G.time <= 0) { G.time = 0; finishTime(); }
}

/* ------------------------------------------------------------ 描画 */
function text(s, x, y, size, color, o) {
  o = o || {};
  ctx.save(); ctx.font = `${o.w || 900} ${size}px ${FONT}`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = size * 0.5; }
  if (o.stroke) { ctx.lineWidth = Math.max(3, size * 0.14); ctx.lineJoin = 'round'; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.restore();
}
function drawCorridor() {
  // 空
  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON); sky.addColorStop(0, '#05041a'); sky.addColorStop(1, '#1a0f3e'); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, HORIZON);
  ctx.fillStyle = '#fff'; for (const s of stars) { ctx.globalAlpha = 0.3 + 0.5 * Math.sin(G.t * 2 + s.p * TAU) * 0.5 + 0.25; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill(); } ctx.globalAlpha = 1;
  // 奥の光
  const glow = ctx.createRadialGradient(CX, HORIZON + 20, 0, CX, HORIZON + 20, 260); glow.addColorStop(0, 'rgba(120,80,255,.55)'); glow.addColorStop(1, 'rgba(120,80,255,0)'); ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  // 床
  const fl = ctx.createLinearGradient(0, HORIZON, 0, H); fl.addColorStop(0, '#120d2c'); fl.addColorStop(1, '#241a4e'); ctx.fillStyle = fl; ctx.fillRect(0, HORIZON, W, H - HORIZON);
  // 床の横線（奥へ収束・流れる）
  ctx.strokeStyle = 'rgba(94,231,255,.35)'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 14; i++) { const z = ((i / 14 + (G.floorT * 0.12) % (1 / 14)) % 1); const p = project(0, 1, z); if (p.sy < HORIZON + 2) continue; ctx.globalAlpha = (1 - z) * 0.7 + 0.05; ctx.beginPath(); ctx.moveTo(0, p.sy); ctx.lineTo(W, p.sy); ctx.stroke(); }
  ctx.globalAlpha = 1;
  // 縦線（レーン）とサイドの壁
  for (let i = -3; i <= 3; i++) { const a = project(i * 0.42, 1, 1), b = project(i * 0.42, 1, 0.0); ctx.strokeStyle = i === 0 ? 'rgba(255,77,141,.35)' : 'rgba(94,231,255,.22)'; ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke(); }
  for (const side of [-1, 1]) {
    const a = project(side * 1.35, 1, 1), b = project(side * 1.35, 1, 0.0), c = project(side * 1.35, -1.6, 0.0), d = project(side * 1.35, -1.6, 1);
    ctx.fillStyle = 'rgba(20,12,50,.75)'; ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.lineTo(c.sx, c.sy); ctx.lineTo(d.sx, d.sy); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.shadowColor = side < 0 ? '#ff4d8d' : '#5ee7ff'; ctx.shadowBlur = 12; ctx.strokeStyle = side < 0 ? 'rgba(255,77,141,.8)' : 'rgba(94,231,255,.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke(); ctx.beginPath(); ctx.moveTo(d.sx, d.sy); ctx.lineTo(c.sx, c.sy); ctx.stroke(); ctx.restore();
    // 壁のネオン看板（流れる）
    for (let i = 0; i < 6; i++) { const z = (i / 6 + (G.floorT * 0.12) % (1 / 6)) % 1; const p1 = project(side * 1.34, -0.9, z), p2 = project(side * 1.34, -0.9, Math.min(1, z + 0.04)); ctx.globalAlpha = (1 - z) * 0.5; ctx.strokeStyle = i % 2 ? '#ffd36e' : '#b06bff'; ctx.lineWidth = 3 * p1.s + 1; ctx.beginPath(); ctx.moveTo(p1.sx, p1.sy); ctx.lineTo(p2.sx, p2.sy); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
}
function drawEnemy(e) {
  const T = TYPES[e.type], p = project(e.x, e.y + Math.sin(e.bob) * 0.05, e.z), r = 34 * p.s * T.size;
  if (p.sy < -50 || p.sy > H + 50) return;
  ctx.save(); ctx.translate(p.sx, p.sy);
  if (e.dead) { ctx.globalAlpha = 1 - e.deadT / 0.3; ctx.scale(1 + e.deadT * 3, 1 + e.deadT * 3); }
  const danger = e.z < 0.2 ? (0.2 - e.z) / 0.2 : 0;
  ctx.shadowColor = danger > 0 ? '#ff2a4a' : T.color; ctx.shadowBlur = 16 * p.s + 6 + danger * 20;
  // 本体（六角形）
  ctx.fillStyle = e.hit > 0 ? '#fff' : `rgba(20,16,50,.95)`; ctx.strokeStyle = danger > 0.5 && Math.floor(G.t * 10) % 2 ? '#ff2a4a' : T.color; ctx.lineWidth = Math.max(1.5, 3 * p.s);
  ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + G.t * (e.type === 'gold' ? 2 : 0.6); ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill(); ctx.stroke();
  if (e.type === 'armor') { ctx.strokeStyle = 'rgba(255,159,67,.6)'; ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + G.t * 0.6 + TAU / 12; ctx.lineTo(Math.cos(a) * r * 0.75, Math.sin(a) * r * 0.75); } ctx.closePath(); ctx.stroke(); for (let i = 0; i < e.hp; i++) { ctx.fillStyle = '#ff9f43'; ctx.fillRect(-r * 0.5 + i * r * 0.5, -r - 10 * p.s - 6, r * 0.4, 4 * p.s + 2); } }
  if (e.type === 'bomber') { ctx.fillStyle = `rgba(255,77,141,${0.5 + 0.5 * Math.sin(G.t * 12)})`; ctx.beginPath(); ctx.arc(0, -r * 0.1, r * 0.55, 0, TAU); ctx.fill(); }
  // コア（弱点）
  ctx.shadowBlur = 20 * p.s + 8; ctx.fillStyle = T.core; ctx.beginPath(); ctx.arc(0, 0, Math.max(2, r * 0.3), 0, TAU); ctx.fill();
  ctx.fillStyle = T.color; ctx.beginPath(); ctx.arc(0, 0, Math.max(1, r * 0.14), 0, TAU); ctx.fill();
  ctx.restore();
}
function drawGun() {
  const rc = G.recoil * 18;
  const gx = CX + 90, gy = H + 10 + rc;
  ctx.save(); ctx.translate(gx, gy); ctx.rotate(-0.1 + G.recoil * 0.1);
  // 銃身
  ctx.fillStyle = '#1c1c34'; ctx.strokeStyle = '#5ee7ff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(-34, -150, 68, 160, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2a2a4a'; ctx.beginPath(); ctx.roundRect(-22, -170, 44, 30, 6); ctx.fill(); ctx.strokeStyle = '#ff4d8d'; ctx.stroke();
  ctx.fillStyle = '#5ee7ff'; ctx.shadowColor = '#5ee7ff'; ctx.shadowBlur = 12; ctx.fillRect(-26, -120, 52, 4); ctx.fillRect(-26, -100, 52, 4);
  // 弾数ランプ
  for (let i = 0; i < MAG; i++) { ctx.fillStyle = i < G.ammo || G.feverT > 0 ? (G.feverT > 0 ? '#ffd36e' : '#5cff8d') : 'rgba(255,255,255,.12)'; ctx.shadowBlur = i < G.ammo ? 8 : 0; ctx.fillRect(-28 + i * 7, -60, 5, 14); }
  // 発射の光
  if (G.recoil > 0.5) { ctx.globalAlpha = (G.recoil - 0.5) * 2; ctx.fillStyle = '#fff'; ctx.shadowColor = '#ffd36e'; ctx.shadowBlur = 30; ctx.beginPath(); ctx.arc(0, -176, 18 + G.recoil * 10, 0, TAU); ctx.fill(); }
  ctx.restore();
  if (G.reload > 0) { const k = 1 - G.reload / RELOAD_T; ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.roundRect(CX + 40, H - 150, 100, 10, 5); ctx.fill(); ctx.fillStyle = '#5ee7ff'; ctx.beginPath(); ctx.roundRect(CX + 40, H - 150, 100 * k, 10, 5); ctx.fill(); }
}
function drawCrosshair() {
  if (G.state === 'title') return;
  const { x, y } = G.aim; const r = 18 + G.recoil * 10;
  // 照準の下に敵がいるか
  let on = false; for (const e of G.enemies) { if (e.dead) continue; const p = project(e.x, e.y, e.z); if (Math.hypot(x - p.sx, y - p.sy) <= 34 * p.s * TYPES[e.type].size + 6) { on = true; break; } }
  ctx.save(); ctx.translate(x, y); ctx.strokeStyle = on ? '#ff4d8d' : '#fff'; ctx.lineWidth = 2; ctx.shadowColor = on ? '#ff4d8d' : '#5ee7ff'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
  [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.moveTo(dx * (r - 6), dy * (r - 6)); ctx.lineTo(dx * (r + 8), dy * (r + 8)); ctx.stroke(); });
  ctx.fillStyle = on ? '#ff4d8d' : '#fff'; ctx.beginPath(); ctx.arc(0, 0, 2, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawHUD() {
  if (G.state === 'title') return;
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.roundRect(20, 16, 220, 64, 14); ctx.fill();
  text('SCORE', 60, 34, 11, 'rgba(255,255,255,.6)'); text(Math.round(G.dispScore).toLocaleString(), 130, 60, 26, '#ffd36e', { glow: 'rgba(255,211,110,.6)' });
  text('COMBO', 205, 34, 11, 'rgba(255,255,255,.6)'); text(G.combo >= 2 ? `×${G.combo}` : '—', 205, 60, 22, G.combo >= 10 ? '#ff4d8d' : '#5ee7ff');
  // 時間（中央）
  const tl = Math.max(0, G.time), urgent = tl <= 10;
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.roundRect(CX - 60, 14, 120, 50, 14); ctx.fill();
  text(Math.ceil(tl).toString(), CX, 40, 34, urgent ? '#ff4d8d' : '#fff', { glow: urgent ? '#ff4d8d' : null });
  // ライフ（右）
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.roundRect(W - 180, 16, 160, 64, 14); ctx.fill();
  text('SHIELD', W - 100, 34, 11, 'rgba(255,255,255,.6)');
  for (let i = 0; i < LIVES; i++) { ctx.save(); ctx.translate(W - 130 + i * 30, 58); ctx.fillStyle = i < G.lives ? '#5cff8d' : 'rgba(255,255,255,.15)'; ctx.shadowColor = '#5cff8d'; ctx.shadowBlur = i < G.lives ? 10 : 0; ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(10, -5); ctx.lineTo(10, 4); ctx.lineTo(0, 11); ctx.lineTo(-10, 4); ctx.lineTo(-10, -5); ctx.closePath(); ctx.fill(); ctx.restore(); }
  if (urgent && G.state === 'play') { ctx.fillStyle = `rgba(255,40,80,${0.12 + 0.1 * Math.sin(G.t * 8)})`; ctx.fillRect(0, 0, W, H); }
  if (G.hurt > 0) { const g = ctx.createRadialGradient(CX, H / 2, H * 0.3, CX, H / 2, H * 0.8); g.addColorStop(0, 'rgba(255,0,40,0)'); g.addColorStop(1, `rgba(255,0,40,${G.hurt * 0.6})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  if (G.state === 'over') text(G.lives > 0 ? 'TIME UP!' : 'GAME OVER', CX, H * 0.42, 60, G.lives > 0 ? '#ffd36e' : '#ff4d8d', { glow: G.lives > 0 ? '#ffd36e' : '#ff4d8d', stroke: 'rgba(0,0,0,.6)' });
}
function drawTitle() {
  G.titleT += 1 / 60; const t = G.titleT;
  ctx.fillStyle = 'rgba(4,4,20,.55)'; ctx.fillRect(0, 0, W, H);
  text('ネオンストライク', CX, 120, 70, '#fff', { glow: '#ff4d8d', stroke: 'rgba(0,0,0,.5)' });
  text('— NEON STRIKE ／ FPS SHOOTING —', CX, 172, 18, 'rgba(255,255,255,.7)', { w: 700 });
  text(`HI-SCORE ${FES.getHiScore().toLocaleString()}`, CX, 210, 20, '#ffd36e');
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.roundRect(CX - 260, 238, 520, 128, 16); ctx.fill();
  text('奥から迫ってくるドローンを 60 秒で撃ちまくれ！', CX, 264, 17, '#fff', { w: 700 });
  text('💠 まん中のコアに当てると CRITICAL ×2 ／ 連続撃破でコンボ', CX, 292, 16, '#ffd36e', { w: 700 });
  text('🛡 ぶつかられると シールドが 1 つ減る（3 つでゲームオーバー）', CX, 318, 16, 'rgba(255,255,255,.85)', { w: 700 });
  text('マウスで照準・クリックで発射 ／ タップした所を撃つ ／ 矢印・WASD ＋ Space', CX, 346, 14, 'rgba(255,255,255,.6)', { w: 700 });
  const pulse = 1 + Math.sin(t * 4) * 0.04;
  ctx.save(); ctx.translate(CX, 430); ctx.scale(pulse, pulse);
  ctx.shadowColor = '#ff4d8d'; ctx.shadowBlur = 24; ctx.fillStyle = '#ff4d8d'; ctx.beginPath(); ctx.roundRect(-130, -30, 260, 60, 30); ctx.fill(); ctx.shadowBlur = 0;
  text('▶ スタート！', 0, 2, 26, '#fff'); ctx.restore();
  text('タップ / クリック / Enter / Space でスタート', CX, 490, 13, 'rgba(255,255,255,.55)', { w: 700 });
}
function drawCount() {
  const step = G.countStep, k = (G.countT - step * 0.7) / 0.7; const label = ['3', '2', '1'][step] || 'GO!'; const sc = 1.6 - Math.min(1, k) * 0.6;
  ctx.save(); ctx.translate(CX, H * 0.38); ctx.scale(sc, sc); text(label, 0, 0, 120, label === 'GO!' ? '#5cff8d' : '#fff', { glow: label === 'GO!' ? '#5cff8d' : '#ff4d8d', stroke: 'rgba(0,0,0,.6)' }); ctx.restore();
  text('READY...', CX, H * 0.38 + 90, 24, 'rgba(255,255,255,.8)');
}
function render() {
  fx.begin(ctx);
  drawCorridor();
  // 敵は奥から順に
  G.enemies.slice().sort((a, b) => b.z - a.z).forEach(drawEnemy);
  // 弾道
  for (const tr of G.tracers) { ctx.save(); ctx.globalAlpha = tr.life / 0.12; ctx.strokeStyle = '#ffd36e'; ctx.shadowColor = '#ffd36e'; ctx.shadowBlur = 10; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(tr.x0, tr.y0 - 170); ctx.lineTo(tr.x1, tr.y1); ctx.stroke(); ctx.restore(); }
  fx.draw(ctx);
  if (G.state !== 'title') drawGun();
  fx.end(ctx);
  fx.drawFlash(ctx, W, H);
  drawHUD(); drawCrosshair();
  if (G.state === 'title') drawTitle();
  if (G.state === 'count') drawCount();
}

/* ------------------------------------------------------------ 入力 */
let paused = false;
function togglePause() {
  if (G.state !== 'play') return;
  paused = !paused;
  if (paused) FES.pause(true, { onResume: () => { if (paused) togglePause(); }, onRetry: () => { FES.pause(false); paused = false; startGame(); } });
  else FES.pause(false);
}
function pressStart() { if (G.state === 'title') { startGame(); FES.sfx('start'); return true; } return false; }
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.code === 'Escape' || e.code === 'KeyP') { if (!e.repeat) togglePause(); return; }
  if (paused) return;
  G.keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') { if (!pressStart()) shoot(); }
  if (e.code === 'KeyR') startReload();
});
window.addEventListener('keyup', e => { G.keys[e.code] = false; });
canvas.addEventListener('pointermove', e => { if (G.state === 'title' || paused) return; const p = view.toGame(e.clientX, e.clientY); G.aim.x = p.x; G.aim.y = p.y; });
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); if (paused) return;
  if (pressStart()) return;
  const p = view.toGame(e.clientX, e.clientY); G.aim.x = p.x; G.aim.y = p.y;
  shoot();
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.classList.add('title');

/* ------------------------------------------------------------ ループ */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) update(dt);
  render();
}
requestAnimationFrame(frame);
</script>
</body>
