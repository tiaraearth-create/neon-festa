<style>

  #game.title { cursor: default; }
</style>
</head>

<canvas id="game"></canvas>
<script src="../common.js"></script>
<script>
'use strict';
/* =====================================================================
   ネオンストライク — 一人称視点のガンシューティング。
   60 秒のミッション。奥から迫るドローンを撃ちまくり、パワーアップを集め、44 秒で現れるボス「マザードローン」の 3 つのコアを壊せ。
   操作: マウスで照準・押しっぱなしで連射 / タップした所を撃つ・指でなぞって連射 / 矢印・WASD で照準・Space で発射。R でリロード。Esc / P でポーズ。
   画面: 横長なら 960×540、スマホの縦なら 540×960 に切りかわる（どちらでも遊べる）。
   ===================================================================== */
FES.init({ id: 'fps', title: 'ネオンストライク', portraitOk: true });

const { clamp, lerp, rand, randInt, pick } = FES;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const fx = FES.fx();
const FONT = '"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif';
const TAU = Math.PI * 2;

/* ------------------------------------------------------------ ルール */

const DODGE_KEY = () => PORTRAIT ? '◀ ▶' : 'A・D';
/* ステージ: 22 秒ごとに場所が変わる（背景・床・敵の攻撃が変わる）。最後にボス */

  { name: 'NEON CITY',     jp: 'ネオン街',         sub: 'ドローンが近づいてくる！',            sky: ['#02010e', '#120a36', '#2e1258'], floor: ['#120d2c', '#261b52'], line: '94,231,255',  wall: ['#ff4d8d', '#5ee7ff'], glow: '140,90,255', color: '#5ee7ff' },
  { name: 'SPACE STATION', jp: '宇宙ステーション', sub: '敵がビームを撃ってくる！ 横によけろ', sky: ['#000208', '#03122a', '#0a2a48'], floor: ['#06142a', '#0c2a4a'], line: '92,255,200',  wall: ['#5cff8d', '#5ee7ff'], glow: '60,180,255', color: '#5cff8d' },
  { name: 'ENEMY BASE',    jp: '敵の基地',         sub: '全機が突撃してくる！ ボスはもうすぐ',   sky: ['#0a0004', '#2a0610', '#4a0e14'], floor: ['#1c0608', '#3a0e10'], line: '255,120,60',  wall: ['#ff2a4a', '#ff9f43'], glow: '255,60,40',  color: '#ff9f43' },
];

const WEAPONS = {
  mg:    { key: 1, icon: '🔫', name: 'MACHINE GUN', short: 'MG',    color: '#5ee7ff', mag: 8, iv: 0.2,  reload: 0.85, desc: '押しっぱなしで連射' },
  shot:  { key: 2, icon: '💥', name: 'SHOTGUN',     short: 'SHOT',  color: '#ff9f43', mag: 4, iv: 0.62, reload: 1.0,  desc: '近くの敵をまとめて吹き飛ばす・装甲機に強い' },
  laser: { key: 3, icon: '⚡', name: 'LASER',       short: 'LASER', color: '#ff4dff', iv: 0.09, desc: '押しているあいだ照射・盾も貫通・使いすぎるとオーバーヒート' },
  lock:  { key: 4, icon: '🎯', name: 'LOCK-ON',     short: 'LOCK',  color: '#5cff8d', iv: 0.4,  desc: '押したまま敵をなぞって最大8体 → 離すと一斉発射' },
};
const WLIST = ['mg', 'shot', 'laser', 'lock'];
const LOCK_MAX = 8, SHOT_R = 95, HEAT_UP = 0.42, HEAT_DOWN = 0.3, OVERHEAT_T = 1.3;
/* よける: 左・中・右の 3 レーン */
const LANE_X = 0.62, BEAM_WARN = [1.05, 1.05, 0.85];
const BURST_KILL = 0.07, BURST_CORE = 0.05, MULTI_WIN = 0.35;   // NEON BURST ゲージ（1 で満タン）・マルチキルの間隔
const MULTI = [null, null, { text: 'DOUBLE KILL', pts: 150, color: '#5ee7ff' }, { text: 'TRIPLE KILL', pts: 400, color: '#ffd36e' }, { text: 'MULTI KILL!!', pts: 800, color: '#ff4d8d' }];
const RANK = { S: 60000, A: 35000, B: 16000, C: 6000 };   // 武器・ロックオン・ステージで点が出やすくなったので上げた（目安。本番の様子で調整）
const TYPES = {
  drone:   { hp: 1,  pts: 100,  speed: 0.19, size: 1.0,  color: '#5ee7ff', core: '#fff',    sides: 6, label: 'ドローン' },
  swarm:   { hp: 1,  pts: 80,   speed: 0.27, size: 0.62, color: '#8dffb0', core: '#fff',    sides: 3, label: '小型機' },
  armor:   { hp: 3,  pts: 300,  speed: 0.12, size: 1.3,  color: '#ff9f43', core: '#ffd36e', sides: 6, label: '装甲機' },
  bomber:  { hp: 1,  pts: 200,  speed: 0.24, size: 0.95, color: '#ff4d8d', core: '#fff',    sides: 4, label: '爆撃機' },
  shield:  { hp: 2,  pts: 400,  speed: 0.14, size: 1.2,  color: '#b06bff', core: '#fff',    sides: 8, label: '盾ドローン' },
  gold:    { hp: 1,  pts: 500,  speed: 0.34, size: 0.75, color: '#ffd36e', core: '#fff',    sides: 5, label: '金ドローン' },
  missile: { hp: 1,  pts: 150,  speed: 0.23, size: 0.7,  color: '#ff2a4a', core: '#fff',    sides: 3, label: 'ミサイル' },
  phantom: { hp: 2,  pts: 600,  speed: 0.17, size: 1.0,  color: '#e14bff', core: '#fff',    sides: 5, label: 'ファントム' },
  ufo:     { hp: 1,  pts: 2000, speed: 0,    size: 3.0,  color: '#5cff8d', core: '#fff',    sides: 8, label: 'UFO' },
  boss:    { hp: 99, pts: 3000, speed: 0,    size: 3.0,  color: '#ff4d8d', core: '#fff',    sides: 6, label: 'マザードローン' },
};
const POWERS = {
  rapid:  { icon: '⚡', name: 'RAPID',  desc: '超連射・弾が減らない！', color: '#ffe66d' },
  spread: { icon: '✸', name: 'SPREAD', desc: 'マシンガンが3体まとめて撃つ！', color: '#c86bff' },
  shield: { icon: '🛡', name: 'SHIELD', desc: 'シールド +1',       color: '#5cff8d' },
  time:   { icon: '⏱', name: '+5 SEC', desc: '時間が5秒のびる！',   color: '#5ee7ff' },
};

/* ------------------------------------------------------------ 画面（横長 960×540 ／ 縦長 540×960） */
let W = 960, H = 540, CX = 480, HORIZON = 248, PORTRAIT = false;
const view = { scale: 1, offsetX: 0, offsetY: 0, toGame(cx, cy) { return { x: (cx - view.offsetX) / view.scale, y: (cy - view.offsetY) / view.scale }; } };
const HUD = { m: 70, top: 14 };   // m = 左右の余白（common.js の 🏠・🔊 ボタンをよける）
let stars = [];
function fit() {
  const vw = innerWidth, vh = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  PORTRAIT = vh > vw * 1.05;
  W = PORTRAIT ? 540 : 960; H = PORTRAIT ? 960 : 540; CX = W / 2; HORIZON = Math.round(H * (PORTRAIT ? 0.40 : 0.46));
  const s = Math.min(vw / W, vh / H);
  view.scale = s; view.offsetX = (vw - W * s) / 2; view.offsetY = (vh - H * s) / 2;
  canvas.width = Math.round(W * s * dpr); canvas.height = Math.round(H * s * dpr);
  canvas.style.width = (W * s) + 'px'; canvas.style.height = (H * s) + 'px'; canvas.style.left = view.offsetX + 'px'; canvas.style.top = view.offsetY + 'px';
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  HUD.m = Math.max(PORTRAIT ? 12 : 70, Math.ceil(62 / s));   // 画面上の 60px ぶんは空ける
  HUD.top = PORTRAIT ? Math.max(14, Math.ceil(58 / s)) : 14;  // 縦のときは共通ボタンの下に HUD を置く
  stars = Array.from({ length: 14 }, (_, i) => ({ x: (i * 7919) % W, y: (i * 104729) % Math.round(HORIZON * 0.8), p: (i % 7) / 7 }));   // またたく星（少しだけ）
  buildBackdrops(); buildPost();
  if (G) { G.aim.x = clamp(G.aim.x, 10, W - 10); G.aim.y = clamp(G.aim.y, 10, H - 10); }
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 60));

/* 透視: 奥行き z (1=いちばん奥 … 0=目の前) */
const depthScale = z => 0.06 + (1 - z) * (1 - z) * 1.1;
function project(x, y, z) {
  const s = depthScale(z);
  const kx = PORTRAIT ? W * 0.5 : W * 0.54, ky = PORTRAIT ? H * 0.26 : H * 0.44;
  return { sx: CX + (x - (G ? G.laneX * LANE_X : 0)) * s * kx + (G ? G.sway * (1 - z) * 6 : 0), sy: HORIZON + y * s * ky + s * 60 * (PORTRAIT ? 1.2 : 1), s };
}
const enemyR = (e, p) => 34 * p.s * TYPES[e.type].size;

/* ------------------------------------------------------------ 絵（最初に 1 回だけ描いておき、遊んでいる間は drawImage で貼るだけ。低スペック PC でも軽い） */
const SR = 50, SS = 160;   // 敵の絵: 半径 50 の機体を 160×160 の中に描く（2 倍の解像度で持つ）
const hexA = (h, a) => `rgba(${parseInt(h.slice(1, 3), 16)},${parseInt(h.slice(3, 5), 16)},${parseInt(h.slice(5, 7), 16)},${a})`;
function canvasOf(w, h, k) { const c = document.createElement('canvas'); c.width = Math.ceil(w * k); c.height = Math.ceil(h * k); const g = c.getContext('2d'); g.scale(k, k); return [c, g]; }
function whiteOf(src) { const c = document.createElement('canvas'); c.width = src.width; c.height = src.height; const g = c.getContext('2d'); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); return c; }
function gPoly(g, r, n, rot) { g.beginPath(); for (let i = 0; i < n; i++) { const a = i * TAU / n + rot; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); }
function gLine(g, x0, y0, x1, y1) { g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
function gDot(g, x, y, r, col) { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function metal(g, r, a, b) { const gr = g.createLinearGradient(0, -r, 0, r); gr.addColorStop(0, a); gr.addColorStop(1, b); return gr; }
function glowStroke(g, col, w, blur) { g.save(); g.shadowColor = col; g.shadowBlur = blur; g.strokeStyle = col; g.lineWidth = w; g.lineJoin = 'round'; g.stroke(); g.restore(); }
function halo(g, col, r, x, y) { x = x || 0; y = y || 0; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function socket(g, R, col) { gDot(g, 0, 0, R * 0.34, '#05061a'); g.beginPath(); g.arc(0, 0, R * 0.34, 0, TAU); g.strokeStyle = hexA(col, 0.9); g.lineWidth = 2; g.stroke(); halo(g, hexA(col, 0.5), R * 0.42); }
const PAINT = {
  drone(g, R, col) {
    halo(g, hexA(col, 0.22), R * 1.5); g.lineCap = 'round';
    for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      g.strokeStyle = '#1b2244'; g.lineWidth = R * 0.16; gLine(g, 0, 0, sx * R * 0.95, sy * R * 0.62);
      g.strokeStyle = hexA(col, 0.7); g.lineWidth = 2; gLine(g, sx * R * 0.3, sy * R * 0.2, sx * R * 0.95, sy * R * 0.62);
      g.save(); g.translate(sx * R * 0.95, sy * R * 0.62);
      g.fillStyle = hexA(col, 0.16); g.beginPath(); g.ellipse(0, 0, R * 0.38, R * 0.13, 0, 0, TAU); g.fill(); g.strokeStyle = hexA(col, 0.8); g.lineWidth = 1.5; g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1; gLine(g, -R * 0.32, 0, R * 0.32, 0);
      gDot(g, 0, 0, R * 0.09, '#0b1030'); g.strokeStyle = col; g.stroke();
      g.restore();
    }
    gPoly(g, R * 0.78, 6, Math.PI / 6); g.fillStyle = metal(g, R, '#3a4884', '#0a0f2c'); g.fill(); glowStroke(g, col, 3, 10);
    g.strokeStyle = 'rgba(255,255,255,.16)'; g.lineWidth = 1.2; gPoly(g, R * 0.56, 6, Math.PI / 6); g.stroke();
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + Math.PI / 6; gLine(g, Math.cos(a) * R * 0.56, Math.sin(a) * R * 0.56, Math.cos(a) * R * 0.78, Math.sin(a) * R * 0.78); }
    g.fillStyle = 'rgba(255,255,255,.14)'; g.beginPath(); g.ellipse(0, -R * 0.5, R * 0.4, R * 0.1, 0, 0, TAU); g.fill();
    socket(g, R, col);
  },
  swarm(g, R, col) {
    halo(g, hexA(col, 0.2), R * 1.3);
    g.beginPath(); g.moveTo(0, R * 0.95); g.lineTo(R * 1.05, -R * 0.3); g.lineTo(R * 0.4, -R * 0.18); g.lineTo(R * 0.22, -R * 0.62); g.lineTo(-R * 0.22, -R * 0.62); g.lineTo(-R * 0.4, -R * 0.18); g.lineTo(-R * 1.05, -R * 0.3); g.closePath();
    g.fillStyle = metal(g, R, '#245a46', '#061a12'); g.fill(); glowStroke(g, col, 2.5, 8);
    g.strokeStyle = hexA(col, 0.5); g.lineWidth = 1.5; gLine(g, R * 0.25, -R * 0.1, R * 0.85, -R * 0.26); gLine(g, -R * 0.25, -R * 0.1, -R * 0.85, -R * 0.26);
    for (const sx of [-1, 1]) { halo(g, 'rgba(255,255,255,.7)', R * 0.2, sx * R * 0.14, -R * 0.62); gDot(g, sx * R * 0.14, -R * 0.62, R * 0.07, '#fff'); }
    gDot(g, 0, 0, R * 0.28, '#05061a'); halo(g, hexA(col, 0.5), R * 0.36);
  },
  armor(g, R, col) {
    halo(g, hexA(col, 0.2), R * 1.45);
    for (const sx of [-1, 1]) { g.fillStyle = metal(g, R, '#5a4a3a', '#1d140c'); g.beginPath(); g.roundRect(sx * R * 0.98 - R * 0.17, -R * 0.3, R * 0.34, R * 0.74, 5); g.fill(); g.strokeStyle = hexA(col, 0.8); g.lineWidth = 2; g.stroke(); gDot(g, sx * R * 0.98, R * 0.46, R * 0.08, '#05061a'); }
    gPoly(g, R * 0.9, 8, Math.PI / 8); g.fillStyle = metal(g, R, '#64503a', '#1a1008'); g.fill(); glowStroke(g, col, 3.5, 10);
    g.save(); gPoly(g, R * 0.9, 8, Math.PI / 8); g.clip();
    g.fillStyle = 'rgba(255,211,110,.55)';
    for (let x = -R; x < R; x += R * 0.24) { g.beginPath(); g.moveTo(x, -R); g.lineTo(x + R * 0.12, -R); g.lineTo(x + R * 0.24, -R * 0.66); g.lineTo(x + R * 0.12, -R * 0.66); g.closePath(); g.fill(); }
    g.restore();
    g.strokeStyle = 'rgba(255,200,140,.35)'; g.lineWidth = 2; gPoly(g, R * 0.68, 8, Math.PI / 8); g.stroke();
    for (let i = 0; i < 8; i++) { const a = i * TAU / 8; gDot(g, Math.cos(a) * R * 0.79, Math.sin(a) * R * 0.79, 2.4, 'rgba(255,214,170,.7)'); }
    socket(g, R, col);
  },
  bomber(g, R, col) {
    halo(g, hexA(col, 0.2), R * 1.5);
    g.beginPath(); g.moveTo(0, -R * 0.7); g.quadraticCurveTo(R * 0.7, -R * 0.6, R * 1.18, R * 0.1); g.lineTo(R * 0.5, R * 0.25); g.lineTo(R * 0.25, R * 0.78); g.lineTo(0, R * 0.5); g.lineTo(-R * 0.25, R * 0.78); g.lineTo(-R * 0.5, R * 0.25); g.lineTo(-R * 1.18, R * 0.1); g.quadraticCurveTo(-R * 0.7, -R * 0.6, 0, -R * 0.7); g.closePath();
    g.fillStyle = metal(g, R, '#561f42', '#140611'); g.fill(); glowStroke(g, col, 3, 10);
    g.strokeStyle = hexA(col, 0.45); g.lineWidth = 1.5; for (const sx of [-1, 1]) gLine(g, sx * R * 0.25, -R * 0.42, sx * R * 0.9, R * 0.06);
    for (const sx of [-1, 1]) { halo(g, 'rgba(255,255,255,.6)', R * 0.14, sx * R * 1.02, R * 0.09); gDot(g, sx * R * 1.02, R * 0.09, R * 0.05, '#fff'); }
    socket(g, R, col);
  },
  shield(g, R, col) {
    halo(g, hexA(col, 0.25), R * 1.5);
    const sg = g.createRadialGradient(-R * 0.3, -R * 0.35, R * 0.08, 0, 0, R * 0.85); sg.addColorStop(0, '#8a6ad0'); sg.addColorStop(0.5, '#2a1650'); sg.addColorStop(1, '#0d0620');
    g.fillStyle = sg; g.beginPath(); g.arc(0, 0, R * 0.82, 0, TAU); g.fill(); glowStroke(g, col, 2.5, 10);
    g.strokeStyle = hexA(col, 0.6); g.lineWidth = 3; g.beginPath(); g.ellipse(0, 0, R * 0.82, R * 0.22, 0, 0, TAU); g.stroke();
    for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + Math.PI / 4; gDot(g, Math.cos(a) * R * 0.82, Math.sin(a) * R * 0.82, 3.5, '#fff'); }
    socket(g, R, col);
  },
  gold(g, R) {
    halo(g, 'rgba(255,211,110,.35)', R * 1.6);
    g.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? R * 0.5 : R * 1.0, a = i * Math.PI / 5 - Math.PI / 2; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath();
    const gg = g.createLinearGradient(-R, -R, R, R); gg.addColorStop(0, '#fff6c8'); gg.addColorStop(0.45, '#ffb020'); gg.addColorStop(1, '#8a5200'); g.fillStyle = gg; g.fill(); glowStroke(g, '#ffd36e', 2.5, 12);
    g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = 1; for (let i = 0; i < 5; i++) { const a = i * TAU / 5 - Math.PI / 2; gLine(g, 0, 0, Math.cos(a) * R, Math.sin(a) * R); }
    g.fillStyle = '#fff'; g.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? 2 : 8, a = i * Math.PI / 4; g.lineTo(-R * 0.36 + Math.cos(a) * r, -R * 0.42 + Math.sin(a) * r); } g.closePath(); g.fill();
    gDot(g, 0, 0, R * 0.26, '#5a3400'); halo(g, 'rgba(255,240,180,.6)', R * 0.36);
  },
  missile(g, R, col) {
    halo(g, hexA(col, 0.2), R * 1.1);
    for (const sx of [-1, 1]) { g.fillStyle = '#8a1020'; g.beginPath(); g.moveTo(sx * R * 0.2, -R * 0.95); g.lineTo(sx * R * 0.55, -R * 1.05); g.lineTo(sx * R * 0.2, -R * 0.5); g.closePath(); g.fill(); }
    g.beginPath(); g.roundRect(-R * 0.22, -R * 0.95, R * 0.44, R * 1.3, R * 0.12); g.fillStyle = metal(g, R, '#f0f0f8', '#7a7a92'); g.fill();
    g.fillStyle = col; g.fillRect(-R * 0.22, -R * 0.42, R * 0.44, R * 0.12); g.fillRect(-R * 0.22, -R * 0.2, R * 0.44, R * 0.05);
    g.beginPath(); g.moveTo(-R * 0.22, R * 0.33); g.lineTo(0, R * 0.98); g.lineTo(R * 0.22, R * 0.33); g.closePath(); g.fillStyle = col; g.fill(); glowStroke(g, col, 2, 8);
  },
  phantom(g, R, col) {
    halo(g, hexA(col, 0.22), R * 1.5);

/* ------------------------------------------------------------ BGM（FES.tone をスケジュール。WAVE が進むほど音が増える） */
const BGM = { on: false, next: 0, step: 0, mode: 'w1' };
const NOTE = m => 440 * Math.pow(2, (m - 69) / 12);
const ARP = [0, 1, 2, 3, 2, 1, 0, 2, 1, 3, 2, 1, 0, 1, 3, 2];
function bgmStart(mode) { const ac = FES.audioContext(); BGM.on = true; BGM.mode = mode || BGM.mode; BGM.step = 0; BGM.next = ac ? ac.currentTime + 0.05 : 0; }
function bgmMode(mode) { BGM.mode = mode; }
function bgmStop() { BGM.on = false; }
function bgmUpdate() {
  if (!BGM.on) return;
  const ac = FES.audioContext(); if (!ac) return;
  const boss = BGM.mode === 'boss', fever = G.feverT > 0, rage = boss && G.boss && G.boss.rage;
  const st = 60 / (rage ? 182 : boss ? 168 : fever ? 160 : 150) / 4;
  if (BGM.next < ac.currentTime - 0.3) BGM.next = ac.currentTime;   // タブ復帰時の暴走防止
  let guard = 0;
  while (BGM.next < ac.currentTime + 0.22 && guard++ < 8) {
    const d = Math.max(0, BGM.next - ac.currentTime), step = BGM.step, bar = (step >> 4) & 3, s = step & 15;
    const level = boss ? 4 : BGM.mode === 'w3' ? 3 : BGM.mode === 'w2' ? 2 : 1;
    const roots = boss ? [45, 46, 45, 43] : [45, 41, 48, 43];
    const chords = boss ? [[0, 3, 7, 10], [0, 3, 7, 10], [0, 3, 7, 12], [0, 4, 7, 10]] : [[0, 3, 7, 12], [0, 4, 7, 12], [0, 3, 7, 12], [0, 4, 7, 12]];
    const root = roots[bar], ch = chords[bar];
    // ベース（常に）
    if (s % 4 === 0 || s === 6 || s === 14 || (level >= 3 && s === 10)) FES.tone({ freq: NOTE(root), dur: st * 1.8, delay: d, type: 'sawtooth', vol: 0.055 });
    // キック・ハット（常に）／ スネア（WAVE 2 から）
    if (s % 4 === 0 || (level >= 3 && s === 14)) FES.tone({ freq: 150, slide: 40, dur: 0.12, delay: d, type: 'sine', vol: 0.22 });
    if (s % 2 === 1) FES.noise({ dur: 0.03, freq: 7000, vol: level >= 3 ? 0.035 : 0.02, delay: d, filter: 'highpass' });
    if (level >= 2 && (s === 4 || s === 12)) FES.noise({ dur: 0.11, freq: 1800, vol: 0.09, delay: d, filter: 'highpass' });
    // アルペジオ（WAVE 2 から）
    if (level >= 2) FES.tone({ freq: NOTE(root + 24 + ch[ARP[s]] + (boss && (step & 32) ? 12 : 0)), dur: st * 0.9, delay: d, type: boss ? 'sawtooth' : 'square', vol: boss ? 0.028 : 0.035 });
    // リード（WAVE 3・ボス・フィーバー）
    if ((level >= 3 || fever) && s % 8 === 0) FES.tone({ freq: NOTE(root + 36 + ch[(bar + (s >> 3)) % 4]), dur: st * 3, delay: d, type: 'square', vol: 0.025 });
    if (boss && s === 0 && bar % 2 === 0) FES.tone({ freq: NOTE(root + 12), slide: NOTE(root + 12) * 0.5, dur: st * 6, delay: d, type: 'sawtooth', vol: 0.03 });
    BGM.step = (step + 1) % 64;
    BGM.next += st;
    if (s % 4 === 0) G.beatQueue.push(ac.currentTime + d);   // 画面の拍の光
  }
}

/* ------------------------------------------------------------ 更新 */
function update(dtRaw) {

  G.recoil = Math.max(0, G.recoil - dtRaw * 6); G.hurt = Math.max(0, G.hurt - dtRaw * 2); G.powerFlash = Math.max(0, G.powerFlash - dtRaw * 1.5);

  G.sway = lerp(G.sway, (G.aim.x - CX) / CX, Math.min(1, dtRaw * 4));
  G.beat = Math.max(0, G.beat - dtRaw * 3);
  G.kick = Math.max(0, G.kick - dtRaw * 5); G.burstFlash = Math.max(0, G.burstFlash - dtRaw * 1.5); G.warp = Math.max(0, G.warp - dtRaw * 0.9); G.wswitch = Math.max(0, G.wswitch - dtRaw * 4);

  updateBooms(d);
  if (G.cine) { G.cine.t += dtRaw; if (G.cine.t > G.cine.dur) G.cine = null; }
  for (let i = G.shards.length - 1; i >= 0; i--) { const s = G.shards[i]; s.life -= d; if (s.life <= 0) { G.shards.splice(i, 1); continue; } s.vy += 520 * d; s.x += s.vx * d; s.y += s.vy * d; s.rot += s.vr * d; }
  if (G.beatQueue.length) { const ac = FES.audioContext(); if (ac) while (G.beatQueue.length && G.beatQueue[0] <= ac.currentTime) { G.beatQueue.shift(); G.beat = 1; G.beatN++; } }
  if (G.banner) { G.banner.t += dtRaw; if (G.banner.t > G.banner.dur) G.banner = null; }
  // キーボードで照準（矢印）。A / D はよける

  if (k.ArrowLeft) G.aim.x -= sp; if (k.ArrowRight) G.aim.x += sp; if (k.ArrowUp) G.aim.y -= sp; if (k.ArrowDown) G.aim.y += sp;

  for (let i = G.markers.length - 1; i >= 0; i--) { G.markers[i].life -= dtRaw; if (G.markers[i].life <= 0) G.markers.splice(i, 1); }
  if (G.state === 'title') { updateDemo(dtRaw); return; }

  G.time -= d; G.elapsed += d;
  if (G.feverT > 0) { G.feverT -= d; if (G.feverT <= 0) FES.fever(false); }
  for (const key of ['rapid', 'spread']) if (G.power[key] > 0) { G.power[key] -= d; if (G.power[key] <= 0) { G.power[key] = 0; fx.text(CX, H * 0.6, `${POWERS[key].name} 終了`, { color: 'rgba(255,255,255,.7)', size: 16, life: 0.8 }); } }

function updateEntities(d, ending) {

    e.z -= e.speed * d; e.bob += d * 3; e.hit = Math.max(0, e.hit - d * 5); e.flash = Math.max(0, (e.flash || 0) - d * 4);

    if (e.type === 'missile' && e.z > 0.16) e.x += clamp(G.lane * LANE_X - e.x, -1, 1) * d * 1.1;   // 近づくまでは追ってくる
    if (e.type === 'bomber' && !e.fired && e.z < 0.45) { e.fired = true; spawnMissile(e); e.vx = (e.x > 0 ? -1 : 1) * 0.25; }
    if (e.z < 0.2) danger = Math.max(danger, (0.2 - e.z) / 0.2);
    if (e.z <= 0.04) {
      G.enemies.splice(i, 1);
      if (Math.abs(e.x - G.lane * LANE_X) < 0.42) damage(e);
      else { G.dodges++; G.score += 50; SND.evade(); fx.text(e.x < G.lane * LANE_X ? W * 0.2 : W * 0.8, H * 0.55, 'よけた！ +50', { color: '#5cff8d', size: PORTRAIT ? 16 : 20, life: 0.7 }); }
    }
  }
  for (let i = G.capsules.length - 1; i >= 0; i--) {
    const c = G.capsules[i]; c.t += d;
    if (c.dead) { G.capsules.splice(i, 1); continue; }
    c.z -= c.speed * d; c.bob += d * 2;
    if (c.z <= 0.02) G.capsules.splice(i, 1);
  }
  if (G.boss) {
    const b = G.boss; b.t += d; b.hit = Math.max(0, b.hit - d * 4); for (const c of b.cores) c.hit = Math.max(0, c.hit - d * 4);
    if (b.dying) {
      b.deadT += d;
      if (Math.random() < d * 14) { const p = project(b.x + rand(-0.6, 0.6), b.y + rand(-0.5, 0.5), b.z); fx.burst(p.sx, p.sy, { color: ['#fff', '#ffd36e', '#ff4d8d'], n: 12, speed: 220, life: 0.5, size: 4 }); boom(p.sx, p.sy, rand(40, 80), '#ff4d8d'); fx.shake(0.3, 0.1); }
      if (b.deadT > 1.5) finishBoss();
    } else if (!ending) {

  ctx.fillStyle = 'rgba(4,4,20,.6)'; ctx.fillRect(0, 0, W, H);
  const flick = Math.sin(t * 23) > 0.97 ? 0.6 : 1;
  const ty = PORTRAIT ? 150 : 110, S = PORTRAIT ? 0.78 : 1;
  ctx.save(); ctx.globalAlpha = flick;
  text('NEON STRIKE', CX, ty - 50 * S, 16 * S, '#5ee7ff', { w: 700 });
  if (!FES.lite()) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; drawGlow('#ff4d8d', CX, ty, 330 * S, 0.35, 0.35); ctx.restore(); ctx.globalAlpha = flick; }
  const lg = ctx.createLinearGradient(0, ty - 36 * S, 0, ty + 36 * S); lg.addColorStop(0, '#ffffff'); lg.addColorStop(0.5, '#ffc2e6'); lg.addColorStop(0.52, '#ff4d8d'); lg.addColorStop(1, '#b06bff');
  text('ネオンストライク', CX, ty, 72 * S, lg, { glow: '#ff4d8d', stroke: 'rgba(0,0,0,.6)' });
  ctx.restore();
  text('― FPS SHOOTING ／ 3ステージ・70秒のミッション ―', CX, ty + 52 * S, 17 * S, 'rgba(255,255,255,.75)', { w: 700 });
  text(`HI-SCORE ${FES.getHiScore().toLocaleString()}`, CX, ty + 88 * S, 20 * S, '#ffd36e');
  const bw = Math.min(W - 40, 560), bx = CX - bw / 2, by = ty + 112 * S, lh = PORTRAIT ? 30 : 28, lines = [
    ['🔫', PORTRAIT ? '右下のボタンで4つの武器を切りかえ' : '1〜4キーで武器を切りかえ（マシンガン・ショットガン・レーザー・ロックオン）'],
    ['🎯', PORTRAIT ? 'ロックオンは、なぞって最大8体 → 離すと一斉発射！' : 'ロックオンは、押したまま敵をなぞって最大8体 → 離すと一斉発射！'],
    ['↔', `${DODGE_KEY()}で左右によける。赤い予告のビームに注意！`],
    ['💥', PORTRAIT ? '倒すとたまるゲージが満タンで、左下のNEON BURST' : '倒すとたまるゲージが満タンで、NEON BURST（右クリック・E）'],
    ['👑', PORTRAIT ? '3ステージを進んで、ボスの3つのコアを壊せ！' : '3ステージを進んで、ボスの3つのコアを壊せ！ 空のUFOは +2000'],
  ];
  ctx.fillStyle = 'rgba(0,0,0,.4)'; rr(bx, by, bw, lh * lines.length + 16, 16); ctx.fill();
  lines.forEach(([ic, s], i) => { const y = by + 8 + lh * (i + 0.5); FES.drawIcon(ctx, ic, bx + 24, y, 20 * S + 2, i === 4 ? '#ffd36e' : i === 3 ? '#5ee7ff' : '#ff9ee8', null); text(s, bx + 44, y, PORTRAIT ? 12 : 14, i === 4 ? '#ffd36e' : i === 3 ? '#5ee7ff' : 'rgba(255,255,255,.9)', { align: 'left', w: 700 }); });
  const btnY = by + lh * lines.length + 16 + (PORTRAIT ? 70 : 56);
  const pulse = 1 + Math.sin(t * 4) * 0.04;
  ctx.save(); ctx.translate(CX, btnY); ctx.scale(pulse, pulse);
  ctx.shadowColor = '#ff4d8d'; ctx.shadowBlur = 24; ctx.fillStyle = '#ff4d8d'; rr(-130, -30, 260, 60, 30); ctx.fill(); ctx.shadowBlur = 0;
  text('▶ スタート！', 0, 2, 26, '#fff'); ctx.restore();
  text(PORTRAIT ? 'タップで照準と発射 ／ 押しっぱなしで連射' : 'マウスで照準・押しっぱなしで連射 ／ 1〜4キーで武器 ／ A・Dでよける ／ EでBURST', CX, btnY + 52, PORTRAIT ? 12 : 13, 'rgba(255,255,255,.6)', { w: 700 });
  text('タップ・クリック・Enter・Spaceでスタート', CX, btnY + 74, 12, 'rgba(255,255,255,.45)', { w: 700 });
}
function drawCount() {
  const step = G.countStep, k = (G.countT - step * 0.7) / 0.7; const label = ['3', '2', '1'][step] || 'GO!'; const sc = 1.6 - Math.min(1, k) * 0.6;
  ctx.save(); ctx.translate(CX, H * 0.38); ctx.scale(sc, sc); text(label, 0, 0, 120, label === 'GO!' ? '#5cff8d' : '#fff', { glow: label === 'GO!' ? '#5cff8d' : '#ff4d8d', stroke: 'rgba(0,0,0,.6)' }); ctx.restore();
  text('MISSION START', CX, H * 0.38 + 90, 22, 'rgba(255,255,255,.85)');
}
function render() {
  fx.begin(ctx);
  const roll = (G.lane - G.laneX) * -0.05;   // よけるときに少しかたむく
  if (G.kick > 0 || G.recoil > 0 || roll || G.cine) {   // 撃破・BURST で画面がぐっと寄る／撃つと少し上にはねる
    const kz = 1 + G.kick * 0.035 + (G.cine ? Math.sin(Math.min(1, G.cine.t / G.cine.dur) * Math.PI) * 0.05 : 0); ctx.translate(CX, H * 0.5); ctx.scale(kz, kz); ctx.rotate(roll); ctx.translate(-CX, -H * 0.5 + G.recoil * 2.5);
  }
  drawCorridor();
  drawReflections();
  const list = G.enemies.slice().sort((a, b) => b.z - a.z);
  let bossDrawn = !G.boss;
  for (const e of list) { if (!bossDrawn && e.z < G.boss.z) { drawBoss(G.boss); bossDrawn = true; } drawEnemy(e); }
  if (!bossDrawn) drawBoss(G.boss);
  for (const c of G.capsules) drawCapsule(c);
  drawBooms();
  drawShards();
  for (const tr of G.tracers) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = clamp(tr.life / 0.1, 0, 1); ctx.strokeStyle = tr.color; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(tr.x0, tr.y0 - 170 * (PORTRAIT ? 0.8 : 1)); ctx.lineTo(tr.x1, tr.y1); ctx.stroke(); ctx.restore(); }
  drawBeams(); drawLaser(); drawHoming();
  fx.draw(ctx);
  if (G.state !== 'title') drawGun();
  fx.end(ctx);
  drawLocks();
  fx.drawFlash(ctx, W, H);
  postFX();
  drawHUD(); drawCrosshair();
  if (G.state === 'title') drawTitle();
  if (G.state === 'count') drawCount();
}

/* ------------------------------------------------------------ 入力 */
function togglePause() {
  if (G.state !== 'play') return;
  paused = !paused; input.firing = false;
  if (paused) { bgmStop(); FES.pause(true, { onResume: () => { if (paused) togglePause(); }, onRetry: () => { FES.pause(false); paused = false; startGame(); FES.sfx('start'); } }); }
  else { FES.pause(false); bgmStart(BGM.mode); }
}
function pressStart() { if (G.state === 'title') { startGame(); FES.sfx('start'); return true; } return false; }
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.code === 'Escape' || e.code === 'KeyP') { if (!e.repeat) togglePause(); return; }
  if (paused) return;
  G.keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') { if (!pressStart()) shoot(); }
  if (e.code === 'KeyR') startReload();
  if (e.code === 'KeyE' || e.code === 'KeyB' || e.code === 'KeyQ') neonBurst();
  if (e.code === 'KeyA') dodge(-1);
  if (e.code === 'KeyD') dodge(1);
  const n = { Digit1: 'mg', Digit2: 'shot', Digit3: 'laser', Digit4: 'lock', Numpad1: 'mg', Numpad2: 'shot', Numpad3: 'laser', Numpad4: 'lock' }[e.code]; if (n) setWeapon(n);
});
window.addEventListener('keyup', e => { G.keys[e.code] = false; });
canvas.addEventListener('pointermove', e => {
  if (G.state === 'title' || paused) return;
  if (e.pointerType !== 'mouse' && input.pointerId !== null && e.pointerId !== input.pointerId) return;
  const p = view.toGame(e.clientX, e.clientY); G.aim.x = p.x; G.aim.y = p.y;
});
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); if (paused) return;
  if (pressStart()) return;
  const p = view.toGame(e.clientX, e.clientY);
  if (e.button === 2) { neonBurst(); return; }   // 右クリック = NEON BURST
  const bb = burstBtn();
  if (G.state === 'play' && G.burst >= 1 && Math.hypot(p.x - bb.x, p.y - bb.y) <= bb.r + 10) { neonBurst(); return; }
  if (G.state === 'play') {   // 画面のボタン（よける・武器）。押しても照準は動かさない
    for (const b of dodgeBtns()) if (Math.hypot(p.x - b.x, p.y - b.y) <= b.r + 12) { dodge(b.dir); return; }
    for (const b of weaponBtns()) if (Math.hypot(p.x - b.x, p.y - b.y) <= b.r + 8) { setWeapon(b.w); return; }
  }
  G.aim.x = p.x; G.aim.y = p.y;
  input.pointerId = e.pointerId; input.pointerType = e.pointerType; input.firing = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  shoot();
});
const endPointer = e => { if (e.pointerId === input.pointerId || input.pointerType === 'mouse') { input.firing = false; input.pointerId = null; } };
canvas.addEventListener('pointerup', endPointer); canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());
let wheelT = 0;
canvas.addEventListener('wheel', e => { e.preventDefault(); if (G.state !== 'play' || paused || performance.now() - wheelT < 120) return; wheelT = performance.now(); cycleWeapon(e.deltaY > 0 ? 1 : -1); }, { passive: false });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play' && !paused) togglePause(); });
canvas.classList.add('title');

/* ------------------------------------------------------------ ループ */
G = newGame();
fit();
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) update(dt);
  render();
}
requestAnimationFrame(frame);
</script>
</body>
