/* ================================================================ ユーティリティ */
const easeOutBack = t => { const c = 1.70158; const u = t - 1; return 1 + (c + 1) * u * u * u + c * u * u; };

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);

  g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.ellipse(-3, -55, 2.6, 1.8, -0.3, 0, TAU); g.fill();

  g.strokeStyle = 'rgba(40,20,10,.5)'; g.lineWidth = 1.4;

    g.beginPath(); g.moveTo(-26, -92); g.lineTo(-26, -118); g.lineTo(-13, -104); g.lineTo(0, -126); g.lineTo(13, -104); g.lineTo(26, -118); g.lineTo(26, -92); g.closePath(); g.fill(); g.stroke();

    g.fillStyle = 'rgba(255,255,255,.5)'; g.fillRect(-22, -95, 44, 2);
  }
}
const MOLE_ART = {};
for (const k of Object.keys(MOLE_COL)) { const [c, g] = canvasOf(160, 180, ART_K); g.translate(80, 160); paintMole(g, k); MOLE_ART[k] = c; }
/* 穴（後ろ＝土の盛り上がりと穴の中 ／ 前＝手前のふち） */
const HOLE_BACK = (() => {
  const [c, g] = canvasOf(220, 110, ART_K); g.translate(110, 55); const R = seeded(77);
  const md = g.createRadialGradient(0, -10, 10, 0, 6, 100); md.addColorStop(0, '#b4835a'); md.addColorStop(0.6, '#86593a'); md.addColorStop(1, 'rgba(96,64,38,0)');
  g.fillStyle = md; g.beginPath(); g.ellipse(0, 8, 100, 44, 0, 0, TAU); g.fill();

  const inner = g.createRadialGradient(0, 8, 4, 0, 0, 68); inner.addColorStop(0, '#0e0704'); inner.addColorStop(0.7, '#24150c'); inner.addColorStop(1, '#4a2f1c');
  g.fillStyle = inner; g.beginPath(); g.ellipse(0, 0, 64, 25, 0, 0, TAU); g.fill();
  g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(0, -6, 60, 16, 0, Math.PI, TAU); g.fill();   // 奥のかべの影

const HOLE_FRONT = (() => {
  const [c, g] = canvasOf(220, 110, ART_K); g.translate(110, 55); const R = seeded(91);
  const rim = g.createLinearGradient(0, 0, 0, 32); rim.addColorStop(0, '#c08c62'); rim.addColorStop(1, '#5e3e26');
  g.strokeStyle = rim; g.lineWidth = 12; g.lineCap = 'round'; g.beginPath(); g.ellipse(0, 3, 66, 26, 0, 0.06, Math.PI - 0.06); g.stroke();
  g.strokeStyle = 'rgba(255,236,200,.32)'; g.lineWidth = 3; g.beginPath(); g.ellipse(0, 5, 60, 22, 0, 0.45, Math.PI - 0.45); g.stroke();
  g.lineCap = 'round';

/* ハンマー（原点 = 柄の根もと。+x が頭の方向） */
const HAMMER_L = 89;
const HAMMER_ART = (() => {
  const [c, g] = canvasOf(140, 90, ART_K); g.translate(12, 45);
  const hg = g.createLinearGradient(0, -7, 0, 7); hg.addColorStop(0, '#e2ad6c'); hg.addColorStop(0.5, '#b97c40'); hg.addColorStop(1, '#7a4a20');

  g.strokeStyle = 'rgba(80,40,10,.35)'; g.lineWidth = 1; for (let x = 24; x < HAMMER_L - 14; x += 9) { g.beginPath(); g.moveTo(x, -4); g.quadraticCurveTo(x + 4, 0, x, 4); g.stroke(); }

/* 背景: 朝・夕方・夜の 3 枚（時間でまぜる） */
const SCENES = [
  { sky: ['#4a98f0', '#a8dcff'], sun: [770, 72, '#fff6c0'], far: '#8cc8a0', mid: '#5fae6a', near: ['#6cc858', '#2f8c3c'], tree: '#3b8a48', fog: 'rgba(255,255,255,.18)' },

  { sky: ['#0c0c2e', '#2a2a6a'], sun: [180, 70, '#f4f0d0'], far: '#2a3a5a', mid: '#20384a', near: ['#2c5a48', '#122a24'], tree: '#14282a', fog: 'rgba(120,140,220,.12)' },
];
function paintScene(S, night) {
  const [c, g] = canvasOf(W, H, 1.5); const R = seeded(night ? 5 : 3);
  const sky = g.createLinearGradient(0, 0, 0, 210); sky.addColorStop(0, S.sky[0]); sky.addColorStop(1, S.sky[1]); g.fillStyle = sky; g.fillRect(0, 0, W, 220);

  g.fillStyle = 'rgba(255,255,255,.05)'; for (let i = 0; i < 6; i++) { g.beginPath(); g.ellipse(W * (i / 5), 190 + i * 60, 520, 26, 0.04, 0, TAU); g.fill(); }   // 刈り込みのしま

function updateParticles(dt) {
  const ps = G.particles;
  for (let i = ps.length - 1; i >= 0; i--) {
    const p = ps[i];
    p.life -= dt;
    if (p.life <= 0) { ps.splice(i, 1); continue; }
    switch (p.kind) {
      case 'star': case 'dirt': case 'helmet':
        p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.rot != null) p.rot += p.rv * dt; break;
      case 'spiral':
        p.ang += 10 * dt; p.cy -= 45 * dt; p.rad += 12 * dt; break;
      case 'spark':
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += 4 * dt; break;
      case 'fire':
        p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; break;
      case 'smoke':
        p.x += p.vx * dt; p.y += p.vy * dt; p.r += 18 * dt; break;
      case 'dust':
        p.x += p.vx * dt; p.y += p.vy * dt; p.r += 10 * dt; break;
      case 'petal':
        p.k += 7 * dt; p.vy += 260 * dt; p.vy = Math.min(p.vy, 120); p.x += (p.vx + Math.sin(p.k) * 60) * dt; p.y += p.vy * dt; p.vx *= 0.97; p.rot += p.rv * dt; break;
      case 'confetti':
        p.vy += 500 * dt; p.vy = Math.min(p.vy, 220); p.vx *= 0.97; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.rv * dt; break;
      case 'ring':
        p.r += 520 * dt; break;
    }
  }
}
function drawParticles() {
  for (const p of G.particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = Math.min(1, a * 1.5);
    switch (p.kind) {
      case 'star':
        ctx.fillStyle = p.color; starPath(p.x, p.y, p.r * (0.5 + a * 0.5), p.rot); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.7)'; starPath(p.x, p.y, p.r * 0.4 * a, p.rot); ctx.fill();
        break;
      case 'spiral': {
        const x = p.cx + Math.cos(p.ang) * p.rad, y = p.cy + Math.sin(p.ang) * p.rad * 0.38;
        ctx.fillStyle = '#ffe066'; starPath(x, y, p.r, p.ang); ctx.fill();
        ctx.strokeStyle = 'rgba(120,70,0,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
        break;
      }
      case 'dirt':
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); break;
      case 'dust':
        ctx.globalAlpha = a * 0.5; ctx.fillStyle = '#d8c8a8'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); break;
      case 'spark':
        ctx.fillStyle = '#fffbe0'; starPath(p.x, p.y, p.r * a, p.rot, 0.3); ctx.fill(); break;
      case 'fire':
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, TAU); ctx.fill(); break;
      case 'smoke':
        ctx.globalAlpha = a * 0.55; ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); break;
      case 'petal':
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, TAU); ctx.fill(); ctx.restore(); break;
      case 'confetti':
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); break;
      case 'helmet':
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); drawHelmet(0, 0, 0.9); ctx.restore(); break;
      case 'ring':
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 6 * a; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke(); break;
    }
  }
  ctx.globalAlpha = 1;
}

/* ================================================================ テキストポップ */
function addText(x, y, txt, o) {
  G.texts.push(Object.assign({ x, y, txt, size: 28, color: '#fff', life: 0.9, max: 0, vy: 55, pop: true, rainbow: false }, o));
  const t = G.texts[G.texts.length - 1]; t.max = t.life;
}
function updateTexts(dt) {
  const ts = G.texts;
  for (let i = ts.length - 1; i >= 0; i--) { const t = ts[i]; t.life -= dt; t.y -= t.vy * dt; if (t.life <= 0) ts.splice(i, 1); }
}
function drawTexts() {
  for (const t of G.texts) {
    const age = 1 - t.life / t.max;
    const sc = t.pop ? (age < 0.18 ? easeOutBack(age / 0.18) : 1) : 1;
    ctx.save();
    ctx.globalAlpha = t.life < 0.3 ? t.life / 0.3 : 1;
    ctx.translate(t.x, t.y); ctx.scale(sc, sc);
    if (t.rainbow) {
      ctx.font = `900 ${t.size}px ${FONT}`;
      const w = ctx.measureText(t.txt).width;
      text(t.txt, 0, 0, t.size, rainbowGrad(-w / 2, w / 2, G.bgT * 300));
    } else text(t.txt, 0, 0, t.size, t.color);
    ctx.restore();

/* ================================================================ BGM（FES.tone をスケジュール） */
const BGM = { on: false, next: 0, step: 0 };
const MEL = [523, 659, 784, 659, 880, 784, 659, 523, 587, 659, 784, 880, 784, 659, 587, 523,
             523, 659, 784, 1047, 880, 784, 659, 587, 659, 784, 880, 784, 659, 587, 523, 0];
const BASS = [131, 0, 196, 0, 220, 0, 165, 0, 175, 0, 131, 0, 196, 0, 196, 0,
              131, 0, 196, 0, 220, 0, 165, 0, 175, 0, 131, 0, 196, 0, 196, 0];
function bgmStart() { const ac = FES.audioContext(); BGM.on = true; BGM.step = 0; BGM.next = ac ? ac.currentTime + 0.05 : 0; }
function bgmStop() { BGM.on = false; }
function bgmResume() { const ac = FES.audioContext(); if (ac) BGM.next = ac.currentTime + 0.05; }
function bgmUpdate() {
  if (!BGM.on) return;
  const ac = FES.audioContext(); if (!ac) return;
  const stepDur = G.fever > 0 ? 0.15 : 0.2;
  if (BGM.next < ac.currentTime - 0.3) BGM.next = ac.currentTime;   // タブ復帰時の暴走防止
  let guard = 0;
  while (BGM.next < ac.currentTime + 0.25 && guard++ < 8) {
    const d = Math.max(0, BGM.next - ac.currentTime);
    const m = MEL[BGM.step % MEL.length];
    const b = BASS[BGM.step % BASS.length];
    if (m) FES.tone({ freq: m, dur: stepDur * 0.8, delay: d, type: 'triangle', vol: 0.055 });
    if (b) FES.tone({ freq: b, dur: stepDur * 0.9, delay: d, type: 'square', vol: 0.035 });
    if (BGM.step % 2 === 0) FES.noise({ dur: 0.03, freq: 7000, vol: 0.02, delay: d, filter: 'highpass' });
    BGM.step++;
    BGM.next += stepDur;
  }
}

/* ================================================================ ゲーム進行 */
function resetGame() {
  G.elapsed = 0; G.timeLeft = TIME_LIMIT;
  G.score = 0; G.dispScore = 0;
  G.combo = 0; G.maxCombo = 0;
  G.hits = 0; G.golds = 0; G.swings = 0; G.goodSwings = 0; G.bad = 0; G.fastHits = 0; G.doubles = 0; G.kingSpawned = false; G.kingDown = false; G.lastTwin = null; G.twinSeq = 0;
  G.spawnTimer = 0.6; G.bonusCd = 0;
  G.fever = 0; G.feverFlash = 0; FES.fever(false);
  G.shake = 0; G.hitStop = 0; G.flash = 0;
  G.particles = []; G.texts = [];
  G.expanded = false;
  G.timeupT = 0; G.resultShown = false; G.lastTick = -1;
  G.paused = false;
  G.cracks = []; G.light = { x: W / 2, y: 300 }; G.smashes = 0; G.smashKills = 0; G.phaseShown = 0;
  press = null; hammer.charge = 0; hammer.big = 0;
  buildHoles(3);
}
function startGame() {
  if (FES.howto(['🔨 クリックかタップでもぐらをたたく', '💥 長押しして離すと大ぶり（まわりもまとめてたたく）', '💣 ばくだんと花はたたかない'], 0, startGame, arguments)) return;   // まん中に「あそびかた」→ OK で始まる
  FES.hideResult(); FES.pause(false);
  resetGame();
  G.state = 'countdown';
  G.cdT = 0; G.cdStep = -1;
  FES.sfx('start');
}
function beginPlay() {
  G.state = 'play';
  bgmStart();
}
function endGame() {
  G.state = 'timeup';
  G.timeupT = 0;
  if (G.fever > 0) FES.fever(false);
  G.fever = 0;
  hideAllMoles(false);
  bgmStop();
  FES.tone({ freq: 1100, dur: 0.18, type: 'square', vol: 0.2 });
  FES.tone({ freq: 1100, dur: 0.5, type: 'square', vol: 0.2, delay: 0.22 });
  addText(W / 2, 250, 'TIME UP!', { size: 80, color: '#ffe066', life: 1.5, vy: 0, pop: true });
  G.shake = 6;
}
function showResult() {
  G.resultShown = true;
  G.state = 'result';
  const acc = G.swings ? Math.min(100, Math.round(G.goodSwings / G.swings * 100)) : 0;
  FES.showResult({
    score: G.score, scoreLabel: 'pt', title: 'TIME UP!',
    rank: { S: 25000, A: 15000, B: 8000, C: 3000 }, titles: { S: 'もぐらの神', A: 'もぐらマスター', B: 'なかなかの腕！' },
    subtitle: `もぐらを${G.hits}匹たたいた！`,
    stats: [
      { label: 'たたいた数', value: G.hits },
      { label: '金もぐら', value: G.golds },
      { label: '最大コンボ', value: G.maxCombo },
      { label: '命中率', value: acc + '%' },
      { label: '大ぶり', value: G.smashes ? `${G.smashes}回（${G.smashKills}匹）` : '—' },
      { label: 'はやい！', value: G.fastHits },
      { label: 'キング', value: G.kingDown ? '撃破！' : G.kingSpawned ? '逃げられた' : '—' },
    ],
  }, () => { G.hiScore = FES.getHiScore(); startGame(); });
}
function togglePause() {
  if (G.state !== 'play') return;
  G.paused = !G.paused;
  FES.sfx('select');
  if (G.paused) FES.pause(true, { onResume: () => { if (G.paused) togglePause(); }, onRetry: () => { FES.pause(false); startGame(); } });
  else { FES.pause(false); bgmResume(); }
}

function updatePlay(dt) {
  G.elapsed += dt;
  G.timeLeft = Math.max(0, TIME_LIMIT - G.elapsed);
  // 残り 5 秒のカウント音
  const sec = Math.ceil(G.timeLeft);
  if (sec <= 5 && sec >= 1 && sec !== G.lastTick) { G.lastTick = sec; FES.sfx('tick'); }
  if (!G.expanded && G.elapsed >= EXPAND_AT) expandHoles();
  if (G.phaseShown < 1 && G.elapsed >= DUSK_AT) { G.phaseShown = 1; addText(W / 2, 150, '夕方になった！', { size: 40, color: '#ffb07a', life: 1.4, vy: 10, pop: true }); }
  if (G.phaseShown < 2 && G.elapsed >= NIGHT_AT) { G.phaseShown = 2; addText(W / 2, 150, '夜になった！', { size: 46, color: '#c8d4ff', life: 1.6, vy: 10, pop: true }); addText(W / 2, 196, 'ライトのまわりと、光る目でさがせ', { size: 20, color: '#fff', life: 1.6, vy: 10 }); FES.sfx('whoosh'); }
  if (G.bonusCd > 0) G.bonusCd -= dt;
  if (G.fever > 0) {
    G.fever -= dt; if (G.fever <= 0) FES.fever(false);
    if (Math.random() < dt * 14) confetti(rand(0, W), -10, 1);
    if (G.fever <= 0) { G.fever = 0; addText(W / 2, 150, 'FEVER END', { size: 36, color: '#ffe0ff', life: 1.0, vy: 20 }); }
  }
  trySpawn(dt);
  updateHoles(dt);
  if (G.timeLeft <= 0) endGame();
}
function updateTitle(dt) {
  G.titleT += dt;
  G.titleSpawn -= dt;
  if (G.titleSpawn <= 0) {
    G.titleSpawn = rand(0.5, 1.1);
    const free = freeHoles();
    if (free.length && activeCount() < 3) spawnMole(pick(free), Math.random() < 0.15 ? 'gold' : Math.random() < 0.2 ? 'helmet' : 'normal', 1.4);
  }
  updateHoles(dt);
}
function updateCountdown(dt) {
  G.cdT += dt;
  const step = Math.min(3, Math.floor(G.cdT / 0.8));
  if (step !== G.cdStep) {
    G.cdStep = step;
    if (step < 3) FES.sfx('countdown'); else FES.sfx('go');
  }
  updateHoles(dt);
  if (G.cdT >= 3.0) beginPlay();
}
function updateFx(dt) {
  updateParticles(dt);
  updateTexts(dt);
  G.shake = Math.max(0, G.shake - dt * 60) * Math.pow(0.02, dt);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 2.2);
  if (G.feverFlash > 0) G.feverFlash -= dt;
  // スコアカウントアップ
  const diff = G.score - G.dispScore;
  if (Math.abs(diff) < 1) G.dispScore = G.score; else G.dispScore += diff * (1 - Math.exp(-12 * dt));
  // ハンマー
  hammer.x += (hammer.tx - hammer.x) * (1 - Math.exp(-40 * dt));
  hammer.y += (hammer.ty - hammer.y) * (1 - Math.exp(-40 * dt));
  if (hammer.swing > 0) { hammer.swing += dt / 0.26; if (hammer.swing >= 1) hammer.swing = 0; }
  if (hammer.impact > 0) hammer.impact -= dt;
  if (hammer.big > 0) hammer.big = Math.max(0, hammer.big - dt * 2);
  for (const c of G.cracks) c.t += dt;
  if (press && G.state === 'play' && !G.paused) {   // 長押しでためる
    const prev = hammer.charge, held = G.bgT - press.t0;
    hammer.charge = clamp((held - CHARGE_DELAY) / (G.fever > 0 ? 0.35 : CHARGE_T), 0, 1);
    if (hammer.charge > 0) { hammer.visible = true; hammer.hideT = Math.max(hammer.hideT, 0.5); }
    if (prev < 1 && hammer.charge >= 1) { FES.tone({ freq: 880, dur: 0.06, type: 'square', vol: 0.12 }); FES.tone({ freq: 1320, dur: 0.1, type: 'square', vol: 0.12, delay: 0.06 }); }
    else if (hammer.charge > 0 && Math.floor(prev * 6) !== Math.floor(hammer.charge * 6)) FES.tone({ freq: 300 + hammer.charge * 500, dur: 0.04, type: 'triangle', vol: 0.08 });
  } else if (!press) hammer.charge = 0;
  if (hammer.hideT > 0) { hammer.hideT -= dt; if (hammer.hideT <= 0) hammer.visible = false; }
  // 雲
  for (const c of clouds) { c.x += c.v * c.s * dt; if (c.x > W + 160) { c.x = -160; c.y = rand(20, 120); } }
}
function update(dt) {
  G.bgT += dt;
  if (G.state === 'title') { updateTitle(dt); updateFx(dt); }
  else if (G.state === 'countdown') { updateCountdown(dt); updateFx(dt); }
  else if (G.state === 'play') {
    if (G.paused) return;
    if (G.hitStop > 0) G.hitStop -= dt; else updatePlay(dt);
    bgmUpdate();
    updateFx(dt);
  } else if (G.state === 'timeup') {
    updateHoles(dt); updateFx(dt);
    G.timeupT += dt;
    if (G.timeupT > 1.5 && !G.resultShown) showResult();
  } else { updateFx(dt); }
}

/* ================================================================ 描画: 背景（朝・夕方・夜の絵をまぜる） */
function sceneT() {   // 0 = 朝 … 1 = 夕方 … 2 = 夜
  if (G.state !== 'play' && G.state !== 'timeup' && G.state !== 'result') return 0;
  const e = G.elapsed;
  return e < DUSK_AT ? 0 : e < NIGHT_AT ? (e - DUSK_AT) / (NIGHT_AT - DUSK_AT) : 1 + clamp((e - NIGHT_AT) / 3, 0, 1);
}
function nightK() { return G.fever > 0 ? 0 : clamp(sceneT() - 1, 0, 1); }
function drawBackground() {
  const t = sceneT(), a = Math.min(1, Math.floor(t)), f = t - a;
  ctx.drawImage(SCENE_ART[a], 0, 0, W, H);
  if (f > 0 && a < 2) { ctx.globalAlpha = f; ctx.drawImage(SCENE_ART[a + 1], 0, 0, W, H); ctx.globalAlpha = 1; }
  const starA = clamp(t - 1, 0, 1);
  if (starA > 0) { ctx.fillStyle = '#fff'; for (const s of stars) { ctx.globalAlpha = starA * (0.4 + 0.6 * (0.5 + 0.5 * Math.sin(G.bgT * 3 + s.k))); ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill(); } ctx.globalAlpha = 1; }
  for (const c of clouds) drawCloud(c.x, c.y, c.s, clamp(t, 0, 2));
  // 草むら（風でゆれる）
  ctx.strokeStyle = t > 1.5 ? 'rgba(10,40,30,.5)' : 'rgba(20,80,30,.4)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const tf of tufts) {
    const sw = Math.sin(G.bgT * 2 + tf.k * 10) * 2;
    ctx.moveTo(tf.x, tf.y); ctx.lineTo(tf.x - 5 * tf.s + sw, tf.y - 12 * tf.s);
    ctx.moveTo(tf.x, tf.y); ctx.lineTo(tf.x + 1 + sw, tf.y - 15 * tf.s);
    ctx.moveTo(tf.x, tf.y); ctx.lineTo(tf.x + 6 * tf.s + sw, tf.y - 11 * tf.s);
  }
  ctx.stroke();
  // フィーバー: レインボー
  if (G.fever > 0 || G.feverFlash > 0) {
    const fa = G.fever > 0 ? 0.3 + Math.sin(G.bgT * 10) * 0.06 : clamp(G.feverFlash, 0, 0.3);
    ctx.globalAlpha = fa;
    const g = ctx.createLinearGradient(0, 0, W, H);
    for (let i = 0; i <= 8; i++) g.addColorStop(i / 8, `hsl(${(i * 45 + G.bgT * 260) % 360},100%,60%)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}
function drawCloud(x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const c = t < 1 ? [255, Math.round(255 - t * 60), Math.round(255 - t * 90)] : [Math.round(255 - (t - 1) * 150), Math.round(195 - (t - 1) * 90), Math.round(165 - (t - 1) * 40)];
  const g = ctx.createLinearGradient(0, -36, 0, 34); g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},.95)`); g.addColorStop(1, `rgba(${Math.round(c[0] * 0.82)},${Math.round(c[1] * 0.85)},${Math.round(c[2] * 0.95)},.9)`);
  ctx.fillStyle = g; ctx.beginPath();
  ctx.arc(0, 0, 26, 0, TAU); ctx.arc(28, -8, 30, 0, TAU); ctx.arc(58, 2, 24, 0, TAU); ctx.arc(30, 12, 26, 0, TAU);
  ctx.fill(); ctx.restore();
}

/* ================================================================ 描画: 穴ともぐら */
function drawHoleBack(h) {

  ctx.save(); ctx.translate(h.x, h.y); ctx.scale(s, s);
  ctx.drawImage(HOLE_BACK, -110, -55, 220, 110);
  if (h.mole) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 2, 44, 14, 0, 0, TAU); ctx.fill(); }   // もぐらの影
  ctx.restore();
}

    ['💥', '#ffb07a', '長押しして離すと大ぶり！ まわりのもぐらもまとめてたたく'],
    ['💣', '#ff8a8a', 'ばくだん（-300）と花（-100）はたたかない'],
    ['👑', '#a8b8ff', '40秒で夜になる。44秒にキング登場（5回たたく）'],
    ['⌨', '#cfd8ff', 'クリック・タップ ／ キーはQWE・ASD・ZXC（30秒からRFVも）・テンキー'],
  ];
  lines.forEach((l, i) => { const y = 246 + i * 31; FES.drawIcon(ctx, l[0], 186, y, 22, l[1], null); text(l[2], 206, y, i === 5 ? 15 : 17.5, l[1], 'left', { stroke: false, weight: 800 }); });
  const bp = 1 + Math.sin(t * 5) * 0.04;
  ctx.save(); ctx.translate(W / 2, 468); ctx.scale(bp, bp);
  const bg = ctx.createLinearGradient(-130, -28, 130, 28); bg.addColorStop(0, '#ff8a3d'); bg.addColorStop(1, '#ff3d7a');
  rr(-130, -28, 260, 56, 28); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.save(); ctx.translate(0, 6); ctx.fill(); ctx.restore();
  rr(-130, -28, 260, 56, 28); ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; ctx.stroke();
  text('スタート！', 0, 1, 28, '#fff', 'center', { lineWidth: 4 });
  ctx.restore();
  text('タップ・クリック・Enter・Spaceでスタート', W / 2, 518, 14, 'rgba(255,255,255,.8)', 'center', { stroke: false, weight: 700 });
}
function drawCountdown() {
  ctx.fillStyle = 'rgba(0,0,10,.25)'; ctx.fillRect(0, 0, W, H);
  const step = G.cdStep, local = (G.cdT - step * 0.8) / 0.8, sc = local < 0.25 ? easeOutBack(local / 0.25) : 1;
  const s = step < 3 ? String(3 - step) : 'GO!';
  ctx.save(); ctx.translate(W / 2, H / 2 - 20); ctx.scale(sc, sc);
  ctx.globalAlpha = step < 3 ? 1 : clamp(1 - (local - 0.3) / 0.5, 0, 1);
  text(s, 0, 0, step < 3 ? 150 : 120, step < 3 ? ['#8ef0ff', '#ffd23d', '#ff8a5a'][step] : '#7dff7a', 'center', { lineWidth: 14 });
  ctx.restore();
  text('READY...', W / 2, H / 2 + 80, 24, '#fff', 'center', {});
}
function drawUrgency() {
  if (G.state !== 'play' || G.timeLeft > 10 || G.timeLeft <= 0 || G.fever > 0) return;
  const beat = Math.max(0, Math.sin(G.bgT * 10));
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.95);
  vg.addColorStop(0, 'rgba(255,59,92,0)'); vg.addColorStop(1, `rgba(255,59,92,${(0.18 + beat * 0.22).toFixed(3)})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

/* ================================================================ 描画: メイン */
function draw() {
  ctx.save();
  if (G.shake > 0.3) ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake));
  drawBackground();
  drawField();
  drawParticles();
  drawNight();
  drawTexts();
  drawHammer();
  ctx.restore();
  drawUrgency();
  if (G.flash > 0) { ctx.globalAlpha = Math.min(0.85, G.flash); ctx.fillStyle = G.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (G.state === 'title') drawTitle();
  else if (G.state === 'countdown') { drawHUD(); drawCountdown(); }
  else if (G.state === 'play' || G.state === 'timeup' || G.state === 'result') drawHUD();
  canvas.style.cursor = (G.state === 'play' && !G.paused && hammer.visible) ? 'none' : 'default';
}

/* ================================================================ 入力 */
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = view.toGame(e.clientX, e.clientY);
  hammer.visible = true;
  hammer.x = hammer.tx = p.x; hammer.y = hammer.ty = p.y;
  hammer.hideT = e.pointerType === 'touch' ? 0.9 : 0;
  if (G.state === 'title') { startGame(); return; }
  if (G.state === 'play') {
    if (G.paused) return;
    swing(p.x, p.y);
    press = { id: e.pointerId, t0: G.bgT, x: p.x, y: p.y, touch: e.pointerType === 'touch' };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }
});
const endPress = e => { if (press && !press.key && press.id === e.pointerId) pressRelease(); };
canvas.addEventListener('pointerup', endPress); canvas.addEventListener('pointercancel', endPress);
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  const p = view.toGame(e.clientX, e.clientY);
  hammer.visible = true; hammer.hideT = 0;
  hammer.tx = p.x; hammer.ty = p.y;
  if (hammer.swing === 0) { hammer.x = p.x; hammer.y = p.y; }
});
canvas.addEventListener('pointerleave', () => { if (hammer.swing === 0) hammer.visible = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const code = e.code;
  if (code === 'Space' || code.startsWith('Arrow') || code === 'Tab') e.preventDefault();
  if (code === 'Escape' || code === 'KeyP') { togglePause(); return; }
  if (G.state === 'title' && (code === 'Enter' || code === 'Space' || code === 'NumpadEnter')) { startGame(); return; }
  if (G.state === 'play' && !G.paused) {
    const m = KEYMAP[code];
    if (m && m[0] < G.cols && !e.repeat) { e.preventDefault(); keySwing(m[0], m[1]); press = { key: code, col: m[0], row: m[1], t0: G.bgT }; }
  }
});
document.addEventListener('keyup', e => { if (press && press.key === e.code) pressRelease(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && G.state === 'play' && !G.paused) togglePause();
});

/* ================================================================ メインループ */
buildHoles(3);
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (!(dt >= 0)) dt = 0; if (dt > 0.05) dt = 0.05;
  try { update(dt); draw(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
