<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: #07071a; overflow: hidden; color: #fff;
    font-family: "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; }
  #stage { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  #game { position: absolute; display: block; touch-action: none; }
  /* 下部ボタン */
  .ctl { position: fixed; bottom: 12px; z-index: 50; width: 46px; height: 46px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,.28); background: rgba(10,10,40,.6); color: #fff; font-size: 20px; font-weight: 900;
    display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(6px);
    user-select: none; -webkit-tap-highlight-color: transparent; transition: transform .1s, background .1s, bottom .2s; touch-action: manipulation; }
  .ctl:active { transform: scale(.92); }
  .ctl.on { background: linear-gradient(135deg,#6a5cff,#b04dff); box-shadow: 0 0 18px rgba(120,90,255,.6); }
  #kbtoggle { right: 12px; }
  #pausebtn { left: 12px; display: none; }
  body.kb .ctl { bottom: calc(var(--kbh, 0px) + 10px); }
  /* ソフトキーボード */
  #softkb { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: none; flex-direction: column; gap: 6px;
    padding: 8px 6px 10px; background: linear-gradient(180deg, rgba(14,12,40,.92), rgba(6,6,24,.98)); border-top: 1px solid rgba(255,255,255,.15);
    touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 -10px 40px rgba(0,0,0,.5); }
  body.kb #softkb { display: flex; }
  .kbrow { display: flex; justify-content: center; gap: 5px; }
  .key { flex: 0 1 9%; max-width: 64px; min-width: 26px; height: 46px; border-radius: 9px; border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.1); color: #fff; font-size: 18px; font-weight: 900; text-transform: uppercase;
    display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform .06s, background .06s; font-family: Consolas, "Courier New", monospace; }
  .key.hint { background: linear-gradient(135deg,#ffd36e,#ff9d4d); color: #2a1a00; box-shadow: 0 0 14px rgba(255,200,90,.7); }

/* =====================================================================
   ローマ字判定エンジン（純粋関数・DOM 非依存）
   ===================================================================== */
/*ROMAJI-BEGIN*/
const ROMA = (() => {
  const T = {
    'あ':['a'],'い':['i','yi'],'う':['u','wu','whu'],'え':['e'],'お':['o'],
    'か':['ka','ca'],'き':['ki'],'く':['ku','cu','qu'],'け':['ke'],'こ':['ko','co'],
    'さ':['sa'],'し':['si','shi','ci'],'す':['su'],'せ':['se','ce'],'そ':['so'],
    'た':['ta'],'ち':['ti','chi'],'つ':['tu','tsu'],'て':['te'],'と':['to'],
    'な':['na'],'に':['ni'],'ぬ':['nu'],'ね':['ne'],'の':['no'],
    'は':['ha'],'ひ':['hi'],'ふ':['fu','hu'],'へ':['he'],'ほ':['ho'],
    'ま':['ma'],'み':['mi'],'む':['mu'],'め':['me'],'も':['mo'],
    'や':['ya'],'ゆ':['yu'],'よ':['yo'],
    'ら':['ra'],'り':['ri'],'る':['ru'],'れ':['re'],'ろ':['ro'],
    'わ':['wa'],'を':['wo'],'ん':['n','nn','xn'],
    'が':['ga'],'ぎ':['gi'],'ぐ':['gu'],'げ':['ge'],'ご':['go'],
    'ざ':['za'],'じ':['ji','zi'],'ず':['zu'],'ぜ':['ze'],'ぞ':['zo'],
    'だ':['da'],'ぢ':['di'],'づ':['du'],'で':['de'],'ど':['do'],
    'ば':['ba'],'び':['bi'],'ぶ':['bu'],'べ':['be'],'ぼ':['bo'],
    'ぱ':['pa'],'ぴ':['pi'],'ぷ':['pu'],'ぺ':['pe'],'ぽ':['po'],
    'ゔ':['vu'],
    'ぁ':['xa','la'],'ぃ':['xi','li'],'ぅ':['xu','lu'],'ぇ':['xe','le'],'ぉ':['xo','lo'],
    'ゃ':['xya','lya'],'ゅ':['xyu','lyu'],'ょ':['xyo','lyo'],'ゎ':['xwa','lwa'],
    'っ':['xtu','ltu','xtsu','ltsu'],
    'ー':['-'],'、':[','],'。':['.'],'！':['!'],'？':['?'],'　':[' '],' ':[' '],
    'きゃ':['kya'],'きゅ':['kyu'],'きょ':['kyo'],'きぇ':['kye'],
    'しゃ':['sya','sha'],'しゅ':['syu','shu'],'しょ':['syo','sho'],'しぇ':['sye','she'],
    'ちゃ':['tya','cha','cya'],'ちゅ':['tyu','chu','cyu'],'ちょ':['tyo','cho','cyo'],'ちぇ':['tye','che'],
    'にゃ':['nya'],'にゅ':['nyu'],'にょ':['nyo'],
    'ひゃ':['hya'],'ひゅ':['hyu'],'ひょ':['hyo'],
    'みゃ':['mya'],'みゅ':['myu'],'みょ':['myo'],
    'りゃ':['rya'],'りゅ':['ryu'],'りょ':['ryo'],
    'ぎゃ':['gya'],'ぎゅ':['gyu'],'ぎょ':['gyo'],
    'じゃ':['ja','zya','jya'],'じゅ':['ju','zyu','jyu'],'じょ':['jo','zyo','jyo'],'じぇ':['je','zye'],
    'ぢゃ':['dya'],'ぢゅ':['dyu'],'ぢょ':['dyo'],
    'びゃ':['bya'],'びゅ':['byu'],'びょ':['byo'],
    'ぴゃ':['pya'],'ぴゅ':['pyu'],'ぴょ':['pyo'],
    'ふぁ':['fa'],'ふぃ':['fi'],'ふぇ':['fe'],'ふぉ':['fo'],'ふゅ':['fyu'],
    'てぃ':['thi'],'てゅ':['thu'],'でぃ':['dhi'],'でゅ':['dhu'],
    'うぃ':['wi'],'うぇ':['we'],'うぉ':['who'],
    'ゔぁ':['va'],'ゔぃ':['vi'],'ゔぇ':['ve'],'ゔぉ':['vo'],
    'つぁ':['tsa'],'つぃ':['tsi'],'つぇ':['tse'],'つぉ':['tso'],
    'とぅ':['twu'],'どぅ':['dwu'],'いぇ':['ye'],
  };
  // 拗音・外来音は「基本かな + 小書きかな」の分割入力（si + xya 等）も許可
  for (const k of Object.keys(T)) {
    if (k.length === 2 && T[k[0]] && T[k[1]]) {
      const extra = [];
      for (const a of T[k[0]]) for (const b of T[k[1]]) extra.push(a + b);
      T[k] = T[k].concat(extra);
    }
  }
  // 直後がこれなら ん = nn 必須（母音・や行）。な行の前は n / nn どちらも許容（kinniku / kinnniku）
  const NN_REQUIRED = 'あいうえおやゆよ';

  function build(hira) {
    const units = [];
    let i = 0;
    while (i < hira.length) {
      const two = hira.substr(i, 2);
      if (two.length === 2 && T[two]) { units.push({ kana: two, cands: T[two].slice() }); i += 2; }
      else { const c = hira[i]; units.push({ kana: c, cands: (T[c] || [c]).slice() }); i += 1; }
    }
    for (let j = 0; j < units.length; j++) {
      const u = units[j], nx = units[j + 1];
      u.sokuon = false;
      if (u.kana === 'ん') {
        u.cands = (nx && NN_REQUIRED.indexOf(nx.kana[0]) >= 0) ? ['nn', 'xn'] : ['n', 'nn', 'xn'];
      } else if (u.kana === 'っ') {
        const dbl = [];
        if (nx && nx.kana !== 'っ' && nx.kana !== 'ん') {
          for (const c of nx.cands) {
            const f = c[0];
            if (/[a-z]/.test(f) && 'aiueon'.indexOf(f) < 0 && dbl.indexOf(f) < 0) dbl.push(f);
          }
        }
        u.cands = dbl.concat(['xtu', 'ltu', 'xtsu', 'ltsu']);
        u.sokuon = true;
      }
    }
    return units;
  }
  // 「っ」を子音1文字で打った直後の制約: 次候補は同じ子音で始まる（t の後は ch* も可: matcha）
  function candOK(c, restrict) {
    return !restrict || c[0] === restrict || (restrict === 't' && c[0] === 'c' && c[1] === 'h');
  }
  function shortest(cands, prefix, restrict) {
    let best = null;
    for (const c of cands) if (candOK(c, restrict) && c.startsWith(prefix) && (best === null || c.length < best.length)) best = c;
    return best;
  }
  /** 状態: 複数の解釈（NFA）を同時に保持する。 state = {ui, typed, restrict} */
  function create(hira) {
    return { hira, units: build(hira), states: [{ ui: 0, typed: '', restrict: '' }], typedAll: '', done: false, trailingN: false };
  }
  /** 1文字入力。戻り値 'ok' | 'miss' | 'done' */
  function input(st, ch) {
    if (st.done) return 'miss';
    const next = [], seen = {};
    const push = s => { const k = s.ui + ':' + s.typed + ':' + s.restrict; if (!seen[k]) { seen[k] = 1; next.push(s); } };
    for (const s of st.states) {
      if (s.ui >= st.units.length) continue;
      const u = st.units[s.ui];
      const t = s.typed + ch;
      let exact = false, longer = false;
      for (const c of u.cands) {
        if (!candOK(c, s.restrict) || !c.startsWith(t)) continue;
        if (c.length === t.length) exact = true; else longer = true;
      }
      if (longer) push({ ui: s.ui, typed: t, restrict: s.restrict });
      if (exact) push({ ui: s.ui + 1, typed: '', restrict: (u.sokuon && t.length === 1) ? t : '' });
    }
    if (!next.length) return 'miss';
    st.states = next;
    st.typedAll += ch;
    const n = st.units.length;
    if (next.some(s => s.ui >= n)) {
      st.done = true;
      // 末尾の「ん」を n 1文字で完了した場合、続く n をゲーム側で吸収できるよう印を付ける
      st.trailingN = st.units[n - 1].kana === 'ん' && ch === 'n' && next.some(s => s.ui === n - 1 && s.typed === 'n');
      return 'done';
    }
    return 'ok';
  }
  function best(st) {
    let b = st.states[0];
    for (const s of st.states) if (s.ui > b.ui || (s.ui === b.ui && s.typed.length > b.typed.length)) b = s;
    return b;
  }
  /** 表示用: 入力済み文字列と、残りの最短候補文字列 */
  function guide(st) {
    const b = best(st);
    let rest = '', restrict = b.restrict;
    for (let i = b.ui; i < st.units.length; i++) {
      const u = st.units[i];
      const prefix = i === b.ui ? b.typed : '';
      const c = shortest(u.cands, prefix, restrict) || prefix;
      rest += c.slice(prefix.length);
      restrict = (u.sokuon && c.length === 1) ? c : '';
    }
    return { typed: st.typedAll, rest };
  }
  function minKeys(hira) { return guide(create(hira)).rest.length; }
  return { build, create, input, guide, minKeys };
})();
/*ROMAJI-END*/

/* =====================================================================
   定数・状態
   ===================================================================== */
const W = 960, H = 540;
const GAME_TIME = 60;
const FONT = '"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif';
const MONO = 'Consolas,"Courier New",monospace';
const GROUND_Y = 462;
const HERO_X = 235, ENEMY_X = 700;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const kbEl = document.getElementById('softkb');
const kbToggle = document.getElementById('kbtoggle');
const pauseBtn = document.getElementById('pausebtn');

const view = { scale: 1, ox: 0, oy: 0 };
let state = 'title';   // title | countdown | play | pause | result
let MODE = 1;          // 0 やさしい / 1 ふつう / 2 むずかしい
const MODES = [
  { label: 'やさしい', sub: '短いことば', color: '#5ee06a', mul: 0.8, par: 1.3 },
  { label: 'ふつう', sub: 'だんだん長く', color: '#ffd36e', mul: 1.0, par: 1.0 },
  { label: 'むずかしい', sub: '最初から長文', color: '#ff4d6d', mul: 1.3, par: 0.85 },
];
const modeMul = () => MODES[MODE].mul;
let softOn = false;

const G = {   // 1プレイの状態
  time: GAME_TIME, elapsed: 0, score: 0, dispScore: 0, combo: 0, maxCombo: 0,
  correct: 0, miss: 0, words: 0, mult: 1,
  word: null, enemy: null, deadEnemies: [], pools: null,
  hero: { atk: 0, hurt: 0, bob: 0 },
  shake: 0, flashRed: 0, flashWhite: 0, hitstop: 0,
  comboPop: 0, scrollSpeed: 30, scroll: 0, missAt: 0, absorbN: false,
  particles: [], floats: [], lastSec: -1, bgT: 0,
  wordT: 0, speedHits: 0, slash: null,   // いまの単語にかかった秒・スピードボーナス回数・フィニッシュの斬撃
};
let countdown = { t: 0, n: 3 };
let lastTs = 0, raf = 0;

/* =====================================================================
   画面フィット（ソフトキーボード分を除いた領域に収める）
   ===================================================================== */
function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== W * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const kbh = softOn ? kbEl.offsetHeight : 0;
  document.body.style.setProperty('--kbh', kbh + 'px');
  const vw = window.innerWidth, vh = Math.max(120, window.innerHeight - kbh);
  const s = Math.min(vw / W, vh / H);
  view.scale = s; view.ox = (vw - W * s) / 2; view.oy = (vh - H * s) / 2;
  canvas.style.width = (W * s) + 'px'; canvas.style.height = (H * s) + 'px';
  canvas.style.left = view.ox + 'px'; canvas.style.top = view.oy + 'px';
}
const toGame = (cx, cy) => ({ x: (cx - view.ox) / view.scale, y: (cy - view.oy) / view.scale });
window.addEventListener('resize', fit);

/* =====================================================================
   ソフトキーボード
   ===================================================================== */
function buildSoftKeyboard() {
  const rows = ['qwertyuiop', 'asdfghjkl-', 'zxcvbnm'];
  rows.forEach(r => {
    const row = document.createElement('div'); row.className = 'kbrow';
    for (const ch of r) {
      const k = document.createElement('div'); k.className = 'key'; k.textContent = ch; k.dataset.ch = ch;
      k.addEventListener('pointerdown', e => {
        e.preventDefault(); e.stopPropagation();
        k.classList.add('down'); setTimeout(() => k.classList.remove('down'), 90);
        handleChar(ch);
      });
      row.appendChild(k);
    }
    kbEl.appendChild(row);
  });
  kbEl.addEventListener('contextmenu', e => e.preventDefault());
}
function setSoft(on) {
  softOn = on;
  document.body.classList.toggle('kb', on);
  kbToggle.classList.toggle('on', on);
  fit();
}
function updateKeyHint() {
  let next = '';
  if (state === 'play' && G.word) next = ROMA.guide(G.word.st).rest[0] || '';
  const keys = kbEl.querySelectorAll('.key');
  for (const k of keys) k.classList.toggle('hint', k.dataset.ch === next);
}
kbToggle.addEventListener('click', () => { setSoft(!softOn); FES.sfx('select'); });
pauseBtn.addEventListener('click', () => { togglePause(); });

/* =====================================================================
   BGM（WebAudio シーケンサ）
   ===================================================================== */
const BGM = (() => {
  const BASS = [110, 110, 165, 110, 87, 87, 131, 87, 98, 98, 147, 98, 82, 82, 123, 82];
  const ARP = [440, 523, 659, 523, 349, 440, 523, 440, 392, 494, 587, 494, 330, 415, 494, 415];
  let timer = null, next = 0, step = 0;
  function tick() {
    const ac = FES.audioContext(); if (!ac) return;
    const spd = (state === 'play' && G.time < 10) ? 0.17 : 0.21;
    while (next < ac.currentTime + 0.35) {
      const d = Math.max(0, next - ac.currentTime);
      FES.tone({ freq: BASS[step % 16], dur: 0.16, type: 'triangle', vol: 0.09, delay: d });
      if (step % 2 === 0) FES.tone({ freq: ARP[step % 16], dur: 0.09, type: 'square', vol: 0.035, delay: d });
      if (step % 4 === 2) FES.noise({ dur: 0.05, freq: 6000, vol: 0.04, delay: d, filter: 'highpass' });
      if (step % 8 === 0) FES.noise({ dur: 0.09, freq: 200, slide: 60, vol: 0.12, delay: d });
      next += spd; step++;
    }
  }
  return {
    start() { const ac = FES.audioContext(); if (!ac || timer) return; next = ac.currentTime + 0.05; step = 0; timer = setInterval(tick, 100); tick(); },
    stop() { if (timer) { clearInterval(timer); timer = null; } },
  };
})();

/* =====================================================================
   ユーティリティ
   ===================================================================== */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function text(s, x, y, size, color, opts) {
  opts = opts || {};
  ctx.font = `${opts.weight || 900} ${size}px ${opts.mono ? MONO : FONT}`;
  ctx.textAlign = opts.align || 'center'; ctx.textBaseline = opts.base || 'middle';
  if (opts.stroke) { ctx.lineWidth = opts.stroke; ctx.strokeStyle = opts.strokeColor || 'rgba(0,0,0,.6)'; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

function spawnBurst(x, y, n, colors, spd, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random() * 0.8);
    G.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.3, life: life, max: life,
      color: FES.pick(colors), size: 3 + Math.random() * 6, g: 400, type: Math.random() < 0.3 ? 'star' : 'dot' });
  }
}
function spawnFloat(txt, x, y, color, size) {
  G.floats.push({ txt, x, y, vy: -70, life: 0.9, max: 0.9, color, size: size || 26 });
}

/* =====================================================================
   語彙プール・敵
   ===================================================================== */
function tierOf(keys) { return keys <= 5 ? 1 : keys <= 11 ? 2 : 3; }
function buildPools() {
  const pools = { 1: [], 2: [], 3: [] };
  for (const v of VOCAB) pools[tierOf(ROMA.minKeys(v[1]))].push(v);
  for (const t in pools) shuffle(pools[t]);
  return { pools, used: { 1: [], 2: [], 3: [] } };
}
function pickWord() {
  const e = G.elapsed, r = Math.random();
  let tier;
  if (MODE === 0) {          // やさしい: 短いことば中心。長文は出ない
    tier = e < 20 ? 1 : (r < 0.7 ? 1 : 2);
  } else if (MODE === 2) {   // むずかしい: 最初からふつう〜長文
    tier = e < 15 ? 2 : e < 30 ? (r < 0.5 ? 2 : 3) : (r < 0.3 ? 2 : 3);
  } else {
    if (e < 12) tier = 1;
    else if (e < 30) tier = r < 0.3 ? 1 : 2;
    else if (e < 45) tier = r < 0.3 ? 3 : 2;
    else tier = r < 0.35 ? 2 : 3;
  }
  const P = G.pools;
  if (!P.pools[tier].length) { P.pools[tier] = shuffle(P.used[tier]); P.used[tier] = []; }
  const v = P.pools[tier].pop(); P.used[tier].push(v);
  return { kanji: v[0], hira: v[1], cat: v[2], tier, st: ROMA.create(v[1]), keys: ROMA.minKeys(v[1]) };
}
const ENEMY_TYPES = {
  1: ['slime', 'mush', 'slime'],
  2: ['ghost', 'bat', 'slime2'],
  3: ['boss', 'boss', 'ghost2'],
};
function newEnemy(word) {
  const type = FES.pick(ENEMY_TYPES[word.tier]);
  return { type, x: ENEMY_X + 320, tx: ENEMY_X, y: GROUND_Y, hp: word.keys, maxHp: word.keys,
    t: Math.random() * 10, hit: 0, kb: 0, scale: word.tier === 3 ? 1.35 : word.tier === 2 ? 1.1 : 1, dead: 0, enter: 0 };
}
function nextWord() {
  G.word = pickWord();
  G.word.par = (1.0 + G.word.keys * 0.34) * MODES[MODE].par;   // この秒数以内に打ち切ると SPEED ボーナス
  G.wordT = 0;
  G.enemy = newEnemy(G.word);
  updateKeyHint();
}

/* =====================================================================
   ゲーム進行
   ===================================================================== */
function resetGame() {
  Object.assign(G, {
    time: GAME_TIME, elapsed: 0, score: 0, dispScore: 0, combo: 0, maxCombo: 0, correct: 0, miss: 0, words: 0, mult: 1,
    word: null, enemy: null, deadEnemies: [], pools: buildPools(),
    hero: { atk: 0, hurt: 0, bob: 0 }, shake: 0, flashRed: 0, flashWhite: 0, hitstop: 0, comboPop: 0,
    scrollSpeed: 30, scroll: 0, missAt: 0, absorbN: false, particles: [], floats: [], lastSec: -1, wordT: 0, speedHits: 0, slash: null,
  });
}
function startGame() {
  FES.howto(['⌨ 出てきたローマ字をそのまま打つ', '✅ 1 単語打ち切るとモンスター撃破', '🔥 ミスなしで倍率アップ']);
  FES.hideResult(); FES.pause(false);
  resetGame();
  BGM.stop();
  countdown = { t: 0, n: 3 };
  state = 'countdown';
  pauseBtn.style.display = 'none';
  FES.sfx('countdown');
}
function beginPlay() {
  state = 'play';
  pauseBtn.style.display = 'flex';
  nextWord();
  BGM.start();
  FES.sfx('go');
}
function endGame() {
  state = 'result';
  BGM.stop();
  pauseBtn.style.display = 'none';
  updateKeyHint();
  const total = G.correct + G.miss;
  const acc = total ? Math.round(G.correct / total * 1000) / 10 : 100;
  const kpm = Math.round(G.correct * 60 / GAME_TIME);
  let title;
  if (kpm >= 320 && acc >= 95) title = 'タイピング神';
  else if (kpm >= 240) title = '達人';
  else if (kpm >= 160) title = '上級者';
  else if (kpm >= 90) title = '中級者';
  else title = '初心者';
  setTimeout(() => {
    if (state !== 'result') return;
    FES.showResult({
      score: Math.floor(G.score), scoreLabel: 'pt', title: 'TIME UP!',
      grade: title === 'タイピング神' ? 'S' : title === '達人' ? 'A' : title === '上級者' ? 'B' : title === '中級者' ? 'C' : 'D',
      titles: { S: 'タイピング神', A: '達人', B: '上級者', C: '中級者', D: '初心者（これから！）' },
      subtitle: `${MODES[MODE].label} ／ ${G.words} 体撃破`,
      stats: [
        { label: '単語数', value: G.words },
        { label: 'KPM', value: kpm },
        { label: '正確率', value: acc + '%' },
        { label: 'MAX COMBO', value: G.maxCombo },
        { label: 'SPEED ボーナス', value: G.speedHits },
      ],
    }, () => startGame());
  }, 900);
}
function togglePause() {
  if (state === 'play') {
    state = 'pause'; BGM.stop(); FES.sfx('select'); pauseBtn.textContent = '▶';
    FES.pause(true, { onResume: () => { if (state === 'pause') togglePause(); }, onRetry: () => { FES.pause(false); state = 'title'; startGame(); } });
  }
  else if (state === 'pause') { state = 'play'; lastTs = 0; BGM.start(); FES.sfx('select'); pauseBtn.textContent = 'II'; FES.pause(false); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

/* =====================================================================
   入力
   ===================================================================== */
function handleChar(ch) {
  if (state === 'title') { startGame(); return; }
  if (state !== 'play' || !G.word) return;
  const st = G.word.st;
  const r = ROMA.input(st, ch);
  if (r === 'miss') {
    // 直前の単語を末尾「ん」= n で終えた直後の余分な n は無罰で吸収（nn 打ちも可）
    if (G.absorbN && ch === 'n') { G.absorbN = false; return; }
    G.absorbN = false;
    G.miss++; G.combo = 0; G.mult = 1; FES.fever(false);
    G.shake = Math.max(G.shake, 9); G.flashRed = 0.35; G.hero.hurt = 0.35; G.missAt = G.elapsed;
    FES.sfx('wrong');
    spawnFloat('MISS', HERO_X + 40, GROUND_Y - 150, '#ff5e7a', 30);
    return;
  }
  // 正打（末尾 n 吸収フラグは、n が次の単語の先頭として受理された場合のみ 1 打だけ持ち越す: shasinn + neko）
  G.absorbN = G.absorbN && ch === 'n';
  G.correct++; G.combo++; if (G.combo > G.maxCombo) G.maxCombo = G.combo;
  G.mult = Math.min(4, 1 + Math.floor(G.combo / 10) * 0.5);
  if (G.combo === 20) FES.fever(true);
  G.score += 10 * G.mult * modeMul();
  G.hero.atk = 0.16;
  const en = G.enemy;
  if (en) { en.hp = r === 'done' ? 0 : Math.min(en.maxHp, ROMA.guide(st).rest.length); en.hit = 0.14; en.kb = 14; }
  const ex = en ? en.x : ENEMY_X, ey = GROUND_Y - 60 * (en ? en.scale : 1);
  spawnBurst(ex - 30, ey, 4, ['#fff', '#ffd36e', '#8ed6ff'], 220, 0.35);
  if (G.combo > 0 && G.combo % 10 === 0) { FES.sfx('combo'); G.comboPop = 1; spawnFloat(`${G.combo} COMBO!`, W / 2, 300, '#ffd36e', 30); }
  else FES.tone({ freq: 1200 + Math.min(G.combo, 30) * 25, dur: 0.035, type: 'square', vol: 0.07 });
  if (r === 'done') completeWord();
  updateKeyHint();
}
function completeWord() {
  const w = G.word, en = G.enemy;
  G.words++;
  G.absorbN = !!w.st.trailingN;
  const fast = G.wordT <= w.par;
  const bonus = Math.round((100 + w.keys * 22) * G.mult * modeMul() * (fast ? 1.5 : 1));
  G.score += bonus;
  if (fast) { G.speedHits++; spawnFloat('SPEED! ×1.5', ENEMY_X, GROUND_Y - 150 * (en ? en.scale : 1) - 20, '#8ed6ff', 24); FES.tone({ freq: 1600, slide: 2400, dur: 0.12, type: 'sine', vol: 0.12 }); }
  if (en) G.slash = { x: en.x, y: GROUND_Y - 60 * en.scale, t: 0.22, max: 0.22 };
  G.scrollSpeed = 420;
  G.shake = Math.max(G.shake, 5); G.flashWhite = 0.18; G.hitstop = 0.06;
  FES.sfx('correct');
  if (w.tier === 3) FES.sfx('explode');
  if (en) {
    en.dead = 0.55; en.deadMax = 0.55; G.deadEnemies.push(en);
    const ey = GROUND_Y - 60 * en.scale;
    const cols = ENEMY_COLORS[en.type] || ['#fff'];
    spawnBurst(en.x, ey, 34 + w.tier * 10, cols.concat(['#fff', '#ffd36e']), 380 + w.tier * 80, 0.8);
    spawnFloat(`+${bonus}`, en.x, ey - 70, '#ffd36e', 34);
    spawnFloat(w.tier === 3 ? 'BOSS撃破!!' : '撃破!', en.x, ey - 30, '#fff', w.tier === 3 ? 40 : 30);
  }
  nextWord();
}
document.addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === ' ' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight' || k === 'Tab') e.preventDefault();
  if (state === 'result') return;
  if (k === 'Escape') { if (state === 'play' || state === 'pause') { togglePause(); } return; }
  if (state === 'title') { if (k === 'Enter' || k === ' ') startGame(); else if (k === '1' || k === '2' || k === '3') setMode(Number(k) - 1); else if (k === 'ArrowLeft') setMode(MODE - 1); else if (k === 'ArrowRight') setMode(MODE + 1); return; }
  if (state === 'pause') { if (k === 'Enter' || k === ' ') togglePause(); return; }
  if (state !== 'play') return;
  if (k.length === 1 && /[a-zA-Z\-]/.test(k)) { e.preventDefault(); handleChar(k.toLowerCase()); }
});
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state === 'title') {
    const g = toGame(e.clientX, e.clientY);
    for (let i = 0; i < MODES.length; i++) { const b = modeBtnRect(i); if (g.x >= b.x && g.x <= b.x + b.w && g.y >= b.y && g.y <= b.y + b.h) { setMode(i); return; } }
    startGame();
  }
  else if (state === 'pause') { togglePause(); }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* =====================================================================
   更新
   ===================================================================== */
function update(dt) {
  G.bgT += dt;
  const hs = G.hitstop > 0;
  if (G.hitstop > 0) G.hitstop -= dt;
  const adt = hs ? 0 : dt;    // ヒットストップ中は演出系を止める

  if (state === 'play') {
    G.time -= dt; G.elapsed += dt;
    const sec = Math.ceil(G.time);
    if (sec !== G.lastSec) { G.lastSec = sec; if (sec <= 10 && sec > 0) FES.sfx('tick'); }
    if (G.time <= 0) { G.time = 0; endGame(); }
    G.wordT += dt;
  }
  if (G.slash) { G.slash.t -= dt; if (G.slash.t <= 0) G.slash = null; }
  // スクロール
  G.scrollSpeed = FES.lerp(G.scrollSpeed, 30 + Math.min(G.combo, 50) * 2.5, Math.min(1, dt * 4));
  G.scroll += G.scrollSpeed * adt;
  // スコアカウントアップ
  G.dispScore += (G.score - G.dispScore) * Math.min(1, dt * 10);
  if (Math.abs(G.score - G.dispScore) < 1) G.dispScore = G.score;
  // 演出タイマー
  G.shake = Math.max(0, G.shake - dt * 40);
  G.flashRed = Math.max(0, G.flashRed - dt);
  G.flashWhite = Math.max(0, G.flashWhite - dt);
  G.comboPop = Math.max(0, G.comboPop - dt * 3);
  G.hero.atk = Math.max(0, G.hero.atk - dt);
  G.hero.hurt = Math.max(0, G.hero.hurt - dt);
  G.hero.bob += dt;
  // 敵
  const en = G.enemy;
  if (en) {
    en.t += adt;
    en.x += (en.tx - en.x) * Math.min(1, adt * 9);
    en.hit = Math.max(0, en.hit - dt);
    en.kb = Math.max(0, en.kb - dt * 90);
    en.enter = Math.min(1, en.enter + dt * 3);
  }
  for (let i = G.deadEnemies.length - 1; i >= 0; i--) {
    const d = G.deadEnemies[i]; d.dead -= dt; d.t += dt;
    if (d.dead <= 0) G.deadEnemies.splice(i, 1);
  }
  // パーティクル
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98;
    if (p.life <= 0) G.particles.splice(i, 1);
  }
  for (let i = G.floats.length - 1; i >= 0; i--) {
    const f = G.floats[i]; f.life -= dt; f.y += f.vy * dt; f.vy *= 0.94;
    if (f.life <= 0) G.floats.splice(i, 1);
  }
}

const STARS = [];
for (let i = 0; i < 90; i++) STARS.push({ x: Math.random() * W, y: Math.random() * 300, r: 0.6 + Math.random() * 1.6, p: Math.random() * 6 });
const LANTERNS = [];
for (let i = 0; i < 12; i++) LANTERNS.push({ x: i * 190 + Math.random() * 60, y: 95 + Math.random() * 40, c: FES.pick(['#ff6b6b', '#ffb347', '#ff8ad4', '#ffe66d']) });
const ENEMY_COLORS = {
  slime: ['#5ee06a', '#a8ff9a', '#2fa84a'], slime2: ['#5ec8ff', '#b3ecff', '#2a7fc9'], mush: ['#ff5e5e', '#ffd9b3', '#fff'],
  ghost: ['#d9d0ff', '#fff', '#8b7cff'], ghost2: ['#ffb3f0', '#fff', '#c94dbb'], bat: ['#a06bff', '#4b2d9a', '#ffd36e'],
  boss: ['#ff4d6d', '#7a1030', '#ffd36e'],

function drawBackground() {
  const t = G.bgT;

  const sky = ctx.createLinearGradient(0, 0, 0, H);

  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // 星
  for (const s of STARS) {
    const a = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.5 + s.p));
    ctx.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`;
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  // 月
  const mg = ctx.createRadialGradient(820, 80, 10, 820, 80, 90);
  mg.addColorStop(0, 'rgba(255,240,200,.35)'); mg.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = mg; ctx.fillRect(700, 0, 250, 200);
  ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(820, 80, 30, 0, Math.PI * 2); ctx.fill();
  // 遠景: 校舎シルエット（ゆっくり）
  const s1 = -(G.scroll * 0.15) % 480;
  ctx.fillStyle = '#12103a';
  for (let x = s1 - 480; x < W + 480; x += 480) {
    ctx.fillRect(x, 230, 200, 140); ctx.fillRect(x + 220, 260, 120, 110); ctx.fillRect(x + 60, 200, 60, 40);
    ctx.fillStyle = '#2a2560';
    for (let wy = 250; wy < 340; wy += 30) for (let wx = x + 14; wx < x + 190; wx += 26) ctx.fillRect(wx, wy, 12, 14);
    ctx.fillStyle = '#12103a';
  }
  // 中景: 屋台テント
  const s2 = -(G.scroll * 0.45) % 300;
  for (let x = s2 - 300; x < W + 300; x += 300) {
    ctx.fillStyle = '#25184d'; ctx.fillRect(x + 20, 360, 180, 100);
    ctx.fillStyle = ((x / 300) | 0) % 2 === 0 ? '#c94d6b' : '#3a6fd8';
    ctx.beginPath(); ctx.moveTo(x, 360); ctx.lineTo(x + 110, 310); ctx.lineTo(x + 220, 360); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for (let i = 0; i < 5; i++) ctx.fillRect(x + 8 + i * 44, 352, 22, 10);
    ctx.fillStyle = '#4a3a7a'; ctx.fillRect(x + 20, 400, 180, 8);
  }
  // 提灯ロープ
  const s3 = -(G.scroll * 0.7) % (LANTERNS.length * 190);
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 100);
  for (let x = 0; x <= W; x += 40) ctx.lineTo(x, 100 + Math.sin(x * 0.02) * 8); ctx.stroke();
  for (let rep = -1; rep <= 1; rep++) {
    for (const l of LANTERNS) {
      const x = l.x + s3 + rep * LANTERNS.length * 190;
      if (x < -40 || x > W + 40) continue;
      const sw = Math.sin(t * 2 + l.x) * 4;
      const glow = ctx.createRadialGradient(x + sw, l.y, 4, x + sw, l.y, 40);
      glow.addColorStop(0, l.c + 'aa'); glow.addColorStop(1, l.c + '00');
      ctx.fillStyle = glow; ctx.fillRect(x + sw - 40, l.y - 40, 80, 80);
      ctx.fillStyle = l.c; rr(x + sw - 11, l.y - 16, 22, 30, 8); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x + sw - 9, l.y - 18, 18, 4); ctx.fillRect(x + sw - 9, l.y + 13, 18, 4);
    }
  }
  // 地面
  const gg = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  gg.addColorStop(0, '#3b2a63'); gg.addColorStop(1, '#1a1030');
  ctx.fillStyle = gg; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = '#5a4488'; ctx.fillRect(0, GROUND_Y, W, 4);
  const s4 = -(G.scroll * 1.0) % 80;
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  for (let x = s4 - 80; x < W + 80; x += 80) { ctx.fillRect(x, GROUND_Y + 20, 40, 6); ctx.fillRect(x + 50, GROUND_Y + 50, 26, 5); }
}

function drawFace(sc, hit, dying, angry) {
  // 目
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-16, -8, 9, 11, 0, 0, Math.PI * 2); ctx.ellipse(14, -8, 9, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  if (dying) {
    ctx.lineWidth = 3; ctx.strokeStyle = '#222';
    [[-16, -8], [14, -8]].forEach(([ex, ey]) => { ctx.beginPath(); ctx.moveTo(ex - 5, ey - 5); ctx.lineTo(ex + 5, ey + 5); ctx.moveTo(ex + 5, ey - 5); ctx.lineTo(ex - 5, ey + 5); ctx.stroke(); });
  } else if (hit > 0) {
    ctx.beginPath(); ctx.arc(-16, -8, 6, 0, Math.PI * 2); ctx.arc(14, -8, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-16, -8, 2, 0, Math.PI * 2); ctx.arc(14, -8, 2, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.ellipse(-19, -7, 4.5, 6, 0, 0, Math.PI * 2); ctx.ellipse(11, -7, 4.5, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-20, -10, 1.8, 0, Math.PI * 2); ctx.arc(10, -10, 1.8, 0, Math.PI * 2); ctx.fill();
  }
  if (angry) { ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-26, -24); ctx.lineTo(-8, -18); ctx.moveTo(24, -24); ctx.lineTo(6, -18); ctx.stroke(); }
  // 口
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5; ctx.beginPath();
  if (dying) ctx.arc(-1, 14, 6, Math.PI, 0);
  else if (hit > 0) { ctx.ellipse(-1, 12, 5, 7, 0, 0, Math.PI * 2); }
  else ctx.arc(-1, 6, 7, 0.2, Math.PI - 0.2);
  ctx.stroke();
  // ほっぺ

  ctx.beginPath(); ctx.arc(-28, 4, 5, 0, Math.PI * 2); ctx.arc(26, 4, 5, 0, Math.PI * 2); ctx.fill();
}

function drawEnemy(en) {
  const dying = en.dead > 0;
  const prog = dying ? 1 - en.dead / en.deadMax : 0;
  const sc = en.scale * (dying ? 1 + prog * 0.6 : 1) * (0.6 + 0.4 * easeOut(en.enter));
  const wob = Math.sin(en.t * 6);
  let sx = 1 + wob * 0.05, sy = 1 - wob * 0.05;
  if (en.hit > 0) { const k = en.hit / 0.14; sx += 0.28 * k; sy -= 0.22 * k; }
  const x = en.x + en.kb, y = en.y;
  const cols = ENEMY_COLORS[en.type];
  ctx.save();
  if (dying) ctx.globalAlpha = 1 - prog;
  // 影
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x, y + 2, 46 * sc * sx, 9 * sc, 0, 0, Math.PI * 2); ctx.fill();
  ctx.translate(x, y);
  const fly = (en.type === 'ghost' || en.type === 'ghost2' || en.type === 'bat') ? -40 - Math.sin(en.t * 3) * 10 : 0;
  ctx.translate(0, fly);
  ctx.scale(sc * sx, sc * sy);
  const flash = en.hit > 0.06;
  const body = flash ? '#ffffff' : cols[0], dark = flash ? '#ffffff' : cols[2], light = flash ? '#ffffff' : cols[1];

  if (en.type === 'slime' || en.type === 'slime2' || en.type === 'boss') {
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.moveTo(-46, 0);
    ctx.bezierCurveTo(-52, -40, -30, -76, 0, -76); ctx.bezierCurveTo(30, -76, 52, -40, 46, 0);
    ctx.bezierCurveTo(30, 6, -30, 6, -46, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = light; ctx.globalAlpha *= 0.7; ctx.beginPath(); ctx.ellipse(-16, -52, 10, 6, -0.5, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha /= 0.7;
    ctx.fillStyle = dark; ctx.globalAlpha *= 0.4; ctx.beginPath(); ctx.ellipse(0, -8, 42, 12, 0, 0, Math.PI); ctx.fill(); ctx.globalAlpha /= 0.4;
    if (en.type === 'boss') {
      // 王冠 + トゲ
      ctx.fillStyle = flash ? '#fff' : '#ffd36e';
      ctx.beginPath(); ctx.moveTo(-22, -74); ctx.lineTo(-22, -96); ctx.lineTo(-11, -84); ctx.lineTo(0, -100); ctx.lineTo(11, -84); ctx.lineTo(22, -96); ctx.lineTo(22, -74); ctx.closePath(); ctx.fill();
      ctx.fillStyle = flash ? '#fff' : '#ff8fa3'; ctx.beginPath(); ctx.arc(0, -84, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = dark;
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 26 - 6, -66 + Math.abs(i) * 14); ctx.lineTo(i * 26, -84 + Math.abs(i) * 14); ctx.lineTo(i * 26 + 6, -66 + Math.abs(i) * 14); ctx.fill(); }
    }
    ctx.translate(0, -30); drawFace(sc, en.hit, dying, en.type === 'boss');
  } else if (en.type === 'mush') {
    ctx.fillStyle = flash ? '#fff' : '#ffe6c7'; rr(-22, -48, 44, 48, 12); ctx.fill();
    ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, -50, 52, 30, 0, Math.PI, 0); ctx.lineTo(52, -44); ctx.quadraticCurveTo(0, -30, -52, -44); ctx.closePath(); ctx.fill();
    ctx.fillStyle = light;
    [[-28, -60, 7], [2, -72, 9], [30, -58, 6], [-6, -50, 4]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(dx, dy, r, 0, Math.PI * 2); ctx.fill(); });
    ctx.translate(0, -22); drawFace(sc, en.hit, dying, false);
  } else if (en.type === 'ghost' || en.type === 'ghost2') {
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.moveTo(-40, 0);
    ctx.lineTo(-40, -50); ctx.arc(0, -50, 40, Math.PI, 0); ctx.lineTo(40, 0);
    for (let k = 1; k <= 6; k++) ctx.quadraticCurveTo(40 - (k - 0.5) * 13.33, (k % 2 ? 14 : -12) + Math.sin(en.t * 8 + k) * 3, 40 - k * 13.33, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = light; ctx.globalAlpha *= 0.5; ctx.beginPath(); ctx.ellipse(-16, -66, 9, 5, -0.6, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha /= 0.5;
    // 手
    ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(-46, -28 + Math.sin(en.t * 4) * 4, 10, 7, 0.4, 0, Math.PI * 2); ctx.ellipse(46, -28 - Math.sin(en.t * 4) * 4, 10, 7, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.translate(0, -36); drawFace(sc, en.hit, dying, false);
  } else if (en.type === 'bat') {
    const flap = Math.sin(en.t * 14) * 0.5;
    ctx.fillStyle = dark;
    [[-1, 1], [1, -1]].forEach(([d, s]) => {
      ctx.save(); ctx.scale(d, 1); ctx.rotate(flap * 0.8);
      ctx.beginPath(); ctx.moveTo(20, -30); ctx.quadraticCurveTo(60, -70, 90, -40); ctx.quadraticCurveTo(75, -35, 78, -12);
      ctx.quadraticCurveTo(60, -22, 52, -4); ctx.quadraticCurveTo(40, -18, 24, -8); ctx.closePath(); ctx.fill(); ctx.restore();
    });
    ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, -26, 32, 30, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-26, -46); ctx.lineTo(-18, -70); ctx.lineTo(-6, -50); ctx.moveTo(26, -46); ctx.lineTo(18, -70); ctx.lineTo(6, -50); ctx.fill();
    ctx.fillStyle = light; ctx.beginPath(); ctx.moveTo(-8, -12); ctx.lineTo(-5, -4); ctx.lineTo(-2, -12); ctx.moveTo(8, -12); ctx.lineTo(5, -4); ctx.lineTo(2, -12); ctx.fill();
    ctx.translate(0, -26); drawFace(sc, en.hit, dying, false);
  }
  ctx.restore();
  // HP バー
  if (!dying && en.enter > 0.3) {
    const bw = 150, bx = x - bw / 2, by = 292;   // 単語パネル(〜268)の直下に固定
    ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(bx - 3, by - 3, bw + 6, 16, 6); ctx.fill();
    const ratio = en.hp / en.maxHp;
    const hg = ctx.createLinearGradient(bx, 0, bx + bw, 0); hg.addColorStop(0, '#ff4d6d'); hg.addColorStop(1, '#ffb347');
    ctx.fillStyle = hg; if (ratio > 0) { rr(bx, by, bw * ratio, 10, 4); ctx.fill(); }
    text(`HP ${en.hp}/${en.maxHp}`, x, by - 12, 13, '#fff', { stroke: 3 });
  }
}

function drawWordPanel() {
  const w = G.word; if (!w) return;

  ctx.fillStyle = 'rgba(8,6,30,.72)'; rr(px, py, pw, ph, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 2; rr(px, py, pw, ph, 22); ctx.stroke();
  // カテゴリタグ
  const tagCol = w.tier === 3 ? '#ff4d6d' : w.tier === 2 ? '#b04dff' : '#3f9cff';
  ctx.fillStyle = tagCol; rr(px + 16, py - 12, 110, 24, 12); ctx.fill();
  text(w.cat, px + 71, py, 13, '#fff');
  if (w.tier === 3) { ctx.fillStyle = '#ffd36e'; rr(px + 134, py - 12, 60, 24, 12); ctx.fill(); text('BOSS', px + 164, py, 12, '#3a1a00'); }
  // 漢字・かな
  const missFlash = (G.elapsed - G.missAt) < 0.25 && G.missAt > 0;
  const ksize = w.kanji.length > 12 ? 30 : w.kanji.length > 8 ? 36 : 44;
  text(w.kanji, W / 2, py + 44, ksize, missFlash ? '#ff8fa3' : '#fff', { stroke: 5 });
  text(w.hira, W / 2, py + 84, 18, 'rgba(255,255,255,.75)', { weight: 700 });
  // ローマ字ガイド
  const g = ROMA.guide(w.st);
  const full = g.typed + g.rest;
  const size = full.length > 26 ? 22 : full.length > 18 ? 26 : 30;
  ctx.font = `900 ${size}px ${MONO}`; ctx.textBaseline = 'middle';
  const tw = ctx.measureText(g.typed).width, rw = ctx.measureText(g.rest).width;
  const x0 = W / 2 - (tw + rw) / 2, ry = py + 122;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd36e'; ctx.fillText(g.typed, x0, ry);
  ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fillText(g.rest, x0 + tw, ry);
  // 次の文字の下線カーソル
  if (g.rest.length) {
    const cw = ctx.measureText(g.rest[0]).width;
    const blink = 0.5 + 0.5 * Math.sin(G.bgT * 10);
    ctx.fillStyle = `rgba(255,211,110,${(0.4 + blink * 0.6).toFixed(2)})`;
    rr(x0 + tw, ry + size * 0.55, cw, 4, 2); ctx.fill();
  }
}
/** 敵の頭上の輪: SPEED ボーナスの残り時間。なくなると赤くなる（ペナルティはなし） */
function drawParRing(en) {
  const w = G.word; if (!w || en.dead > 0) return;

  if (k > 0) { ctx.strokeStyle = k > 0.3 ? '#8ed6ff' : '#ffd36e'; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(x, y, 16, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke(); }
  else { ctx.fillStyle = 'rgba(255,100,120,.6)'; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill(); }

/** 単語を打ち切ったときの斬撃 */
function drawSlash() {
  const sl = G.slash; if (!sl) return;
  const k = 1 - sl.t / sl.max;
  ctx.save(); ctx.translate(sl.x, sl.y); ctx.rotate(-0.6); ctx.globalAlpha = 1 - k;
  const len = 90 + k * 120, wd = 10 * (1 - k) + 2;
  const g = ctx.createLinearGradient(-len, 0, len, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-len, 0); ctx.quadraticCurveTo(0, -wd, len, 0); ctx.quadraticCurveTo(0, wd, -len, 0); ctx.fill();
  ctx.globalAlpha = (1 - k) * 0.5; ctx.fillStyle = '#ffd36e'; ctx.beginPath(); ctx.arc(0, 0, 30 + k * 60, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawHUD() {
  // タイマー
  const tratio = FES.clamp(G.time / GAME_TIME, 0, 1);
  const bw = 420, bx = W / 2 - bw / 2, by = 60;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(bx - 3, by - 3, bw + 6, 20, 10); ctx.fill();
  const tc = tratio > 0.5 ? '#5ee06a' : tratio > 0.2 ? '#ffd36e' : '#ff4d6d';
  ctx.fillStyle = tc; if (tratio > 0) { rr(bx, by, bw * tratio, 14, 7); ctx.fill(); }
  const secs = Math.ceil(G.time);
  const urgent = secs <= 10 && state === 'play';
  const tsz = urgent ? 40 + Math.sin(G.bgT * 12) * 4 : 36;
  text(`${secs}`, W / 2, 34, tsz, urgent ? '#ff6b8a' : '#fff', { stroke: 5 });
  text('TIME', W / 2 + 46, 40, 12, 'rgba(255,255,255,.6)');
  // スコア（左）
  ctx.fillStyle = 'rgba(8,6,30,.6)'; rr(18, 66, 200, 44, 12); ctx.fill();
  text('SCORE', 30, 80, 11, 'rgba(255,255,255,.6)', { align: 'left' });
  text(Math.floor(G.dispScore).toLocaleString(), 206, 90, 24, '#ffd36e', { align: 'right' });
  // KPM / ACC（右）
  const total = G.correct + G.miss;
  const acc = total ? (G.correct / total * 100) : 100;
  const kpm = G.elapsed > 0 ? Math.round(G.correct * 60 / Math.max(G.elapsed, 6)) : 0;
  ctx.fillStyle = 'rgba(8,6,30,.6)'; rr(W - 258, 66, 240, 44, 12); ctx.fill();
  text('KPM', W - 246, 80, 11, 'rgba(255,255,255,.6)', { align: 'left' });
  text(`${kpm}`, W - 246, 96, 20, '#8ed6ff', { align: 'left' });
  text('ACC', W - 150, 80, 11, 'rgba(255,255,255,.6)', { align: 'left' });
  text(`${acc.toFixed(1)}%`, W - 150, 96, 20, acc >= 95 ? '#5ee06a' : acc >= 85 ? '#ffd36e' : '#ff6b8a', { align: 'left' });
  text(`x${G.mult.toFixed(1)}`, W - 30, 88, 18, '#ffb347', { align: 'right' });
  // コンボ
  if (G.combo >= 3) {
    const pop = 1 + G.comboPop * 0.35;
    ctx.save(); ctx.translate(W / 2, 330); ctx.scale(pop, pop);
    const cc = G.combo >= 50 ? '#ff4d6d' : G.combo >= 20 ? '#ffb347' : '#ffd36e';
    text(`${G.combo}`, 0, 0, 48, cc, { stroke: 6 });
    text('COMBO', 0, 34, 16, '#fff', { stroke: 4 });
    if (G.combo >= 20) text('FEVER!', 0, 58, 16, `rgba(255,120,160,${0.6 + 0.4 * Math.sin(G.bgT * 10)})`, { stroke: 4 });
    ctx.restore();
  }
  // モード
  const md = MODES[MODE];
  ctx.fillStyle = md.color; rr(W - 258, 114, 90, 20, 10); ctx.fill();
  text(md.label, W - 213, 124, 12, '#101020');
}
function drawParticles() {
  for (const p of G.particles) {
    const a = FES.clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.type === 'star') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 6);
      ctx.beginPath(); for (let i = 0; i < 4; i++) { const r = i % 2 ? p.size * 0.4 : p.size; const an = i * Math.PI / 2; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); ctx.lineTo(Math.cos(an + Math.PI / 4) * r * 0.4, Math.sin(an + Math.PI / 4) * r * 0.4); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  for (const f of G.floats) {
    const a = FES.clamp(f.life / f.max * 1.5, 0, 1);
    ctx.globalAlpha = a;
    const sc = 1 + (1 - Math.min(1, (f.max - f.life) * 6)) * 0.6;
    ctx.save(); ctx.translate(f.x, f.y); ctx.scale(sc, sc);
    text(f.txt, 0, 0, f.size, f.color, { stroke: 5 });
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawTitle() {
  const t = G.bgT;
  ctx.fillStyle = 'rgba(5,3,25,.45)'; ctx.fillRect(0, 0, W, H);
  // デモ敵 & ヒーロー
  drawHero();
  // タイトル
  ctx.save(); ctx.translate(W / 2, 150); ctx.scale(1 + Math.sin(t * 2) * 0.02, 1 + Math.sin(t * 2) * 0.02);
  ctx.font = `900 74px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tg = ctx.createLinearGradient(-260, 0, 260, 0);
  tg.addColorStop(0, '#ffd36e'); tg.addColorStop(0.5, '#ff6b9a'); tg.addColorStop(1, '#8ed6ff');
  ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineJoin = 'round'; ctx.strokeText('タイピングバトル', 0, 0);
  ctx.fillStyle = tg; ctx.fillText('タイピングバトル', 0, 0);
  ctx.restore();
  text('ローマ字でモンスターをたおせ！ 60秒バトル', W / 2, 212, 20, '#fff', { stroke: 4 });
  // 説明
  ctx.fillStyle = 'rgba(8,6,30,.7)'; rr(W / 2 - 300, 240, 600, 122, 18); ctx.fill();
  text('表示されたことばをローマ字で入力（si/shi、ti/chi など どちらでもOK）', W / 2, 266, 16, '#fff', { weight: 700 });
  text('ミスするとコンボが途切れる。コンボでスコア倍率アップ！', W / 2, 294, 16, 'rgba(255,255,255,.85)', { weight: 700 });
  text('キーボード: そのまま打つ / Esc でポーズ　　スマホ: 右下 ⌨ でソフトキーボード', W / 2, 322, 15, '#8ed6ff', { weight: 700 });
  text('HI-SCORE  ' + FES.getHiScore().toLocaleString(), W / 2, 350, 15, '#ffd36e', { weight: 700 });
  // モードのボタン（1・2・3 キーでも）
  MODES.forEach((m, i) => {
    const b = modeBtnRect(i), on = i === MODE;
    ctx.fillStyle = on ? m.color : 'rgba(255,255,255,.08)'; rr(b.x, b.y, b.w, b.h, 12); ctx.fill();
    ctx.strokeStyle = on ? '#fff' : 'rgba(255,255,255,.3)'; ctx.lineWidth = on ? 2 : 1; rr(b.x, b.y, b.w, b.h, 12); ctx.stroke();
    text(`${i + 1} ${m.label}`, b.x + b.w / 2, b.y + 13, 14, on ? '#101020' : '#fff');
    text(m.sub, b.x + b.w / 2, b.y + 30, 10, on ? 'rgba(16,16,32,.8)' : 'rgba(255,255,255,.6)', { weight: 700 });
  });
  // スタートボタン
  const pulse = 1 + Math.sin(t * 5) * 0.04;
  ctx.save(); ctx.translate(W / 2, 440); ctx.scale(pulse, pulse);
  const bg = ctx.createLinearGradient(-130, 0, 130, 0); bg.addColorStop(0, '#6a5cff'); bg.addColorStop(1, '#ff4d8d');
  ctx.fillStyle = 'rgba(0,0,0,.4)'; rr(-130, -22, 260, 60, 30); ctx.fill();
  ctx.fillStyle = bg; rr(-130, -28, 260, 56, 28); ctx.fill();
  text('スタート', 0, 0, 26, '#fff');
  ctx.restore();
  text('クリック / タップ / Enter / Space', W / 2, 490, 13, 'rgba(255,255,255,.6)', { weight: 700 });
}
function modeBtnRect(i) { return { x: W / 2 - 230 + i * 160, y: 366, w: 140, h: 42 }; }
function setMode(i) { MODE = FES.clamp(i, 0, 2); try { localStorage.setItem('fes:typing:mode', String(MODE)); } catch (e) { /* ignore */ } FES.sfx('select'); }
try { const mv = Number(localStorage.getItem('fes:typing:mode')); if (mv >= 0 && mv <= 2) MODE = mv; } catch (e) { /* ignore */ }
function drawCountdown() {
  ctx.fillStyle = 'rgba(5,3,25,.35)'; ctx.fillRect(0, 0, W, H);
  const n = countdown.n, f = countdown.t % 1;
  const sc = 1.6 - easeOut(Math.min(1, f * 2)) * 0.6;
  ctx.save(); ctx.translate(W / 2, H / 2 - 20); ctx.scale(sc, sc);
  text(n > 0 ? String(n) : 'GO!', 0, 0, 120, n > 0 ? '#ffd36e' : '#5ee06a', { stroke: 12 });
  ctx.restore();
  text('READY...', W / 2, H / 2 + 80, 22, '#fff', { stroke: 4 });
}

/* =====================================================================
   メインループ
   ===================================================================== */
function render() {
  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random() - 0.5) * G.shake * 2, (Math.random() - 0.5) * G.shake * 2);
  drawBackground();
  if (state === 'title') {
    drawTitle();
  } else {
    for (const d of G.deadEnemies) drawEnemy(d);
    if (G.enemy && state !== 'countdown') { drawEnemy(G.enemy); if (state === 'play') drawParRing(G.enemy); }
    drawHero();
    drawSlash();
    drawParticles();
    if (state !== 'countdown') { drawWordPanel(); drawHUD(); }
    if (state === 'countdown') drawCountdown();
    if (state === 'result') { ctx.fillStyle = 'rgba(5,3,25,.4)'; ctx.fillRect(0, 0, W, H); text('TIME UP!', W / 2, H / 2, 70, '#ffd36e', { stroke: 10 }); }
  }
  ctx.restore();
  // 残り10秒: 画面のふちが赤く脈打つ
  if (state === 'play' && G.time <= 10 && G.time > 0) {
    const beat = Math.max(0, Math.sin(G.bgT * 10));
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.7);
    vg.addColorStop(0, 'rgba(255,59,92,0)'); vg.addColorStop(1, `rgba(255,59,92,${0.18 + beat * 0.22})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  if (G.flashRed > 0) { ctx.fillStyle = `rgba(255,40,80,${(G.flashRed * 0.9).toFixed(2)})`; ctx.fillRect(0, 0, W, H); }
  if (G.flashWhite > 0) { ctx.fillStyle = `rgba(255,255,255,${(G.flashWhite * 2).toFixed(2)})`; ctx.fillRect(0, 0, W, H); }
}
function loop(ts) {
  raf = requestAnimationFrame(loop);
  let dt = lastTs ? (ts - lastTs) / 1000 : 0; lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  try {
    if (state === 'countdown') {
      countdown.t += dt;
      const n = 3 - Math.floor(countdown.t);
      if (n !== countdown.n) { countdown.n = n; if (n > 0) FES.sfx('countdown'); }
      if (countdown.t >= 3.6) beginPlay();
      G.bgT += dt; G.hero.bob += dt; G.scroll += 30 * dt;
    } else if (state === 'pause') {
      // 停止（背景だけゆっくり）
      G.bgT += dt;
    } else {
      update(dt);
    }
    render();
  } catch (err) { console.error(err); }
}

/* =====================================================================
   起動
   ===================================================================== */
buildSoftKeyboard();
fit();
if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches && !window.matchMedia('(min-width: 1100px)').matches) setSoft(true);
raf = requestAnimationFrame(loop);
</script>
</body>
