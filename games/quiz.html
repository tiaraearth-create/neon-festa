<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>早押しクイズ王</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #07071a; overflow: hidden; color: #fff;
    font-family: "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #app { position: fixed; inset: 0; touch-action: none; }
  #app.shake { animation: shakeX .45s cubic-bezier(.36,.07,.19,.97); }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; }
  .screen.on { display: flex; }

  /* ---------------- タイトル ---------------- */
  #title { padding: 60px 16px 14px; gap: 1.6vmin; overflow: hidden; }
  .crown { font-size: clamp(28px, 7vmin, 72px); line-height: 1; animation: logoBob 3s ease-in-out infinite; filter: drop-shadow(0 0 14px rgba(255,211,110,.8)); }
  .logo-top { font-size: clamp(12px, 2.2vmin, 22px); letter-spacing: .5em; color: #ffd36e; font-weight: 900; text-shadow: 0 0 12px rgba(255,211,110,.8); margin-left: .5em; }
  .logo {
    font-size: clamp(40px, 10.5vmin, 120px); font-weight: 900; line-height: 1.1; letter-spacing: .02em; white-space: nowrap;
    background: linear-gradient(180deg, #fffbe6 0%, #ffd36e 40%, #ff8a3d 68%, #fff1c2 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 16px rgba(255,180,60,.55)) drop-shadow(0 5px 0 rgba(120,40,0,.7));
    animation: logoBob 3s ease-in-out infinite;
  }
  .hiscore { font-size: clamp(14px, 2.6vmin, 24px); font-weight: 900; color: #8ed6ff; letter-spacing: .15em; text-shadow: 0 0 12px rgba(142,214,255,.7); }
  .hiscore b { color: #fff; font-size: 1.25em; margin-left: .3em; font-variant-numeric: tabular-nums; }
  .cat-label { font-size: clamp(12px, 2vmin, 18px); letter-spacing: .3em; opacity: .75; font-weight: 700; margin-top: .6vmin; }
  .cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 8px; width: min(94vw, 980px); }
  .cat {
    border: 2px solid rgba(255,255,255,.2); background: rgba(20,15,60,.7); color: #fff; border-radius: 14px; padding: 8px 6px;
    font-size: clamp(13px, 2.2vmin, 20px); font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform .12s, border-color .12s, background .12s, box-shadow .12s; white-space: nowrap;
  }
  .cat:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.5); }
  .cat.sel { border-color: #ffd36e; background: linear-gradient(135deg, rgba(255,211,110,.35), rgba(255,138,61,.3)); box-shadow: 0 0 18px rgba(255,211,110,.5); transform: scale(1.04); }
  .cat .ci { font-size: 1.25em; }
  .howto { font-size: clamp(12px, 2vmin, 18px); opacity: .85; text-align: center; line-height: 1.7; font-weight: 700; }
  .howto kbd { display: inline-block; padding: 0 .45em; border-radius: 6px; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); font-family: inherit; }
  #start {
    border: 0; color: #fff; border-radius: 999px; padding: clamp(10px,1.8vmin,18px) clamp(36px,7vmin,70px); font-size: clamp(20px, 4vmin, 40px); font-weight: 900; letter-spacing: .15em; cursor: pointer;
    background: linear-gradient(135deg, #ff4d8d, #ff9a3d); box-shadow: 0 10px 30px rgba(255,80,120,.5), 0 0 0 4px rgba(255,255,255,.12);
    animation: startPulse 1.4s ease-in-out infinite; transition: transform .1s;
  }
  #start:hover { filter: brightness(1.12); } #start:active { transform: scale(.95); }

  /* ---------------- カウントダウン ---------------- */
  #count { gap: 2vmin; }
  #cdcat { font-size: clamp(18px, 4vmin, 40px); font-weight: 900; color: #ffd36e; letter-spacing: .2em; text-shadow: 0 0 16px rgba(255,211,110,.7); }
  #cdnum { font-size: clamp(90px, 32vmin, 320px); font-weight: 900; line-height: 1; color: #fff; text-shadow: 0 0 40px rgba(255,211,110,.9), 0 10px 0 rgba(120,40,0,.6); }
  #cdnum.anim { animation: cd .8s cubic-bezier(.2,1.4,.4,1); }

  /* ---------------- プレイ ---------------- */
  #play { padding: 62px 16px 14px; gap: 1.4vmin; justify-content: center; }
  #hud { position: absolute; top: 10px; left: 62px; right: 62px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 1.5vw; pointer-events: none; }
  .hud-item {
    background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.2); border-radius: 12px; padding: 4px 14px; font-weight: 900; white-space: nowrap;
    font-size: clamp(13px, 2.6vmin, 24px); font-variant-numeric: tabular-nums; backdrop-filter: blur(4px);
  }
  .hud-item small { font-size: .65em; opacity: .7; margin-right: .4em; letter-spacing: .1em; }
  #hud-score { color: #ffd36e; }
  #hud-combo { color: #7cff8a; opacity: 0; transition: opacity .2s; display: none; }
  #hud-combo.show { opacity: 1; display: block; }
  #hud-combo.bump { animation: bump .35s cubic-bezier(.2,1.6,.4,1); }
  #hud-q.last { color: #ff6b9d; }
  #dots { display: flex; gap: 5px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3); }
  .dot.ok { background: #ffd36e; border-color: #fff; box-shadow: 0 0 8px rgba(255,211,110,.9); }
  .dot.ng { background: #ff5c5c; border-color: #ffb3b3; }
  .dot.cur { background: #fff; animation: dotPulse .7s ease-in-out infinite alternate; }
  @keyframes dotPulse { from { transform: scale(1) } to { transform: scale(1.5); box-shadow: 0 0 10px #fff } }

  #qcard {
    position: relative; width: min(96vw, 1100px); border-radius: 22px; padding: 1.6vmin 3vmin; text-align: center;
    background: linear-gradient(160deg, rgba(48,34,130,.94), rgba(16,10,54,.97)); border: 2px solid rgba(255,211,110,.6);
    box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(120,90,255,.35), inset 0 0 0 1px rgba(255,255,255,.08);
    transform: translateX(-120vw); opacity: 0;
  }
  #qcard.in { animation: slideIn .5s cubic-bezier(.2,1.3,.4,1) forwards; }
  #qcard.out { animation: slideOut .28s ease-in forwards; }
  .qmeta { display: flex; justify-content: center; align-items: center; gap: 1.5em; font-size: clamp(12px, 2.2vmin, 20px); font-weight: 900; letter-spacing: .1em; opacity: .95; }
  #qdiff { color: #ffd36e; }
  #qtext { font-size: clamp(22px, 4.6vmin, 52px); font-weight: 900; line-height: 1.35; min-height: 2.75em; display: flex; align-items: center; justify-content: center; text-shadow: 0 2px 0 rgba(0,0,0,.4); overflow-wrap: anywhere; }
  #fb { position: absolute; inset: -2px; border-radius: 22px; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(8,4,30,.9); z-index: 3; }
  #fb.show { display: flex; animation: fbIn .4s cubic-bezier(.2,1.5,.4,1); }
  #fb .big { font-size: clamp(34px, 8vmin, 92px); font-weight: 900; line-height: 1.1; letter-spacing: .05em; }
  #fb.ok .big { color: #ffe97a; text-shadow: 0 0 24px rgba(255,200,60,.9), 0 4px 0 rgba(120,40,0,.6); }
  #fb.ng .big { color: #ff6b6b; text-shadow: 0 0 24px rgba(255,60,60,.8), 0 4px 0 rgba(80,0,0,.6); }
  #fb .sub { font-size: clamp(16px, 3.2vmin, 36px); font-weight: 900; margin-top: .3em; color: #fff; }
  #fb .sub .bonus { color: #7cff8a; margin-left: .5em; }
  #fb .sub .mult { color: #ff6b9d; margin-left: .5em; }

  .tbar { width: min(96vw, 1100px); display: flex; align-items: center; gap: 10px; }
  #timer { flex: 1; height: clamp(12px, 2.4vmin, 24px); background: rgba(255,255,255,.1); border-radius: 999px; overflow: hidden; border: 1px solid rgba(255,255,255,.25); box-shadow: inset 0 2px 6px rgba(0,0,0,.5); }
  #tfill { height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(90deg, #4dffb8, #ffd36e); box-shadow: 0 0 12px rgba(255,255,255,.4); }
  #tnum { width: 3.2em; text-align: right; font-weight: 900; font-size: clamp(16px, 3vmin, 30px); font-variant-numeric: tabular-nums; color: #fff; }
  #tnum.hurry { color: #ff5c5c; animation: bump .3s infinite alternate; }
  .tbar.frozen #tfill { background: linear-gradient(90deg, #8ed6ff, #eaf9ff) !important; box-shadow: 0 0 18px rgba(142,214,255,.9); }
  .tbar.frozen #tnum { color: #8ed6ff; animation: none; }

  /* ライフライン */
  #lifes { display: flex; gap: 10px; width: min(96vw, 1100px); justify-content: center; }
  .life {
    flex: 1; max-width: 360px; border-radius: 14px; border: 2px solid rgba(142,214,255,.5); background: rgba(10,20,60,.75); color: #fff;
    padding: 5px 10px; display: flex; flex-direction: column; align-items: center; cursor: pointer; font-weight: 900; line-height: 1.25;
    transition: transform .1s, opacity .2s, border-color .1s; box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  .life b { font-size: clamp(14px, 2.6vmin, 24px); color: #8ed6ff; letter-spacing: .05em; }
  .life span { font-size: clamp(10px, 1.7vmin, 14px); opacity: .85; font-weight: 700; }
  .life span kbd { display: inline-block; padding: 0 .4em; border-radius: 5px; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); font-family: inherit; }
  .life:hover { transform: translateY(-2px); border-color: #fff; }
  .life:active { transform: scale(.96); }
  .life.used { opacity: .3; pointer-events: none; filter: grayscale(1); }
  .life.used b { text-decoration: line-through; }
  .life.flash { animation: lifeFlash .5s ease-out; }
  @keyframes lifeFlash { 0% { box-shadow: 0 0 0 0 rgba(142,214,255,1) } 100% { box-shadow: 0 0 0 24px rgba(142,214,255,0) } }
  .opt.cut { opacity: .15; pointer-events: none; filter: grayscale(1); transform: scale(.94); transition: opacity .3s, transform .3s; }

  #opts { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4vmin; width: min(96vw, 1100px); }
  .opt {
    position: relative; min-height: clamp(58px, 12.5vmin, 124px); border-radius: 18px; border: 2px solid rgba(255,255,255,.25);
    background: linear-gradient(160deg, rgba(74,60,170,.92), rgba(28,22,80,.96)); color: #fff; font-weight: 900; font-size: clamp(17px, 3.6vmin, 40px);
    display: flex; align-items: center; gap: 1.5vmin; padding: .8vmin 2vmin .8vmin 1.4vmin; cursor: pointer; text-align: left; line-height: 1.25;
    box-shadow: 0 10px 30px rgba(0,0,0,.45); opacity: 0; transform: scale(.6);
  }
  .opt.pop { animation: pop .38s cubic-bezier(.2,1.6,.4,1) forwards; }
  .opt.live { opacity: 1; transform: none; transition: transform .1s, border-color .1s, filter .1s; }
  .opt.live:hover { transform: scale(1.03); border-color: #fff; filter: brightness(1.15); }
  .opt.live:active { transform: scale(.97); }
  .opt .num { flex: none; width: clamp(32px, 6vmin, 64px); height: clamp(32px, 6vmin, 64px); border-radius: 50%; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; font-size: .85em; border: 2px solid rgba(255,255,255,.35); }
  .opt .txt { flex: 1; overflow-wrap: anywhere; }
  .opt .key { position: absolute; right: 10px; bottom: 4px; font-size: .45em; opacity: .5; letter-spacing: .1em; }
  .opt.correct { background: linear-gradient(135deg, #fff3b0, #ffd23c 45%, #ff9d1c); color: #3a1a00; border-color: #fff; animation: goldPulse .55s ease-out 3; box-shadow: 0 0 40px rgba(255,200,60,.95), 0 0 90px rgba(255,160,0,.6); opacity: 1; transform: none; z-index: 2; }
  .opt.correct .num { background: rgba(255,255,255,.55); border-color: #fff; color: #3a1a00; }
  .opt.correct::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.75) 50%, transparent 70%); background-size: 250% 100%; animation: shine .8s linear 2; }
  .opt.wrong { background: linear-gradient(135deg, #ff5a5a, #8a0f2a); border-color: #ffb3b3; animation: shakeX .5s; opacity: 1; transform: none; }
  .opt.reveal { border-color: #ffd36e; box-shadow: 0 0 30px rgba(255,211,110,.8); animation: revealPulse .6s ease-in-out infinite alternate; opacity: 1; transform: none; }
  .opt.dim { opacity: .3; transform: none; filter: grayscale(.4); }
  #opts.out .opt { animation: optOut .25s ease-in forwards; }
  .pts { position: absolute; left: 50%; top: 10%; transform: translateX(-50%); font-size: clamp(22px, 5vmin, 56px); font-weight: 900; color: #fff; text-shadow: 0 0 14px rgba(255,211,110,1), 0 3px 0 rgba(120,40,0,.7); pointer-events: none; animation: ptsRise 1.1s ease-out forwards; z-index: 4; white-space: nowrap; }

  #last { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: none; flex-direction: column; align-items: center; padding: 3vmin 0; z-index: 8; text-align: center;
    background: linear-gradient(90deg, transparent, rgba(255,40,100,.92) 18%, rgba(255,40,100,.92) 82%, transparent); box-shadow: 0 0 60px rgba(255,40,100,.6); }
  #last.show { display: flex; animation: lastIn 1.6s cubic-bezier(.2,1.2,.4,1) forwards; }
  #last .l1 { font-size: clamp(30px, 8vmin, 100px); font-weight: 900; letter-spacing: .08em; text-shadow: 0 0 24px rgba(255,255,255,.8), 0 5px 0 rgba(80,0,30,.7); }
  #last .l2 { font-size: clamp(16px, 3.5vmin, 40px); font-weight: 900; color: #ffe97a; letter-spacing: .3em; }

  #pbtn { position: absolute; right: 12px; bottom: 12px; width: 48px; height: 48px; border-radius: 14px; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.5); color: #fff; font-size: 20px; font-weight: 900; cursor: pointer; z-index: 5; }
  #pbtn:active { transform: scale(.94); }

  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 40; }
  #flash.go { animation: flashOut .5s ease-out; }

  /* ---------------- アニメ ---------------- */
  @keyframes logoBob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1vmin) } }
  @keyframes startPulse { 0%,100% { transform: scale(1); box-shadow: 0 10px 30px rgba(255,80,120,.5), 0 0 0 4px rgba(255,255,255,.12) } 50% { transform: scale(1.05); box-shadow: 0 14px 40px rgba(255,80,120,.75), 0 0 0 8px rgba(255,255,255,.06) } }
  @keyframes cd { 0% { transform: scale(2.6); opacity: 0 } 50% { transform: scale(.95); opacity: 1 } 100% { transform: scale(1); opacity: 1 } }
  @keyframes slideIn { from { transform: translateX(-120vw); opacity: 0 } to { transform: translateX(0); opacity: 1 } }
  @keyframes slideOut { from { transform: translateX(0); opacity: 1 } to { transform: translateX(120vw); opacity: 0 } }
  @keyframes pop { from { transform: scale(.5) translateY(30px); opacity: 0 } to { transform: scale(1) translateY(0); opacity: 1 } }
  @keyframes optOut { to { transform: scale(.8) translateY(20px); opacity: 0 } }
  @keyframes goldPulse { 0% { transform: scale(1) } 40% { transform: scale(1.06) } 100% { transform: scale(1) } }
  @keyframes shine { from { background-position: 150% 0 } to { background-position: -150% 0 } }
  @keyframes shakeX { 10%,90% { transform: translate3d(-2px,0,0) } 20%,80% { transform: translate3d(4px,0,0) } 30%,50%,70% { transform: translate3d(-8px,0,0) } 40%,60% { transform: translate3d(8px,0,0) } }
  @keyframes revealPulse { from { box-shadow: 0 0 16px rgba(255,211,110,.5) } to { box-shadow: 0 0 40px rgba(255,211,110,1) } }
  @keyframes fbIn { from { transform: scale(1.8); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  @keyframes ptsRise { 0% { transform: translate(-50%, 0) scale(.6); opacity: 0 } 20% { transform: translate(-50%, -10px) scale(1.2); opacity: 1 } 100% { transform: translate(-50%, -70px) scale(1); opacity: 0 } }
  @keyframes lastIn { 0% { transform: translateY(-50%) scaleX(0); opacity: 0 } 15% { transform: translateY(-50%) scaleX(1); opacity: 1 } 85% { transform: translateY(-50%) scaleX(1); opacity: 1 } 100% { transform: translateY(-50%) scaleX(1.1); opacity: 0 } }
  @keyframes bump { from { transform: scale(1.35) } to { transform: scale(1) } }
  @keyframes flashOut { from { opacity: 1 } to { opacity: 0 } }

  /* ---------------- レスポンシブ ---------------- */
  @media (max-aspect-ratio: 4/5) {
    #opts { grid-template-columns: 1fr; }
    .opt { min-height: clamp(50px, 9vh, 96px); font-size: clamp(16px, 5vw, 30px); }
    #qtext { font-size: clamp(20px, 5.6vw, 40px); min-height: 3.2em; }
    .logo { font-size: clamp(34px, 12vw, 80px); }
    .cats { grid-template-columns: 1fr 1fr; gap: 6px; }
    .cat { padding: 6px 4px; }
    #title { gap: 1vmin; padding-top: 56px; }
    .howto { font-size: 12px; line-height: 1.5; }
    .pc-only { display: none; }
    #pool { display: block; font-size: 11px; letter-spacing: 0; }
  }
  @media (max-height: 520px) {
    #play { padding-top: 56px; gap: 6px; }
    #qcard { padding: 6px 14px; } #qtext { min-height: 2em; font-size: clamp(18px, 4.4vmin, 36px); }
    .opt { min-height: 44px; }
    #title { padding-top: 54px; gap: 6px; } .crown { display: none; } .logo-top { display: none; }
    .howto { font-size: 11px; line-height: 1.4; } .pc-only { display: none; } .cat-label { margin-top: 0; }
    #start { padding: 6px 40px; font-size: 20px; }
    .life { padding: 2px 8px; } .life span { display: none; }
  }
  @media (max-width: 560px) {
    .hud-item { padding: 2px 7px; font-size: 11px; }
    #hud { gap: 5px; left: 58px; right: 58px; top: 8px; height: auto; flex-wrap: wrap; row-gap: 4px; }
    #dots { order: 9; flex-basis: 100%; justify-content: center; gap: 3px; }   /* ドットは 2 段目に */
    .dot { width: 7px; height: 7px; }
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <!-- タイトル -->
  <section id="title" class="screen on">
    <div class="crown">👑</div>
    <div class="logo-top">SPEED QUIZ CHAMPION</div>
    <div class="logo">早押しクイズ王</div>
    <div class="hiscore">HI-SCORE<b id="hiscore">0</b></div>
    <div class="cat-label">ジャンルをえらぶ　<span id="pool"></span></div>
    <div class="cats" id="cats"></div>
    <div class="howto">
      <span class="pc-only">🖱️ クリック / 👆 タップで回答　⌨️ <kbd>1</kbd>〜<kbd>4</kbd> または <kbd>A</kbd>〜<kbd>D</kbd> キー<br></span>
      10問・各10秒。速く答えるほど高得点！ 連続正解でコンボボーナス。<span class="pc-only"><kbd>Esc</kbd>/<kbd>P</kbd> でポーズ</span><br>
      🛟 ライフライン: <span class="pc-only"><kbd>F</kbd> </span>50:50（2択にする）／ <span class="pc-only"><kbd>T</kbd> </span>FREEZE（5秒止める）　各1回・使った問題は得点半分
    </div>
    <button id="start" type="button">スタート</button>
  </section>

  <!-- カウントダウン -->
  <section id="count" class="screen">
    <div id="cdcat"></div>
    <div id="cdnum">3</div>
  </section>

  <!-- プレイ -->
  <section id="play" class="screen">
    <div id="hud">
      <div class="hud-item" id="hud-q">Q1/10</div>
      <div id="dots"></div>
      <div class="hud-item" id="hud-score"><small>SCORE</small>0</div>
      <div class="hud-item" id="hud-combo">0 COMBO</div>
    </div>
    <div id="qcard">
      <div class="qmeta"><span id="qcat"></span><span id="qdiff"></span></div>
      <div id="qtext"></div>
      <div id="fb"></div>
    </div>
    <div class="tbar"><div id="timer"><div id="tfill"></div></div><div id="tnum">10.0</div></div>
    <div id="opts"></div>
    <div id="lifes">
      <button class="life" id="life-half" type="button"><b>½ 50:50</b><span>まちがいを 2 つ消す <kbd>F</kbd></span></button>
      <button class="life" id="life-freeze" type="button"><b>❄ FREEZE</b><span>5 秒 時間を止める <kbd>T</kbd></span></button>
    </div>
    <div id="last"><div class="l1">ラストクエスチョン！</div><div class="l2">配点 2 倍</div></div>
    <button id="pbtn" type="button" title="ポーズ">❚❚</button>
  </section>

  <!-- ポーズ画面は共通の FES.pause を使う -->
</div>
<div id="flash"></div>

<script src="../common.js"></script>
<script id="quiz-data">
'use strict';
/* =====================================================================
   問題データ  [カテゴリ, 難易度(1-3), 問題文, 正解, 誤答1, 誤答2, 誤答3]
   正解は必ず index 3。選択肢はプレイ時にシャッフルされる。
   ===================================================================== */
const QUIZ_STATIC = [
  /* ---------------- 一般常識 ---------------- */

/* 計算問題を自動生成（毎プレイ違う問題になる） */
function quizGenMath() {
  const R = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  const out = [];
  const seen = new Set();
  function push(d, q, ans) {
    if (seen.has(q)) return;
    const wrong = new Set();
    let guard = 0;
    while (wrong.size < 3 && guard++ < 200) {
      const span = Math.max(3, Math.round(Math.abs(ans) * 0.2) + 2);
      const v = ans + R(1, span) * (Math.random() < 0.5 ? -1 : 1);
      if (v !== ans && v >= 0) wrong.add(v);
    }
    if (wrong.size < 3) return;
    seen.add(q);
    out.push(['math', d, q, String(ans), ...[...wrong].map(String)]);
  }
  for (let i = 0; i < 8; i++) { const a = R(2, 40), b = R(2, 40); push(1, a + ' ＋ ' + b + ' ＝ ？', a + b); }
  for (let i = 0; i < 4; i++) { const a = R(10, 60), b = R(1, a - 1); push(1, a + ' − ' + b + ' ＝ ？', a - b); }
  for (let i = 0; i < 8; i++) { const a = R(2, 12), b = R(2, 12); push(2, a + ' × ' + b + ' ＝ ？', a * b); }
  for (let i = 0; i < 4; i++) { const a = R(11, 99), b = R(11, 99), c = R(11, 99); push(2, a + ' ＋ ' + b + ' ＋ ' + c + ' ＝ ？', a + b + c); }
  for (let i = 0; i < 5; i++) { const a = R(12, 49), b = R(3, 9); push(3, a + ' × ' + b + ' ＝ ？', a * b); }
  for (let i = 0; i < 4; i++) { const b = R(3, 12), q = R(12, 40); push(3, (b * q) + ' ÷ ' + b + ' ＝ ？', q); }
  for (let i = 0; i < 4; i++) { const p = [10, 20, 25, 50, 5][R(0, 4)], base = R(2, 20) * 20; push(3, base + ' の ' + p + '% は？', base * p / 100); }
  return out;
}

(typeof window !== 'undefined' ? window : globalThis).QUIZ_DATA = { STATIC: QUIZ_STATIC, genMath: quizGenMath };

  bgm: false, bgmAcc: 0, bgmStep: 0, bgmFast: false,
};

/* =====================================================================
   スケジューラ（rAF の dt で進む → ポーズで止まり、リトライで全消去できる）
   ===================================================================== */
const tasks = [];
function later(fn, sec) { tasks.push({ t: sec, fn }); }
function clearTasks() { tasks.length = 0; }
function runTasks(dt) {
  const due = [];
  for (let i = tasks.length - 1; i >= 0; i--) {
    tasks[i].t -= dt;
    if (tasks[i].t <= 0) due.push(tasks.splice(i, 1)[0]);
  }
  due.sort((a, b) => a.t - b.t);
  for (const k of due) { try { k.fn(); } catch (e) { console.error(e); } }
}

/* =====================================================================
   ユーティリティ
   ===================================================================== */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function retrigger(node, cls) { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
function fmt(n) { return Math.floor(n).toLocaleString(); }
function showScreen(id) { for (const s of document.querySelectorAll('.screen')) s.classList.toggle('on', s.id === id); }
function barColor(r) {
  const h = Math.round(140 * r);   // 140(緑) → 0(赤)
  return `linear-gradient(90deg, hsl(${h},100%,55%), hsl(${Math.min(140, h + 30)},100%,70%))`;
}

/* =====================================================================
   出題（難易度が徐々に上がるよう 10 問を抽出、選択肢シャッフル）
   ===================================================================== */
function buildQuiz(cat) {
  const all = QUIZ_DATA.STATIC.concat(QUIZ_DATA.genMath()).map(r => ({ c: r[0], d: r[1], q: r[2], opts: r.slice(3, 7) }));
  const pool = all.filter(q => cat === 'mix' || q.c === cat);
  const byD = { 1: [], 2: [], 3: [] };
  for (const q of pool) if (byD[q.d]) byD[q.d].push(q);
  for (const k in byD) shuffle(byD[k]);
  const used = new Set();
  let recentList = [];
  try { recentList = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch (e) { recentList = []; }
  const recent = new Set(recentList);
  const catCount = {};
  let lastCat = null;
  const out = [];
  for (const d of DIFF_PLAN.slice(0, Q_COUNT)) {
    let pick = null;
    for (const dd of [d, d + 1, d - 1, d + 2, d - 2]) {
      if (!byD[dd]) continue;
      let cand = byD[dd].filter(q => !used.has(q.q));
      if (!cand.length) continue;
      // 直前のプレイで出た問題は後回し。ミックスはカテゴリが偏らないよう、出題回数が少なく直前と違うカテゴリを優先
      const w = q => (recent.has(q.q) ? 10 : 0) + (cat === 'mix' ? (catCount[q.c] || 0) + (q.c === lastCat ? 1 : 0) : 0);
      cand = cand.slice().sort((a, b) => w(a) - w(b));
      pick = cand[0];
      break;
    }
    if (!pick) break;
    used.add(pick.q);
    catCount[pick.c] = (catCount[pick.c] || 0) + 1;
    lastCat = pick.c;
    out.push(pick);
  }
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(recentList.concat(out.map(q => q.q)).slice(-RECENT_MAX))); } catch (e) { /* 保存できなくても遊べる */ }
  return out.map(q => {
    const order = shuffle([0, 1, 2, 3]);
    return { c: q.c, d: q.d, q: q.q, opts: order.map(i => q.opts[i]), ans: order.indexOf(0) };
  });
}

/* =====================================================================
   背景（回るスポットライト・きらめき・紙吹雪）
   ===================================================================== */
const bg = { cv: $('bg'), ctx: null, w: 1, h: 1, t: 0, boost: 0, red: 0, beams: [], sparks: [], confetti: [] };
function newSpark(init) {
  return { x: Math.random(), y: init ? Math.random() * bg.h : bg.h + 10, vy: 12 + Math.random() * 30, r: 0.8 + Math.random() * 1.8, ph: Math.random() * 6.28, tw: 2 + Math.random() * 4 };
}
function resizeBg() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  bg.w = window.innerWidth; bg.h = window.innerHeight;
  bg.cv.width = Math.floor(bg.w * dpr); bg.cv.height = Math.floor(bg.h * dpr);
  bg.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function initBg() {
  bg.ctx = bg.cv.getContext('2d');
  const hues = [45, 320, 200, 50, 280, 170, 10];
  for (let i = 0; i < 7; i++) bg.beams.push({ x: (i + 0.5) / 7, hue: hues[i], ph: Math.random() * 6.28, sp: 0.25 + Math.random() * 0.35, amp: 0.45 + Math.random() * 0.4, w: 0.09 + Math.random() * 0.08 });
  resizeBg();
  for (let i = 0; i < 80; i++) bg.sparks.push(newSpark(true));
  window.addEventListener('resize', resizeBg);
}
function drawBg(dt) {
  const ctx = bg.ctx, w = bg.w, h = bg.h;
  bg.t += dt;
  bg.boost = Math.max(0, bg.boost - dt * 1.2);
  bg.red = Math.max(0, bg.red - dt * 2.2);

  const base = ctx.createRadialGradient(w / 2, h * 0.95, 10, w / 2, h * 0.5, Math.max(w, h) * 0.9);
  base.addColorStop(0, '#22135e'); base.addColorStop(0.45, '#0d0a34'); base.addColorStop(1, '#04030f');
  ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);

  // ステージ床の光
  const floor = ctx.createRadialGradient(w / 2, h, 0, w / 2, h, w * 0.6);
  floor.addColorStop(0, 'rgba(255,211,110,.22)'); floor.addColorStop(1, 'rgba(255,211,110,0)');
  ctx.fillStyle = floor; ctx.fillRect(0, h * 0.5, w, h * 0.5);

  ctx.globalCompositeOperation = 'lighter';
  // スポットライト
  const len = Math.hypot(w, h) * 1.15;
  for (const b of bg.beams) {
    const ang = -Math.PI / 2 + Math.sin(bg.t * b.sp + b.ph) * b.amp;
    const ox = b.x * w, oy = h + 30;
    const ex = ox + Math.cos(ang) * len, ey = oy + Math.sin(ang) * len;
    const half = b.w * len * 0.5;
    const px = -Math.sin(ang) * half, py = Math.cos(ang) * half;
    const lg = ctx.createLinearGradient(ox, oy, ex, ey);
    const a = 0.2 + bg.boost * 0.3;
    lg.addColorStop(0, `hsla(${b.hue},100%,72%,${a})`);
    lg.addColorStop(0.6, `hsla(${b.hue},100%,65%,${a * 0.35})`);
    lg.addColorStop(1, `hsla(${b.hue},100%,60%,0)`);
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex + px, ey + py); ctx.lineTo(ex - px, ey - py); ctx.closePath(); ctx.fill();
  }
  // きらめき
  for (const s of bg.sparks) {
    s.y -= s.vy * dt; s.ph += dt * s.tw;
    if (s.y < -10) Object.assign(s, newSpark(false));
    const al = 0.2 + 0.8 * (0.5 + 0.5 * Math.sin(s.ph));
    ctx.fillStyle = `rgba(255,240,200,${(al * 0.85).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(s.x * w, s.y, s.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  updateConfetti(dt);

  if (bg.red > 0) { ctx.fillStyle = `rgba(255,30,60,${(bg.red * 0.28).toFixed(3)})`; ctx.fillRect(0, 0, w, h); }
  const v = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.78);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, w, h);
}
const CONF_COLORS = ['#ffd36e', '#fff', '#ff4d8d', '#4dffb8', '#8ed6ff', '#ff9a3d', '#c2a8ff'];
function spawnConfetti(x, y, n, spread) {
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * (spread || 2.2);
    const sp = 250 + Math.random() * 520;
    bg.confetti.push({
      x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 150,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 14,
      w: 6 + Math.random() * 8, h: 4 + Math.random() * 6,
      color: CONF_COLORS[Math.floor(Math.random() * CONF_COLORS.length)],
      life: 1.4 + Math.random() * 1.2, age: 0,
    });
  }
  if (bg.confetti.length > 600) bg.confetti.splice(0, bg.confetti.length - 600);
}
function updateConfetti(dt) {
  const ctx = bg.ctx;
  for (let i = bg.confetti.length - 1; i >= 0; i--) {
    const p = bg.confetti[i];
    p.age += dt;
    if (p.age >= p.life || p.y > bg.h + 40) { bg.confetti.splice(i, 1); continue; }
    p.vy += 900 * dt; p.vx *= (1 - 1.6 * dt); p.vy *= (1 - 0.8 * dt);
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.min(1, (p.life - p.age) * 1.5);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * (0.4 + 0.6 * Math.abs(Math.sin(p.rot * 2))));
    ctx.restore();
  }
}
function burstFromElement(node, n) {
  const r = node.getBoundingClientRect();
  spawnConfetti(r.left + r.width / 2, r.top + r.height / 2, n, 2.6);
}
function flashScreen(color) { el.flash.style.background = color; retrigger(el.flash, 'go'); }
function shakeScreen() { retrigger(el.app, 'shake'); }

/* =====================================================================
   簡易 BGM（プレイ中のみ。FES.tone で 16 ステップ）
   ===================================================================== */
const BGM_BASS = [110, 0, 110, 0, 131, 0, 110, 0, 147, 0, 110, 0, 165, 0, 147, 0];
const BGM_ARP = [0, 440, 0, 523, 0, 659, 0, 523, 0, 440, 0, 587, 0, 698, 0, 587];
function bgmStep(dt) {
  S.bgmAcc += dt;
  const stepLen = S.bgmFast ? 0.21 : 0.25;
  while (S.bgmAcc >= stepLen) {
    S.bgmAcc -= stepLen;
    const i = S.bgmStep % 16; S.bgmStep++;
    if (BGM_BASS[i]) FES.tone({ freq: BGM_BASS[i], dur: 0.2, type: 'triangle', vol: 0.07 });
    if (BGM_ARP[i]) FES.tone({ freq: BGM_ARP[i], dur: 0.08, type: 'sine', vol: 0.03 });
    if (i % 4 === 0) FES.tone({ freq: 95, slide: -60, dur: 0.1, type: 'sine', vol: 0.09 });               // キック
    if (i % 2 === 1) FES.noise({ dur: 0.03, freq: 7000, vol: 0.02, filter: 'highpass' });                // ハット
    if (i === 0 && Math.floor(S.bgmStep / 16) % 4 === 0) for (const f of [330, 415, 494]) FES.tone({ freq: f, dur: 0.35, type: 'square', vol: 0.018 });   // 4 小節に 1 回コード
    if (S.freezeT > 0 && i % 4 === 2) FES.tone({ freq: 1760, dur: 0.06, type: 'sine', vol: 0.04 });     // FREEZE 中のきらめき
  }
}
function tickSound(ratio) {
  FES.tone({ freq: 1100 + (1 - ratio) * 900, dur: 0.035, type: 'square', vol: 0.09 });
  if (ratio < 0.3) FES.tone({ freq: 440, dur: 0.04, type: 'triangle', vol: 0.07 });
}

/* =====================================================================

function renderCats() {

function selectCat(key) {

}
function cycleCat(dir) {

function goTitle() {

/* =====================================================================
   ゲーム開始 / カウントダウン
   ===================================================================== */
function startGame(cat) {
  FES.howto(['1〜4 キー / タップ で答える', '⏱ 早く答えるほど高得点・連続正解でボーナス', '🛟 ライフライン 50:50 と FREEZE は各 1 回（使った問題は得点半分）']);
  FES.hideResult(); FES.pause(false);
  clearTasks();
  bg.confetti.length = 0;
  Object.assign(S, {
    cat, questions: buildQuiz(cat), idx: 0,
    score: 0, disp: 0, combo: 0, maxCombo: 0, correct: 0, times: [],
    timeLeft: Q_TIME, timerOn: false, answered: false, tickAcc: 0,
    results: [], fastest: Infinity,
    lifeHalf: true, lifeFreeze: true, freezeT: 0, lifeUsedQ: false, lifeUsed: 0,
    paused: false, bgm: false, bgmAcc: 0, bgmStep: 0, bgmFast: false,
  });
  el.lifeHalf.classList.remove('used'); el.lifeFreeze.classList.remove('used'); el.tbar.classList.remove('frozen');
  el.app.classList.remove('shake');
  el.opts.innerHTML = ''; el.opts.classList.remove('out');
  el.qcard.className = ''; el.fb.className = ''; el.fb.innerHTML = '';
  el.last.classList.remove('show');
  el.hudCombo.classList.remove('show'); el.hudQ.classList.remove('last');
  updateHud();
  if (S.questions.length < 4) { FES.toast('問題が足りません'); goTitle(); return; }
  S.screen = 'count';
  el.cdcat.textContent = CATS[cat].icon + ' ' + CATS[cat].name;
  showScreen('count');
  FES.sfx('start');
  ['3', '2', '1', 'GO!'].forEach((s, i) => later(() => {
    el.cdnum.textContent = s;
    retrigger(el.cdnum, 'anim');
    FES.sfx(s === 'GO!' ? 'go' : 'countdown');
  }, 0.4 + i * 0.75));
  later(() => {
    S.screen = 'play'; S.bgm = true;
    showScreen('play');
    showQuestion();
  }, 0.4 + 3 * 0.75 + 0.7);
}

/* =====================================================================
   出題 / 回答
   ===================================================================== */
function updateHud() {
  const n = S.questions.length || Q_COUNT;
  const isLast = S.questions.length && S.idx === n - 1;
  el.hudQ.textContent = 'Q' + Math.min(S.idx + 1, n) + '/' + n + (isLast ? '  ×2' : '');
  el.hudQ.classList.toggle('last', !!isLast);
  el.hudScore.innerHTML = '<small>SCORE</small>' + fmt(S.disp);
  el.hudCombo.textContent = S.combo + ' COMBO';
  el.hudCombo.classList.toggle('show', S.combo >= 2);
  // 10 問の進み具合（金＝正解・赤＝まちがい・白＝いま）
  if (el.dots.children.length !== n) { el.dots.innerHTML = ''; for (let i = 0; i < n; i++) { const d = document.createElement('span'); d.className = 'dot'; el.dots.appendChild(d); } }
  for (let i = 0; i < n; i++) {
    const d = el.dots.children[i];
    d.className = 'dot' + (i < S.results.length ? (S.results[i] ? ' ok' : ' ng') : (i === S.idx && S.screen === 'play' ? ' cur' : ''));
  }
}
function updateScoreText() { el.hudScore.innerHTML = '<small>SCORE</small>' + fmt(S.disp); }

function showQuestion() {
  const q = S.questions[S.idx];
  S.answered = false; S.timerOn = false; S.timeLeft = Q_TIME; S.tickAcc = 0.5;
  S.freezeT = 0; S.lifeUsedQ = false; S.bgmFast = S.idx === S.questions.length - 1;
  el.tbar.classList.remove('frozen');
  updateHud();
  el.qcat.textContent = CATS[q.c].icon + ' ' + CATS[q.c].name;
  el.qcat.style.color = CATS[q.c].color;
  el.qcard.style.borderColor = CATS[q.c].color;
  el.qdiff.textContent = '★'.repeat(q.d) + '☆'.repeat(3 - q.d);
  el.qtext.textContent = q.q;
  el.fb.className = ''; el.fb.innerHTML = '';
  el.tfill.style.width = '100%'; el.tfill.style.background = barColor(1);
  el.tnum.textContent = Q_TIME.toFixed(1); el.tnum.classList.remove('hurry');

  el.opts.classList.remove('out');
  el.opts.innerHTML = '';
  q.opts.forEach((txt, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt pop';
    b.style.animationDelay = (0.18 + i * 0.09) + 's';
    b.innerHTML = '<span class="num"></span><span class="txt"></span><span class="key"></span>';
    b.querySelector('.num').textContent = String(i + 1);
    b.querySelector('.txt').textContent = txt;
    b.querySelector('.key').textContent = 'KEY ' + (i + 1) + ' / ' + 'ABCD'[i];
    b.addEventListener('animationend', () => { if (b.classList.contains('pop')) { b.classList.remove('pop'); b.classList.add('live'); } });
    b.addEventListener('pointerdown', e => { e.preventDefault(); answer(i); });
    b.addEventListener('click', e => { e.preventDefault(); answer(i); });   // pointer 非対応環境の保険
    el.opts.appendChild(b);
  });
  el.qcard.classList.remove('out');
  retrigger(el.qcard, 'in');
  FES.tone({ freq: 520, slide: 1040, dur: 0.18, type: 'triangle', vol: 0.12 });
  [0, 1, 2, 3].forEach(i => later(() => FES.tone({ freq: 700 + i * 120, dur: 0.05, type: 'square', vol: 0.08 }), 0.18 + i * 0.09));
  later(() => {
    for (const b of el.opts.children) { b.classList.remove('pop'); b.classList.add('live'); }
    S.timerOn = true;
  }, 0.72);
}

function answer(i) {
  if (S.screen !== 'play' || S.paused || !S.timerOn || S.answered) return;
  const q = S.questions[S.idx];
  const isLast = S.idx === S.questions.length - 1;
  S.answered = true; S.timerOn = false;
  const elapsed = FES.clamp(Q_TIME - S.timeLeft, 0, Q_TIME);
  S.times.push(elapsed);
  const btns = [...el.opts.children];
  if (btns[i] && btns[i].classList.contains('cut')) { S.answered = false; S.timerOn = true; return; }   // 50:50 で消した選択肢
  for (const b of btns) b.classList.remove('live', 'pop');
  S.freezeT = 0; el.tbar.classList.remove('frozen');
  S.results.push(i === q.ans);

  if (i === q.ans) {
    S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo); S.correct++;
    if (elapsed < S.fastest) S.fastest = elapsed;
    if (S.combo === 5) FES.fever(true);
    const base = PT_BASE + Math.round(Math.max(0, S.timeLeft) * PT_SEC);
    const bonus = S.combo >= 2 ? Math.min(COMBO_MAX, (S.combo - 1) * COMBO_STEP) : 0;
    const mult = isLast ? 2 : 1;
    const half = S.lifeUsedQ ? 0.5 : 1;
    const gain = Math.round((base + bonus) * mult * half);
    S.score += gain;
    btns.forEach((b, k) => b.classList.add(k === i ? 'correct' : 'dim'));
    showFeedback(true, { gain, bonus, mult, half, tier: S.timeLeft > 8 ? 2 : S.timeLeft > 6 ? 1 : 0 });
    FES.sfx('correct');
    FES.tone({ freq: 880 * Math.pow(1.0595, Math.min(12, S.combo)), dur: 0.14, type: 'triangle', vol: 0.1 });   // コンボで音が高くなる
    if (S.timeLeft > 6) later(() => FES.sfx('perfect'), 0.12);
    if (S.combo >= 2) later(() => FES.sfx('combo'), 0.3);
    if (S.combo >= 5) later(() => FES.sfx('powerup'), 0.45);
    burstFromElement(btns[i], isLast ? 180 : 70 + Math.min(80, S.combo * 12));
    flashScreen('rgba(255,215,90,.5)');
    bg.boost = 1;
    ptsPopup(btns[i], '+' + fmt(gain));
    updateHud();
    if (S.combo >= 2) retrigger(el.hudCombo, 'bump');
  } else {
    S.combo = 0; FES.fever(false);
    btns.forEach((b, k) => b.classList.add(k === i ? 'wrong' : k === q.ans ? 'reveal' : 'dim'));
    showFeedback(false, { q, timeout: false });
    FES.sfx('wrong');
    flashScreen('rgba(255,60,60,.4)');
    shakeScreen();
    bg.red = 1;
    updateHud();
  }
  later(nextQuestion, isLast ? 2.0 : 1.5);
}

function timeUp() {
  if (S.answered) return;
  const q = S.questions[S.idx];
  const isLast = S.idx === S.questions.length - 1;
  S.answered = true; S.timerOn = false; S.combo = 0; FES.fever(false);
  S.times.push(Q_TIME); S.results.push(false);
  S.freezeT = 0; el.tbar.classList.remove('frozen');
  const btns = [...el.opts.children];
  btns.forEach((b, k) => { b.classList.remove('live', 'pop'); b.classList.add(k === q.ans ? 'reveal' : 'dim'); });
  showFeedback(false, { q, timeout: true });
  FES.sfx('wrong');
  flashScreen('rgba(255,60,60,.35)');
  shakeScreen();
  bg.red = 1;
  updateHud();
  later(nextQuestion, isLast ? 2.0 : 1.6);
}

function showFeedback(ok, info) {
  el.fb.innerHTML = '';
  const big = document.createElement('div'); big.className = 'big';
  const sub = document.createElement('div'); sub.className = 'sub';
  if (ok) {
    big.textContent = info.tier === 2 ? '電光石火！ 正解！' : info.tier === 1 ? '速い！ 正解！' : '正解！';
    sub.textContent = '+' + fmt(info.gain) + ' pt';
    if (info.bonus) { const s = document.createElement('span'); s.className = 'bonus'; s.textContent = S.combo + ' COMBO +' + info.bonus; sub.appendChild(s); }
    if (info.mult > 1) { const s = document.createElement('span'); s.className = 'mult'; s.textContent = '×' + info.mult; sub.appendChild(s); }
    if (info.half < 1) { const s = document.createElement('span'); s.className = 'mult'; s.style.color = '#8ed6ff'; s.textContent = 'ライフライン ×½'; sub.appendChild(s); }
  } else {
    big.textContent = info.timeout ? '時間切れ！' : 'ざんねん！';
    sub.textContent = '正解は ' + CIRCLED[info.q.ans] + ' ' + info.q.opts[info.q.ans];
  }
  el.fb.appendChild(big); el.fb.appendChild(sub);
  el.fb.className = 'show ' + (ok ? 'ok' : 'ng');
}
/* ---------- ライフライン（各 1 回。使った問題は得点半分） ---------- */
function canLife() { return S.screen === 'play' && S.timerOn && !S.answered && !S.paused; }
function useHalf() {
  if (!canLife() || !S.lifeHalf) return;
  const q = S.questions[S.idx];
  S.lifeHalf = false; S.lifeUsedQ = true; S.lifeUsed++;
  const wrong = shuffle([0, 1, 2, 3].filter(k => k !== q.ans)).slice(0, 2);
  const btns = [...el.opts.children];
  for (const k of wrong) { btns[k].classList.remove('live', 'pop'); btns[k].classList.add('cut'); }
  el.lifeHalf.classList.add('used'); retrigger(el.lifeHalf, 'flash');
  FES.sfx('powerup'); FES.noise({ dur: 0.18, freq: 3000, slide: -1500, vol: 0.15 });
  flashScreen('rgba(142,214,255,.35)');
}
function useFreeze() {
  if (!canLife() || !S.lifeFreeze) return;
  S.lifeFreeze = false; S.lifeUsedQ = true; S.lifeUsed++; S.freezeT = 5;
  el.tbar.classList.add('frozen');
  el.lifeFreeze.classList.add('used'); retrigger(el.lifeFreeze, 'flash');
  FES.sfx('powerup'); FES.tone({ freq: 1400, slide: 2800, dur: 0.4, type: 'sine', vol: 0.1 });
  flashScreen('rgba(142,214,255,.35)');
  bg.boost = 0.8;
}
function ptsPopup(node, text) {
  const p = document.createElement('div'); p.className = 'pts'; p.textContent = text;
  node.appendChild(p);
  p.addEventListener('animationend', () => p.remove());
}

function nextQuestion() {
  if (S.screen !== 'play') return;
  el.qcard.classList.remove('in'); el.qcard.classList.add('out');
  el.opts.classList.add('out');
  S.idx++;
  if (S.idx >= S.questions.length) { later(finish, 0.35); return; }
  if (S.idx === S.questions.length - 1) {
    later(showLastBanner, 0.3);
    later(showQuestion, 1.9);
  } else {
    later(showQuestion, 0.32);
  }
}
function showLastBanner() {
  retrigger(el.last, 'show');
  updateHud();
  FES.sfx('powerup');
  [0, 1, 2].forEach(i => later(() => FES.noise({ dur: 0.12, freq: 2500, slide: 300, vol: 0.12 }), 0.05 + i * 0.12));
  later(() => FES.tone({ freq: 220, slide: 880, dur: 0.6, type: 'sawtooth', vol: 0.12 }), 0.4);
  bg.boost = 1.6;
  spawnConfetti(bg.w * 0.5, bg.h * 0.5, 60, 6.28);
  later(() => el.last.classList.remove('show'), 1.65);
}

/* =====================================================================
   終了
   ===================================================================== */
function rankTitle(correct, n) {
  if (correct >= n) return 'クイズ王';
  if (correct >= Math.ceil(n * 0.8)) return '博士';
  if (correct >= Math.ceil(n * 0.5)) return '秀才';
  return 'がんばろう';
}
function finish() {
  S.screen = 'result'; S.bgm = false; S.timerOn = false; S.disp = S.score; updateScoreText();
  const n = S.questions.length;
  const avg = S.times.length ? S.times.reduce((a, b) => a + b, 0) / S.times.length : 0;
  const t = rankTitle(S.correct, n);
  if (S.correct >= n) { spawnConfetti(bg.w * 0.3, bg.h * 0.4, 150, 6.28); spawnConfetti(bg.w * 0.7, bg.h * 0.4, 150, 6.28); bg.boost = 2; }
  FES.showResult({
    score: S.score, scoreLabel: 'pt',
    title: S.correct >= n ? 'PERFECT!!' : 'RESULT',
    subtitle: CATS[S.cat].name,
    rank: { S: 12000, A: 9000, B: 6000, C: 3000 }, titles: { S: t, A: t, B: t, C: t, D: t },
    stats: [
      { label: '正解数', value: S.correct + '/' + n },
      { label: 'MAX COMBO', value: S.maxCombo },
      { label: '平均回答時間', value: avg.toFixed(2) + '秒' },
      { label: '最速正解', value: S.fastest === Infinity ? '-' : S.fastest.toFixed(2) + '秒' },
      { label: 'ライフライン', value: S.lifeUsed + '/2' },
    ],
    retryLabel: 'もう一度',
  }, () => startGame(S.cat));
}

/* =====================================================================
   ポーズ
   ===================================================================== */
function togglePause(force) {
  if (S.screen !== 'play' && S.screen !== 'count') return;
  const next = force == null ? !S.paused : !!force;
  if (next === S.paused) return;
  S.paused = next;
  if (S.paused) FES.pause(true, { onResume: () => togglePause(false), onRetry: () => { FES.pause(false); S.paused = false; startGame(S.cat); } });
  else FES.pause(false);
  FES.sfx('select');
}

/* =====================================================================
   メインループ
   ===================================================================== */
function update(dt) {
  runTasks(dt);
  if (S.screen === 'play' && S.timerOn && !S.answered) {
    if (S.freezeT > 0) {
      S.freezeT -= dt;
      el.tnum.textContent = '❄' + Math.max(0, S.timeLeft).toFixed(1);
      if (S.freezeT <= 0) { S.freezeT = 0; el.tbar.classList.remove('frozen'); FES.sfx('tick'); }
    } else {
      S.timeLeft -= dt;
      const r = Math.max(0, S.timeLeft / Q_TIME);
      el.tfill.style.width = (r * 100) + '%';
      el.tfill.style.background = barColor(r);
      el.tnum.textContent = Math.max(0, S.timeLeft).toFixed(1);
      el.tnum.classList.toggle('hurry', r < 0.3);
      S.tickAcc -= dt;
      if (S.tickAcc <= 0) { tickSound(r); S.tickAcc = 0.13 + 0.85 * Math.pow(r, 1.6); }
      if (S.timeLeft <= 0) { S.timeLeft = 0; el.tfill.style.width = '0%'; timeUp(); }
    }
  }
  if (S.disp !== S.score) {
    const diff = S.score - S.disp;
    S.disp = Math.abs(diff) < 1 ? S.score : S.disp + diff * Math.min(1, dt * 9);
    updateScoreText();
  }
  if (S.bgm) bgmStep(dt);
}
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0;
  dt = Math.min(dt, 0.05);
  if (!S.paused) { try { update(dt); } catch (e) { console.error(e); } }
  try { drawBg(dt); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}

/* =====================================================================
   入力
   ===================================================================== */
document.addEventListener('keydown', e => {
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'Escape' || e.code === 'KeyP') { togglePause(); return; }
  if (S.screen === 'title') {
    if (e.code === 'Enter' || e.code === 'Space') startGame(S.cat);
    else if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') cycleCat(-1);
    else if (e.code === 'ArrowRight' || e.code === 'ArrowDown') cycleCat(1);
    return;
  }
  if (S.paused) { if (e.code === 'Enter' || e.code === 'Space') togglePause(false); return; }
  if (S.screen === 'play') {
    if (e.code === 'KeyF') { useHalf(); return; }
    if (e.code === 'KeyT') { useFreeze(); return; }
    const k = KEYMAP[e.code];
    if (k != null) answer(k);
  }
});
el.lifeHalf.addEventListener('pointerdown', e => { e.preventDefault(); useHalf(); });
el.lifeFreeze.addEventListener('pointerdown', e => { e.preventDefault(); useFreeze(); });
el.start.addEventListener('click', () => { if (S.screen === 'title') startGame(S.cat); });
el.pbtn.addEventListener('click', () => togglePause());
document.addEventListener('visibilitychange', () => { if (document.hidden) togglePause(true); });
window.addEventListener('blur', () => { if (S.screen === 'play' && S.timerOn) togglePause(true); });

/* =====================================================================
   起動
   ===================================================================== */
initBg();
renderCats();
goTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
