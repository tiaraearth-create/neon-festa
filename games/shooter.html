<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ギャラクシーブラスター</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: #07071a; overflow: hidden; font-family: "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; }
  #game { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; display: block; }
</style>
<script src="../common.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
/* =====================================================================
   ギャラクシーブラスター — 縦スクロールシューティング
   ===================================================================== */
FES.init({ id: 'shooter', title: 'ギャラクシーブラスター', ranking: true, portraitOk: true });   // プレイ画面が縦長なので、スマホは縦向きのままでよい（横向きの案内を出さない）

const W = 540, H = 960;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const { clamp, lerp, rand, randInt, pick } = FES;
// 画面いっぱいに描く。プレイ画面（540×960）は中央に置き、横長モニターで左右に余る場所はサイドパネル（スコア・ライフ・操作説明）に使う。
const view = { scale: 1, offsetX: 0, offsetY: 0, vw: 0, vh: 0, dpr: 1, wide: false, sideStars: [],
  toGame(cx, cy) { return { x: (cx - view.offsetX) / view.scale, y: (cy - view.offsetY) / view.scale }; } };
function fit() {
  const vw = innerWidth, vh = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  view.vw = vw; view.vh = vh; view.dpr = dpr;
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px'; canvas.style.position = 'absolute'; canvas.style.left = '0'; canvas.style.top = '0';
  const s = Math.min(vw / W, vh / H);
  view.scale = s; view.offsetX = (vw - W * s) / 2; view.offsetY = (vh - H * s) / 2;
  view.wide = view.offsetX >= 170;   // 左右に 170px 以上あればサイドパネルを出す
  view.sideStars = [];
  for (let i = 0; i < 120; i++) view.sideStars.push({ x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + 0.4, v: Math.random() * 0.03 + 0.01, ph: Math.random() * Math.PI * 2 });
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 50)); fit();
const TAU = Math.PI * 2;
const FONT = '"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif';

const WAVE_DUR = 20;             // 1 WAVE の秒数
const FINAL_WAVE = 9;
const BOSS_WAVES = [3, 6, 9];
const BOSS_DEFS = [
  { name: 'クリムゾン・ハウンド',   hp: 1400, color: '#ff4d6d', color2: '#ffb347', bonus: 5000,  scale: 1.0 },
  { name: 'ヴォイド・サーペント',   hp: 2500, color: '#b06bff', color2: '#5cd4ff', bonus: 10000, scale: 1.12 },
  { name: 'オメガ・ドレッドノート', hp: 4000, color: '#ffd166', color2: '#ff5c8a', bonus: 20000, scale: 1.25 },
];
const BOMB_BTN = { x: W - 66, y: H - 126, r: 46 };
const PAUSE_BTN = { x: 46, y: H - 126, r: 26 };

/* ------------------------------------------------------------ 状態 */
let S = null;
function makePlayer() {
  return { x: W / 2, y: H + 80, r: 5, power: 1, bombs: 3, lives: 3, inv: 0, shotT: 0, bombCd: 0,
    tilt: 0, px: W / 2, py: H + 80, trail: [], laserT: 0 };
}
function newState() {
  return {
    phase: 'title', t: 0, paused: false,
    score: 0, dispScore: 0, wave: 1, waveT: 0, spawnT: 1.2, spawnQueue: [],
    enemies: [], bullets: [], shots: [], items: [], parts: [], popups: [], rings: [],
    player: makePlayer(),
    kills: 0, combo: 0, comboT: 0, maxCombo: 0, comboPop: 0, graze: 0, pity: 0,
    shake: 0, flash: { a: 0, c: '#fff' }, hitstop: 0, timeScale: 1,
    boss: null, bossIdx: 0, warning: 0, warnBeep: 0,
    countT: 0, announce: null, over: false, overT: 0, resultShown: false,
    cleared: false, clearT: 0, bombWave: null, bombPress: 0, warp: 0, uid: 1,
    bgmMode: 'normal',
  };
}

/* ------------------------------------------------------------ 入力 */
const keys = Object.create(null);
const input = { mouseMoved: false, mx: W / 2, my: H - 160, touchId: null, lx: 0, ly: 0, dx: 0, dy: 0 };

function isKey(...codes) { for (const c of codes) if (keys[c]) return true; return false; }

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'ShiftLeft', 'ShiftRight', 'KeyZ'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'Escape' || e.code === 'KeyP') { togglePause(); return; }
  if (S.phase === 'title' && (e.code === 'Enter' || e.code === 'Space')) { startGame(); return; }
  if (S.phase === 'play' && !S.paused && (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyZ' || e.code === 'Space')) useBomb();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function inCircle(g, c) { const dx = g.x - c.x, dy = g.y - c.y; return dx * dx + dy * dy <= c.r * c.r; }

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const g = view.toGame(e.clientX, e.clientY);
  if (S.phase === 'title') { startGame(); return; }
  if (S.phase !== 'play') return;
  if (S.paused) { togglePause(); return; }
  if (inCircle(g, BOMB_BTN)) { useBomb(); S.bombPress = 0.18; return; }
  if (inCircle(g, PAUSE_BTN)) { togglePause(); return; }
  if (e.pointerType === 'mouse') {
    input.mx = g.x; input.my = g.y; input.mouseMoved = true;
    useBomb();
  } else if (input.touchId === null) {
    input.touchId = e.pointerId; input.lx = g.x; input.ly = g.y;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }
});
canvas.addEventListener('pointermove', e => {
  const g = view.toGame(e.clientX, e.clientY);
  if (e.pointerType === 'mouse') {
    if (S.phase === 'play' && !S.paused) { input.mx = g.x; input.my = g.y; input.mouseMoved = true; }
  } else if (e.pointerId === input.touchId) {
    input.dx += g.x - input.lx; input.dy += g.y - input.ly; input.lx = g.x; input.ly = g.y;
  }
});
const endTouch = e => { if (e.pointerId === input.touchId) input.touchId = null; };
canvas.addEventListener('pointerup', endTouch);
canvas.addEventListener('pointercancel', endTouch);
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && S.phase === 'play' && !S.paused) togglePause(); });

/* ------------------------------------------------------------ BGM */
const bgm = { ac: null, timer: null, step: 0, next: 0, mode: 'normal', noiseBuf: null };
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
function bgmStart(mode) {
  bgmStop();
  const ac = FES.audioContext(); if (!ac) return;
  bgm.ac = ac; bgm.mode = mode; bgm.step = 0; bgm.next = ac.currentTime + 0.05;
  if (!bgm.noiseBuf) {
    const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.12), ac.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    bgm.noiseBuf = buf;
  }
  bgm.timer = setInterval(bgmSchedule, 30);
}
function bgmStop() { if (bgm.timer) { clearInterval(bgm.timer); bgm.timer = null; } }
function bgmSchedule() {
  const ac = bgm.ac; if (!ac) return;
  const bpm = bgm.mode === 'boss' ? 178 : 152;
  const st = 60 / bpm / 4;
  while (bgm.next < ac.currentTime + 0.12) {
    if (!FES.isMuted()) bgmStep(bgm.step, bgm.next, st);
    bgm.next += st; bgm.step = (bgm.step + 1) % 64;
  }
}
function bgmTone(t, freq, dur, type, vol, slide) {
  const ac = bgm.ac; const o = ac.createOscillator(); const g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.03);
}
function bgmNoise(t, dur, vol, hp) {
  const ac = bgm.ac; const s = ac.createBufferSource(); s.buffer = bgm.noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t); s.stop(t + dur + 0.02);
}
const ARP = [0, 1, 2, 3, 2, 1, 0, 2, 1, 3, 2, 1, 0, 1, 3, 2];
function bgmStep(step, t, st) {
  const bar = (step >> 4) & 3, s = step & 15;
  const boss = bgm.mode === 'boss';
  const roots = boss ? [50, 51, 50, 48] : [57, 53, 48, 55];
  const chords = boss ? [[0, 3, 7, 10], [0, 3, 7, 10], [0, 3, 7, 12], [0, 4, 7, 10]] : [[0, 3, 7, 12], [0, 4, 7, 12], [0, 4, 7, 12], [0, 4, 7, 12]];
  const root = roots[bar], ch = chords[bar];
  // アルペジオ
  const n = root + 12 + ch[ARP[s]] + (boss && (step & 32) ? 12 : 0);
  bgmTone(t, midi(n), st * 0.9, boss ? 'sawtooth' : 'square', boss ? 0.035 : 0.045);
  // ベース
  if (s % 4 === 0 || s === 6 || s === 14 || (boss && s === 10)) bgmTone(t, midi(root - 12), st * 1.8, 'triangle', 0.09);
  // キック
  if (s % 4 === 0 || (boss && s === 14)) bgmTone(t, 160, 0.13, 'sine', 0.3, 40);
  // スネア
  if (s === 4 || s === 12) bgmNoise(t, 0.12, 0.12, 1800);
  // ハイハット
  if (s % 2 === 1) bgmNoise(t, 0.03, boss ? 0.05 : 0.035, 7000);
  // ボス: リード
  if (boss && s % 8 === 0) bgmTone(t, midi(root + 24 + ch[(bar + (s >> 3)) % 4]), st * 3, 'square', 0.03);
}

/* ------------------------------------------------------------ 効果音（ゲーム固有） */
const SND = {
  graze: () => FES.tone({ freq: 2400, slide: 3200, dur: 0.04, type: 'sine', vol: 0.08 }),
  bomb: () => { FES.noise({ dur: 0.9, freq: 1400, slide: 60, vol: 0.5 }); FES.tone({ freq: 60, slide: 20, dur: 0.8, type: 'sine', vol: 0.5 }); FES.tone({ freq: 400, slide: 1800, dur: 0.5, type: 'sawtooth', vol: 0.12 }); },
  bigExplode: () => { FES.noise({ dur: 1.2, freq: 700, slide: 40, vol: 0.55 }); FES.tone({ freq: 70, slide: 25, dur: 1.0, type: 'sine', vol: 0.5 }); },
  warn: () => FES.tone({ freq: 560, slide: 380, dur: 0.38, type: 'sawtooth', vol: 0.11 }),
  laser: () => FES.tone({ freq: 900, slide: 1400, dur: 0.05, type: 'sawtooth', vol: 0.05 }),
  item: () => FES.sfx('coin'),
  phase: () => { FES.tone({ freq: 300, slide: 1200, dur: 0.3, type: 'square', vol: 0.18 }); FES.noise({ dur: 0.3, freq: 3000, slide: 300, vol: 0.2 }); },
  wave: () => { [660, 880, 1320].forEach((f, i) => FES.tone({ freq: f, dur: 0.12, delay: i * 0.07, type: 'square', vol: 0.15 })); },
  death: () => { FES.noise({ dur: 0.7, freq: 1000, slide: 60, vol: 0.5 }); FES.tone({ freq: 500, slide: 60, dur: 0.6, type: 'sawtooth', vol: 0.25 }); },
};

/* ------------------------------------------------------------ ユーティリティ */
function hexToRgba(hex, a) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
const sprCache = new Map();
function bulletSprite(color, r) {
  const key = color + '|' + r;
  let s = sprCache.get(key); if (s) return s;
  const size = Math.ceil(r * 5.2);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); const cx = size / 2;
  const grad = g.createRadialGradient(cx, cx, 0, cx, cx, size / 2);
  grad.addColorStop(0, '#fff'); grad.addColorStop(0.22, '#fff'); grad.addColorStop(0.4, color);
  grad.addColorStop(0.62, hexToRgba(color, 0.4)); grad.addColorStop(1, hexToRgba(color, 0));
  g.fillStyle = grad; g.fillRect(0, 0, size, size);
  s = { c, size }; sprCache.set(key, s); return s;
}
function text(str, x, y, size, color, align, weight, stroke, italic) {
  ctx.font = `${italic ? 'italic ' : ''}${weight || 900} ${size}px ${FONT}`;
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = 'rgba(0,0,20,.85)'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function dist(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }
function angleTo(ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); }
function turnToward(a, target, rate) {
  let d = target - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
  return a + clamp(d, -rate, rate);
}

/* ------------------------------------------------------------ 背景 */
const bg = { stars: [], nebulae: [], planet: null, t: 0 };
function initBg() {
  bg.stars = [];
  const layers = [[90, 0.6, 1.2, 40], [55, 1.2, 1.9, 95], [28, 2.0, 2.8, 190]];
  layers.forEach(([n, smin, smax, speed], li) => {
    for (let i = 0; i < n; i++) bg.stars.push({ x: rand(0, W), y: rand(0, H), s: rand(smin, smax), v: speed * rand(0.8, 1.25), l: li, ph: rand(0, TAU), tw: rand(1, 4) });
  });
  bg.nebulae = [
    { x: 120, y: 200, r: 260, c: '#3b1f7a', v: 12 }, { x: 430, y: 620, r: 300, c: '#14385c', v: 9 }, { x: 260, y: 1100, r: 240, c: '#5a1b4a', v: 15 },
  ];
  bg.planet = newPlanet(rand(-600, -200));
}
function newPlanet(y) {
  const cs = [['#ff9a5c', '#7a2a1a'], ['#7cc6ff', '#1b3a7a'], ['#c8a0ff', '#3f1a6b'], ['#9fffb0', '#1a5a3a']];
  const c = pick(cs);
  return { x: rand(90, W - 90), y, r: rand(80, 150), c1: c[0], c2: c[1], ring: Math.random() < 0.6, rot: rand(-0.5, 0.5), v: 22 };
}
function updateBg(dt) {
  bg.t += dt;
  const sp = 1 + S.warp * 5;
  for (const st of bg.stars) { st.y += st.v * sp * dt; if (st.y > H + 4) { st.y = -4; st.x = rand(0, W); } }
  for (const n of bg.nebulae) { n.y += n.v * sp * dt; if (n.y - n.r > H + 50) { n.y = -n.r - 50; n.x = rand(60, W - 60); } }
  const p = bg.planet; p.y += p.v * sp * dt;
  if (p.y - p.r * 1.6 > H) bg.planet = newPlanet(-rand(300, 900));
}
function drawBg() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#05061c'); grad.addColorStop(0.5, '#0a0b2e'); grad.addColorStop(1, '#0d0a24');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  for (const n of bg.nebulae) {
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    g.addColorStop(0, hexToRgba(n.c, 0.55)); g.addColorStop(0.5, hexToRgba(n.c, 0.22)); g.addColorStop(1, hexToRgba(n.c, 0));
    ctx.fillStyle = g; ctx.fillRect(n.x - n.r, n.y - n.r, n.r * 2, n.r * 2);
  }
  // 惑星
  const p = bg.planet;
  if (p.y + p.r * 1.6 > 0) {
    ctx.save(); ctx.translate(p.x, p.y);
    if (p.ring) { ctx.save(); ctx.rotate(p.rot); ctx.scale(1, 0.32); ctx.beginPath(); ctx.arc(0, 0, p.r * 1.55, Math.PI, TAU); ctx.strokeStyle = hexToRgba(p.c1, 0.35); ctx.lineWidth = p.r * 0.22; ctx.stroke(); ctx.restore(); }
    const g = ctx.createRadialGradient(-p.r * 0.35, -p.r * 0.35, p.r * 0.1, 0, 0, p.r);
    g.addColorStop(0, p.c1); g.addColorStop(0.6, p.c2); g.addColorStop(1, '#05061c');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.25; ctx.fillStyle = '#000';
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(0, -p.r * 0.5 + i * p.r * 0.45, p.r * 0.95, p.r * 0.07, 0.15, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
    if (p.ring) { ctx.save(); ctx.rotate(p.rot); ctx.scale(1, 0.32); ctx.beginPath(); ctx.arc(0, 0, p.r * 1.55, 0, Math.PI); ctx.strokeStyle = hexToRgba(p.c1, 0.45); ctx.lineWidth = p.r * 0.22; ctx.stroke(); ctx.restore(); }
    ctx.restore();
  }
  // 星
  for (const st of bg.stars) {
    const a = (0.35 + st.l * 0.25) * (0.65 + 0.35 * Math.sin(bg.t * st.tw + st.ph));
    ctx.fillStyle = st.l === 2 ? `rgba(220,240,255,${a})` : `rgba(255,255,255,${a})`;
    const len = st.s + S.warp * 40 * (st.l + 1);
    ctx.fillRect(st.x - st.s / 2, st.y - len, st.s, len + st.s);
  }
}

/* ------------------------------------------------------------ エフェクト */
function addShake(v) { S.shake = Math.min(40, S.shake + v); }
function addFlash(c, a) { S.flash.c = c; S.flash.a = Math.max(S.flash.a, a); }
function addRing(x, y, maxR, dur, color, width) { S.rings.push({ x, y, r: 0, maxR, t: 0, dur, color, width: width || 6 }); }
function popup(x, y, str, color, size, life) {
  S.popups.push({ x, y, str, color, size: size || 20, t: 0, life: life || 0.8, vy: -60 });
}
function spark(x, y, n, color, speed, life) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(speed * 0.3, speed);
    S.parts.push({ k: 0, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(life * 0.5, life), max: life, c: color, s: rand(1.5, 3.5), drag: 0.96 });
  }
}
function explode(x, y, size, color, color2) {
  const n = Math.floor(10 * size);
  spark(x, y, n, '#fff', 260 * size, 0.35);
  spark(x, y, n, color, 320 * size, 0.6);
  spark(x, y, Math.floor(n * 0.6), color2 || '#ffb347', 200 * size, 0.8);
  for (let i = 0; i < Math.floor(5 * size); i++) {
    const a = rand(0, TAU), sp = rand(60, 220) * size;
    S.parts.push({ k: 1, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.5, 1.0), max: 1.0, c: pick([color, '#555a70', '#ffd9a0']), s: rand(3, 7) * size, rot: rand(0, TAU), vr: rand(-10, 10), drag: 0.98 });
  }
  for (let i = 0; i < Math.floor(4 * size); i++) {
    const a = rand(0, TAU), sp = rand(20, 80) * size;
    S.parts.push({ k: 2, x: x + rand(-8, 8) * size, y: y + rand(-8, 8) * size, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20, life: rand(0.5, 0.9), max: 0.9, c: pick(['#ff7a3d', '#ffb347', '#6b2a1a']), s: rand(8, 18) * size, drag: 0.97 });
  }
  S.parts.push({ k: 3, x, y, life: 0.12, max: 0.12, s: 40 * size, c: '#fff' });
  addRing(x, y, 90 * size, 0.45, color, 8 * size);
  addShake(4 * size);
}
function updateFx(dt) {
  const parts = S.parts;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    if (p.k !== 3) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= p.drag; p.vy *= p.drag; }
    if (p.k === 1) p.rot += p.vr * dt;
    if (p.k === 2) p.s += 14 * dt;
  }
  const rings = S.rings;
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.t += dt; if (r.t >= r.dur) { rings.splice(i, 1); continue; } const k = r.t / r.dur; r.r = r.maxR * (1 - Math.pow(1 - k, 3)); }
  const pops = S.popups;

function drawFx() {

/* ------------------------------------------------------------ 敵・弾・アイテム生成 */

}

/* ------------------------------------------------------------ ディレクター（WAVE） */
function spawnInterval() { return clamp(2.15 - S.wave * 0.17, 0.75, 2.15); }
function queue(delay, fn) { S.spawnQueue.push({ t: delay, fn }); }
function spawnEvent() {
  const w = S.wave;

  if (w >= 2) { opts.push(['formation', 3], ['turret', 2], ['missile', 2]); }
  if (w >= 4) { opts.push(['zakoRain', 3], ['missile', 1]); }
  if (w >= 7) { opts.push(['formation', 2], ['turret', 1]); }
  let total = 0; for (const o of opts) total += o[1];
  let r = Math.random() * total, ev = opts[0][0];
  for (const o of opts) { r -= o[1]; if (r <= 0) { ev = o[0]; break; } }
  switch (ev) {
    case 'zakoLine': {
      const n = 3 + Math.min(4, w), x = rand(70, W - 70), vx = (W / 2 - x) * 0.25;
      for (let i = 0; i < n; i++) queue(i * 0.22, () => spawnZako(x, -30, vx));

    case 'zakoRain': {
      const n = 6 + Math.min(4, w);
      for (let i = 0; i < n; i++) queue(i * 0.16, () => spawnZako(rand(40, W - 40), -30, rand(-60, 60)));
      break;
    }
    case 'snake': {
      const amp = rand(90, 130), ph = rand(0, TAU);

      if (w >= 5) queue(0.6, () => spawnSnake(W * 0.5, amp * 1.2, ph + 1));
      break;
    }
    case 'formation': spawnFormation(); break;
    case 'turret': {
      spawnTurret(rand(80, W - 80));
      if (w >= 5) queue(0.8, () => spawnTurret(rand(80, W - 80)));
      break;
    }
    case 'missile': {
      const n = 2 + (w >= 5 ? 1 : 0) + (w >= 8 ? 1 : 0);
      for (let i = 0; i < n; i++) queue(i * 0.35, () => spawnMissile(i % 2 ? rand(W * 0.6, W - 30) : rand(30, W * 0.4), -30));

function announce(txt, sub, color, dur) { S.announce = { txt, sub, color: color || '#8ed6ff', t: 0, dur: dur || 1.8 }; }

  S.wave = w; S.waveT = 0; S.spawnT = 1.0; S.spawnQueue = [];
  if (BOSS_WAVES.includes(w)) {
    S.warning = 2.6; S.warnBeep = 0; S.bossIdx = BOSS_WAVES.indexOf(w);
    S.spawnT = 1e9;
  } else {
    announce('WAVE ' + w, w === 1 ? '敵機接近！' : '難易度アップ！', '#8ed6ff');
    SND.wave(); S.warp = 1.2;
  }
}
function updateDirector(dt) {
  if (S.cleared) return;
  // WARNING → ボス出現
  if (S.warning > 0) {
    S.warning -= dt; S.warnBeep -= dt;
    if (S.warnBeep <= 0) { S.warnBeep = 0.45; SND.warn(); }
    if (S.warning <= 0) { spawnBoss(S.bossIdx); bgmStart('boss'); S.bgmMode = 'boss'; addShake(10); }
    return;
  }
  if (S.boss) return;
  S.waveT += dt;
  if (S.waveT >= WAVE_DUR) { startWave(S.wave + 1); return; }
  S.spawnT -= dt;

}

  const q = S.spawnQueue;

}

/* ------------------------------------------------------------ プレイヤー */

  switch (p.power) {
    case 1: mk(0, 0, 7, 6, 22); break;
    case 2: mk(-9, 0, 6.5, 6, 22); mk(9, 0, 6.5, 6, 22); break;
    case 3: mk(-9, 0, 6, 6, 22); mk(9, 0, 6, 6, 22); mk(-18, -0.22, 5, 5, 18); mk(18, 0.22, 5, 5, 18); break;
    case 4: mk(0, 0, 6, 6, 24); mk(-14, 0, 5.5, 5, 20); mk(14, 0, 5.5, 5, 20); mk(-22, -0.3, 5, 5, 18); mk(22, 0.3, 5, 5, 18); break;
    default: mk(-17, 0, 5, 5, 20); mk(17, 0, 5, 5, 20); mk(-26, -0.32, 4.5, 5, 18); mk(26, 0.32, 4.5, 5, 18); break;
  }
  if (S.t % 0.4 < 0.06) FES.sfx('shoot');
}
function updatePlayer(dt) {
  const p = S.player;
  const ox = p.x, oy = p.y;
  // キーボード
  let kx = 0, ky = 0;
  if (isKey('ArrowLeft', 'KeyA')) kx -= 1; if (isKey('ArrowRight', 'KeyD')) kx += 1;
  if (isKey('ArrowUp', 'KeyW')) ky -= 1; if (isKey('ArrowDown', 'KeyS')) ky += 1;
  if (kx || ky) { const l = Math.hypot(kx, ky); p.x += kx / l * 440 * dt; p.y += ky / l * 440 * dt; }
  // マウス: カーソル位置に追従
  if (input.mouseMoved) { p.x = input.mx; p.y = input.my; input.mouseMoved = false; }
  // タッチ: 相対移動
  if (input.dx || input.dy) { p.x += input.dx * 1.35; p.y += input.dy * 1.35; input.dx = 0; input.dy = 0; }
  if (S.cleared) { p.y -= 500 * Math.max(0, S.clearT - 0.8) * dt; }
  else { p.x = clamp(p.x, 18, W - 18); p.y = clamp(p.y, 60, H - 70); }
  const mvx = (p.x - ox) / Math.max(dt, 1e-4);
  p.tilt = lerp(p.tilt, clamp(mvx / 500, -1, 1), 0.25);
  p.trail.push({ x: p.x, y: p.y + 20, life: 0.28, max: 0.28 });
  // ショット
  p.shotT -= dt;
  while (p.shotT <= 0) { p.shotT += p.power >= 4 ? 0.085 : 0.1; fireShot(p); }
  if (p.power >= 5) { p.laserT -= dt; if (p.laserT <= 0) { p.laserT = 0.05; S.shots.push({ x: p.x, y: p.y - 24, vx: 0, vy: -1300, dmg: 6, w: 14, h: 70, laser: true, hits: [] }); } }
  p.inv = Math.max(0, p.inv - dt); p.bombCd = Math.max(0, p.bombCd - dt);
}
function useBomb() {
  const p = S.player;
  if (S.phase !== 'play' || S.paused || S.over || S.cleared) return;
  if (p.bombs <= 0 || p.bombCd > 0) { if (p.bombs <= 0) FES.sfx('wrong'); return; }
  p.bombs--; p.bombCd = 1.2; p.inv = Math.max(p.inv, 1.6);
  S.bombWave = { x: p.x, y: p.y, t: 0 };
  SND.bomb(); addFlash('#ffffff', 0.7); addShake(22); S.hitstop = 0.08;
  addRing(p.x, p.y, 700, 0.7, '#ff4dd8', 24); addRing(p.x, p.y, 500, 0.9, '#8ed6ff', 12);
  let n = 0;
  for (const b of S.bullets) { spark(b.x, b.y, 2, '#ffd166', 120, 0.4); n++; }
  S.bullets.length = 0;
  if (n) { S.score += n * 10; popup(p.x, p.y - 60, `弾消し +${n * 10}`, '#ffd166', 22, 1.0); }
  for (const e of S.enemies) { if (e.type === 'boss' && e.invuln) continue; damageEnemy(e, e.type === 'boss' ? 180 : 200, true); }
}
function damageEnemy(e, dmg, byBomb) {

  e.hp -= dmg; e.flash = 0.07;
  if (e.hp <= 0) killEnemy(e, byBomb);
}
function killEnemy(e, byBomb) {

  else if (r < t.P + t.B) dropItem(e.x, e.y, 'B');

function comboMult() { return 1 + Math.min(S.combo, 50) * 0.04; }

function pickup(it) {

/* ------------------------------------------------------------ 敵の更新 */
function bezier(p0, p1, p2, t) {
  const u = 1 - t; return { x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x, y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y };
}
function canFire(e) { return e.y > 20 && e.y < H * 0.72 && e.x > -10 && e.x < W + 10 && !S.over && !S.cleared; }
function updateEnemies(dt) {
  const p = S.player; const es = S.enemies;
  const fr = 1 + (S.wave - 1) * 0.1; const bs = bulletSpeed();
  for (let i = es.length - 1; i >= 0; i--) {
    const e = es[i]; e.t += dt; e.flash = Math.max(0, e.flash - dt);
    switch (e.type) {
      case 'zako':
        e.x += e.vx * dt; e.y += e.vy * dt;
        e.fireT -= dt * fr;
        if (e.fireT <= 0) { e.fireT = rand(1.6, 3.0); if (canFire(e)) fireFan(e.x, e.y + 10, 1, 0, bs, '#ff4d8d', 7); }
        break;
      case 'snake':
        e.y += e.vy * dt; e.x = e.baseX + Math.sin(e.t * 2.6 + e.ph) * e.amp;
        e.fireT -= dt * fr;
        if (e.fireT <= 0) { e.fireT = rand(1.3, 2.0); if (canFire(e)) fireFan(e.x, e.y + 10, S.wave >= 4 ? 3 : 2, 0.4, bs * 0.95, '#c07cff', 7); }
        break;
      case 'missile': {
        if (e.t < 5.2 && !S.over) e.ang = turnToward(e.ang, angleTo(e.x, e.y, p.x, p.y), 2.3 * dt);
        e.x += Math.cos(e.ang) * e.spd * dt; e.y += Math.sin(e.ang) * e.spd * dt;
        e.smokeT -= dt;
        if (e.smokeT <= 0) { e.smokeT = 0.03; S.parts.push({ k: 2, x: e.x - Math.cos(e.ang) * 14, y: e.y - Math.sin(e.ang) * 14, vx: rand(-20, 20), vy: rand(-20, 20), life: 0.4, max: 0.4, c: '#ffb347', s: 5, drag: 0.95 }); }
        if (e.t > 7) { explode(e.x, e.y, 0.6, '#ffd166'); es.splice(i, 1); continue; }
        break;
      }
      case 'turret':
        if (e.y < e.ty) e.y = Math.min(e.ty, e.y + 150 * dt);
        else if (e.hold > 0) {
          e.hold -= dt;
          if (!S.over) e.aim = turnToward(e.aim, angleTo(e.x, e.y, p.x, p.y), 2.0 * dt);
          e.fireT -= dt * fr;
          if (e.fireT <= 0 && e.burst === 0) { e.fireT = 1.5; e.burst = S.wave >= 5 ? 4 : 3; e.burstT = 0; }
          if (e.burst > 0) { e.burstT -= dt; if (e.burstT <= 0) { e.burstT = 0.13; e.burst--; if (canFire(e)) { fireBullet(e.x + Math.cos(e.aim) * 30, e.y + Math.sin(e.aim) * 30, e.aim, bs * 1.15, '#ffb347', 8); } } }
        } else e.y += 130 * dt;
        e.rot += dt * 0.8;

function updateShots(dt) {

  const help = [['移動', '矢印 / WASD / マウス'], ['ボム', 'Shift / Z / クリック'], ['ポーズ', 'Esc / P'], ['ショット', '自動連射']];
  const helpTop = R.y + R.h - (help.length * 30 + 40) * u;
  if (helpTop >= y + 8 * u) {   // 上の表示（LIFE・BOMB・POWER）と重なるときは操作説明を出さない
    y = helpTop;
    text('CONTROLS', rx, y, 11 * u, 'rgba(255,255,255,.5)', 'left', 900); y += 26 * u;
    help.forEach(([k, v]) => { text(k, rx, y, 13 * u, '#8ed6ff', 'left', 900); text(v, rx + 60 * u, y, 13 * u, '#fff', 'left', 700); y += 30 * u; });
  }
}

/* ------------------------------------------------------------ ゲーム進行 */
function startGame() {
  if (S.phase !== 'title') return;
  FES.sfx('start');
  beginPlay();
}
function beginPlay() {
  FES.howto(['矢印 / マウス / タッチ で移動（自動で撃つ）', 'Shift / ボタン でボム', '💥 敵の近くで倒すと CLOSE ボーナス']);
  S = newState();
  S.phase = 'count'; S.countT = 0; S.countStep = -1;
  input.mouseMoved = false; input.dx = 0; input.dy = 0; input.touchId = null;
  canvas.style.cursor = 'none';
}
function restartGame() { bgmStop(); FES.hideResult(); FES.pause(false); beginPlay(); }
function togglePause() {
  if (S.phase !== 'play' || S.over) return;
  S.paused = !S.paused; FES.sfx('select');
  if (S.paused) {
    bgmStop();
    FES.pause(true, { onResume: () => { if (S.paused) togglePause(); }, onRetry: restartGame });
  } else { bgmStart(S.bgmMode); FES.pause(false); }
}
function finishGame() {
  if (S.resultShown) return;
  S.resultShown = true; bgmStop(); canvas.style.cursor = '';
  const p = S.player;
  let title = 'GAME OVER', subtitle = `WAVE ${S.wave} で撃墜…`;
  if (S.cleared) {
    const bonus = 30000 + p.lives * 5000 + p.bombs * 2000;
    S.score += bonus; title = 'MISSION CLEAR!'; subtitle = `全ボス撃破！ クリアボーナス +${bonus.toLocaleString()}`;
  }
  FES.showResult({
    score: S.score, scoreLabel: 'pt', title, subtitle,
    rank: { S: 60000, A: 35000, B: 15000, C: 5000 }, titles: { S: '銀河の英雄', A: 'エースパイロット', B: 'いい腕だ！' },
    stats: [{ label: 'WAVE', value: S.wave }, { label: '撃破数', value: S.kills }, { label: 'MAX COMBO', value: S.maxCombo }, { label: 'GRAZE', value: S.graze }],
  }, restartGame);
}

/* ------------------------------------------------------------ メイン更新・描画 */
function update(dtRaw) {
  S.t += dtRaw;
  if (S.phase === 'title') { updateBg(dtRaw); updateFx(dtRaw); return; }
  if (S.paused) return;
  if (S.phase === 'count') {
    updateBg(dtRaw); updateFx(dtRaw);
    S.countT += dtRaw;
    const step = Math.min(3, Math.floor(S.countT));
    if (step !== S.countStep) { S.countStep = step; if (step < 3) FES.sfx('countdown'); else FES.sfx('go'); }
    const p = S.player; p.y = lerp(p.y, H - 170, 1 - Math.pow(0.1, dtRaw)); p.x = lerp(p.x, W / 2, 1 - Math.pow(0.1, dtRaw));
    p.trail.push({ x: p.x, y: p.y + 20, life: 0.28, max: 0.28 });
    input.mx = p.x; input.my = p.y;
    if (S.countT >= 3.8) { S.phase = 'play'; bgmStart('normal'); S.bgmMode = 'normal'; startWave(1); }
    return;
  }
  // play / over
  S.hitstop = Math.max(0, S.hitstop - dtRaw);
  const ts = S.hitstop > 0 ? 0.08 : (S.boss && S.boss.dying) ? 0.4 : 1;
  S.timeScale = ts;
  const dt = dtRaw * ts;
  updateBg(dt * (S.boss ? 1.6 : 1));
  if (S.phase === 'play') { updatePlayer(dt); updateDirector(dt); updateQueue(dt); }
  updateEnemies(dt); updateBullets(dt); updateShots(dt); updateItems(dt);
  if (S.phase === 'play') collisions();
  updateFx(dt);
  S.comboT -= dt; if (S.comboT <= 0 && S.combo > 0) { S.combo = 0; FES.fever(false); }
  const diff = S.score - S.dispScore; S.dispScore += Math.abs(diff) < 1 ? diff : diff * Math.min(1, dtRaw * 8);
  if (S.over) { S.overT += dtRaw; if (S.overT > 1.7) finishGame(); }
  if (S.cleared) {
    S.clearT += dtRaw;
    if (S.clearT < 2.5 && Math.random() < dtRaw * 6) explode(rand(40, W - 40), rand(100, H - 200), rand(0.5, 1.2), pick(['#ffe66d', '#5cd4ff', '#ff4dd8', '#6bff9a']));
    if (S.clearT > 3.2) finishGame();
  }
}
function render() {
  const { dpr, scale: sc, offsetX: ox, offsetY: oy, vw, vh } = view;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (view.wide) drawSidePanels();
  else { ctx.fillStyle = '#07071a'; ctx.fillRect(0, 0, vw, vh); }
  ctx.save();
  ctx.beginPath(); ctx.rect(ox, oy, W * sc, H * sc); ctx.clip();
  ctx.translate(ox, oy); ctx.scale(sc, sc);
  ctx.save();
  if (S.shake > 0) ctx.translate(rand(-S.shake, S.shake), rand(-S.shake, S.shake));
  drawBg();
  if (S.phase === 'title') {
    drawFx(); drawTitle();
  } else {
    drawItems();
    for (const e of S.enemies) if (e.type !== 'boss') drawEnemy(e);
    if (S.boss) drawEnemy(S.boss);
    drawShots();
    drawPlayer();
    drawBullets();
    drawBombWave();
    drawFx();
    drawPopups();
  }
  ctx.restore();
  if (S.flash.a > 0) { ctx.globalAlpha = S.flash.a; ctx.fillStyle = S.flash.c; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (S.phase !== 'title') {
    drawHUD(); drawWarning(); drawAnnounce();
    if (S.phase === 'count') drawCountdown();
  }
  ctx.restore();
}

let last = performance.now();
let errLogged = false;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  try { update(dt); render(); }
  catch (err) { if (!errLogged) { errLogged = true; console.error(err); } }
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------ 起動 */
const hiScore = FES.getHiScore();
S = newState();
initBg();
requestAnimationFrame(frame);
</script>
