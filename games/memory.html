<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>メモリーフラッシュ</title>
<style>
  html, body { margin: 0; height: 100%; background: #07071a; overflow: hidden; font-family: "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; }
  #game { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="../common.js"></script>
<script>
'use strict';
/* =====================================================================
   メモリーフラッシュ — 光った順番をおぼえて、同じ順に押す。1回ごとに1つ長くなる。
   操作: パッドをクリック / タップ。キーボードは テンキー 1〜9 か QWE / ASD / ZXC。 Esc / P でポーズ。
   ===================================================================== */
FES.init({ id: 'memory', title: 'メモリーフラッシュ' });

const W = 960, H = 540;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const view = FES.fitCanvas(canvas, W, H);
const fx = FES.fx();
const FONT = '"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif';
const TAU = Math.PI * 2;

const N = 9, COLS = 3;
const PAD_COLORS = ['#ff4d8d', '#ff9f43', '#ffd36e', '#5cff8d', '#5ee7ff', '#8ea7ff', '#b06bff', '#ff6bd6', '#fff'];
const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5, 1568];   // ペンタトニック（どの順でもきれい）
const LIVES = 3, MAX_ROUND = 20, START_LEN = 3;
// パッドの配置（中央に 3×3）
const PAD = 118, GAP = 16, GX = W / 2 - (PAD * 3 + GAP * 2) / 2, GY = 118;
const padRect = i => ({ x: GX + (i % COLS) * (PAD + GAP), y: GY + Math.floor(i / COLS) * (PAD + GAP), w: PAD, h: PAD });
const KEYMAP = { Numpad7: 0, Numpad8: 1, Numpad9: 2, Numpad4: 3, Numpad5: 4, Numpad6: 5, Numpad1: 6, Numpad2: 7, Numpad3: 8, Digit7: 0, Digit8: 1, Digit9: 2, Digit4: 3, Digit5: 4, Digit6: 5, Digit1: 6, Digit2: 7, Digit3: 8,
  KeyQ: 0, KeyW: 1, KeyE: 2, KeyA: 3, KeyS: 4, KeyD: 5, KeyZ: 6, KeyX: 7, KeyC: 8 };
const KEY_LABELS = ['Q·7', 'W·8', 'E·9', 'A·4', 'S·5', 'D·6', 'Z·1', 'X·2', 'C·3'];

let G = null;
function newGame() {
  return { state: 'title', t: 0, round: 0, seq: [], pos: 0, lives: LIVES, score: 0, dispScore: 0, lit: new Array(N).fill(0), press: new Array(N).fill(0), wrong: new Array(N).fill(0),
    showIdx: -1, showT: 0, inputT: 0, msg: null, titleT: 0, countT: 0, countStep: -1, best: 0, streakFast: 0, roundStart: 0, over: false, overT: 0, cleared: false };
}
G = newGame();
const stepDur = () => Math.max(0.28, 0.6 - G.round * 0.018);   // 見せる速さ（ラウンドが進むと速く）

function startGame() {
  FES.howto(['👀 光った順番を おぼえる', '👆 同じ順番に パッドをタップ', '🧠 1回ごとに 1つ長くなる']);
  FES.hideResult(); FES.pause(false); FES.fever(false); fx.clear();
  G = newGame();
  G.state = 'count'; G.countT = 0; G.countStep = -1;
}
function beginPlay() { G.round = 0; G.seq = []; nextRound(); }
function nextRound() {
  G.round++;
  if (G.round > MAX_ROUND) { finish(true); return; }
  // 1 つ足す（最初は START_LEN 個）。同じパッドが3回続かないように
  while (G.seq.length < START_LEN + G.round - 1) {
    let p = (Math.random() * N) | 0; const L = G.seq.length;
    if (L >= 2 && G.seq[L - 1] === p && G.seq[L - 2] === p) p = (p + 1 + ((Math.random() * (N - 1)) | 0)) % N;
    G.seq.push(p);
  }
  G.pos = 0; G.state = 'show'; G.showIdx = -1; G.showT = -0.6;   // 少し間を置いてから見せる
  G.msg = { text: `ROUND ${G.round}`, sub: G.round === 1 ? 'よく見てね' : `${G.seq.length} 個`, t: 1.1 };
  if (G.round === 1) FES.sfx('start'); else FES.sfx('select');
  if (G.round === 10) FES.fever(true, 'BRAIN FEVER!');
}
function light(i, strong) {
  G.lit[i] = 1;
  const r = padRect(i);
  FES.tone({ freq: NOTES[i], dur: strong ? 0.22 : 0.18, type: 'triangle', vol: 0.22 });
  FES.tone({ freq: NOTES[i] * 2, dur: 0.1, type: 'sine', vol: 0.06 });
  if (strong) fx.ring(r.x + r.w / 2, r.y + r.h / 2, { color: PAD_COLORS[i], r: 30, r1: 110, life: 0.4 });
}
function pressPad(i) {
  if (G.state !== 'input') return;
  G.press[i] = 1; light(i, true); FES.vibrate(10);
  const want = G.seq[G.pos];
  const r = padRect(i);
  if (i === want) {
    G.pos++;
    const dt = G.t - G.inputT; G.inputT = G.t;
    const fast = dt < 0.6;
    const gain = 10 * G.round + (fast ? 5 : 0);
    G.score += gain;
    fx.burst(r.x + r.w / 2, r.y + r.h / 2, { color: ['#fff', PAD_COLORS[i]], n: 10, speed: 160, life: 0.4, size: 3, gravity: 100, shape: 'spark' });
    if (G.pos >= G.seq.length) {
      // ラウンドクリア
      const bonus = 100 * G.round + Math.max(0, Math.round((8 - (G.t - G.roundStart)) * 10)) * G.round;
      G.score += bonus;
      G.state = 'clear'; G.showT = 0;
      fx.text(W / 2, GY - 40, `ROUND ${G.round} CLEAR!  +${bonus}`, { color: '#ffd36e', size: 30, life: 1.1 });
      FES.sfx('correct'); setTimeout(() => FES.sfx('coin'), 180);
      fx.flash('#fff', 0.18, 0.2);
      for (let k = 0; k < N; k++) setTimeout(() => { if (G.state === 'clear') G.lit[k] = 0.8; }, k * 40);
    }
  } else {
    // まちがい
    G.wrong[i] = 1; G.lives--;
    fx.shake(0.9, 0.35); fx.flash('#ff4d8d', 0.3, 0.2); FES.sfx('wrong'); FES.vibrate([40, 30, 40]);
    const wr = padRect(want); G.lit[want] = 1;   // 正解を光らせて教える
    fx.text(W / 2, GY - 40, G.lives > 0 ? 'ちがう！ もう一回 見てね' : 'ちがう…', { color: '#ff4d8d', size: 30, life: 1.2 });
    fx.ring(wr.x + wr.w / 2, wr.y + wr.h / 2, { color: '#fff', r: 20, r1: 90, life: 0.6 });
    if (G.lives <= 0) { finish(false); return; }
    G.state = 'retry'; G.showT = 0;
  }
}
function finish(cleared) {
  G.state = 'over'; G.overT = 0; G.cleared = cleared; FES.fever(false);
  if (cleared) { FES.sfx('fanfare'); fx.flash('#fff', 0.5, 0.4); FES.confetti(3000); }
  else FES.sfx('gameover');
  setTimeout(showResult, cleared ? 1800 : 1400);
}
function showResult() {
  const reached = Math.max(0, G.round - (G.cleared ? 0 : 1));   // クリアしたラウンド数
  const grade = reached >= 14 ? 'S' : reached >= 10 ? 'A' : reached >= 7 ? 'B' : reached >= 4 ? 'C' : 'D';
  FES.showResult({
    score: G.score, scoreLabel: 'pt', title: G.cleared ? 'PERFECT MEMORY!!' : 'GAME OVER',
    subtitle: G.cleared ? `${MAX_ROUND} ラウンド 全クリア！` : `ROUND ${reached} までクリア（${START_LEN + reached - 1} 個おぼえた）`,
    grade, titles: { S: '記憶の神', A: '天才的な記憶力', B: 'なかなかの記憶力', C: 'いい感じ', D: 'つぎはもっと！' },
    stats: [{ label: 'クリアしたラウンド', value: reached }, { label: 'おぼえた数', value: Math.max(0, START_LEN + reached - 1) }, { label: '残りライフ', value: Math.max(0, G.lives) }],
  }, startGame);
}

/* ------------------------------------------------------------ 更新 */
function update(dt) {
  G.t += dt;
  const d = fx.update(dt);
  for (let i = 0; i < N; i++) { G.lit[i] = Math.max(0, G.lit[i] - d * 2.6); G.press[i] = Math.max(0, G.press[i] - d * 5); G.wrong[i] = Math.max(0, G.wrong[i] - d * 2); }
  if (G.msg) { G.msg.t -= d; if (G.msg.t <= 0) G.msg = null; }
  G.dispScore += (G.score - G.dispScore) * Math.min(1, d * 8);
  if (G.state === 'count') {
    G.countT += dt;
    const step = Math.min(3, Math.floor(G.countT / 0.7));
    if (step !== G.countStep) { G.countStep = step; if (step < 3) FES.sfx('countdown'); else { FES.sfx('go'); beginPlay(); } }
  } else if (G.state === 'show') {
    G.showT += d;
    const sd = stepDur();
    const idx = Math.floor(G.showT / sd);
    if (idx !== G.showIdx && idx >= 0) {
      G.showIdx = idx;
      if (idx < G.seq.length) light(G.seq[idx], false);
      else { G.state = 'input'; G.inputT = G.t; G.roundStart = G.t; G.msg = { text: 'おぼえたとおりに！', sub: '', t: 0.9 }; }
    }
  } else if (G.state === 'clear') {
    G.showT += d; if (G.showT > 1.0) nextRound();
  } else if (G.state === 'retry') {
    G.showT += d; if (G.showT > 1.3) { G.pos = 0; G.state = 'show'; G.showIdx = -1; G.showT = -0.3; G.msg = { text: 'もう一度 見てね', sub: `ライフ ${'❤'.repeat(G.lives)}`, t: 1.0 }; }
  } else if (G.state === 'over') G.overT += d;
}

/* ------------------------------------------------------------ 描画 */
function text(s, x, y, size, color, o) {
  o = o || {};
  ctx.save(); ctx.font = `${o.w || 900} ${size}px ${FONT}`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = size * 0.5; }
  if (o.stroke) { ctx.lineWidth = Math.max(3, size * 0.14); ctx.lineJoin = 'round'; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.restore();
}
function render() {
  // 背景
  const bg = ctx.createRadialGradient(W / 2, H * 0.45, 40, W / 2, H * 0.45, W * 0.7); bg.addColorStop(0, '#171538'); bg.addColorStop(1, '#06061a');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // うっすら格子
  ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  fx.begin(ctx);
  // パッド
  for (let i = 0; i < N; i++) {
    const r = padRect(i), c = PAD_COLORS[i], lit = G.lit[i], pr = G.press[i], wr = G.wrong[i];
    const sc = 1 + pr * 0.06;
    ctx.save(); ctx.translate(r.x + r.w / 2, r.y + r.h / 2); ctx.scale(sc, sc);
    ctx.shadowColor = wr > 0 ? '#ff2040' : c; ctx.shadowBlur = 10 + lit * 40;
    ctx.fillStyle = wr > 0 ? `rgba(255,40,70,${0.5 + wr * 0.5})` : lit > 0.02 ? c : 'rgba(255,255,255,.07)';
    ctx.beginPath(); ctx.roundRect(-r.w / 2, -r.h / 2, r.w, r.h, 22); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = lit > 0.02 ? '#fff' : c; ctx.globalAlpha = lit > 0.02 ? 0.9 : 0.55; ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1;
    if (lit > 0.02) { ctx.fillStyle = `rgba(255,255,255,${lit * 0.55})`; ctx.beginPath(); ctx.roundRect(-r.w / 2 + 10, -r.h / 2 + 10, r.w - 20, r.h * 0.35, 14); ctx.fill(); }
    ctx.restore();
    if (G.state !== 'title' && !FES.isTouch()) text(KEY_LABELS[i], r.x + r.w - 20, r.y + r.h - 14, 11, 'rgba(255,255,255,.5)', { w: 700 });
  }
  // 進み具合（入力中は何個目か）
  if (G.state === 'input' || G.state === 'show' || G.state === 'clear' || G.state === 'retry') {
    const n = G.seq.length, bw = Math.min(16, 520 / n), x0 = W / 2 - (n * (bw + 4)) / 2;
    for (let i = 0; i < n; i++) {
      const done = G.state === 'input' ? i < G.pos : G.state === 'show' ? i <= G.showIdx : true;
      ctx.fillStyle = done ? (G.state === 'show' ? '#5ee7ff' : '#ffd36e') : 'rgba(255,255,255,.18)';
      ctx.beginPath(); ctx.roundRect(x0 + i * (bw + 4), H - 50, bw, 10, 4); ctx.fill();
    }
    text(G.state === 'show' ? '👀 みて…' : G.state === 'input' ? `👆 おして！ ${G.pos} / ${n}` : '', W / 2, H - 70, 18, 'rgba(255,255,255,.85)');
  }
  fx.draw(ctx); fx.end(ctx); fx.drawFlash(ctx, W, H);
  drawHUD();
  if (G.msg) { const k = Math.min(1, (1.1 - G.msg.t) * 4); ctx.save(); ctx.globalAlpha = Math.min(1, G.msg.t * 3); text(G.msg.text, W / 2, GY - 52 - (1 - k) * 20, 40, '#fff', { glow: '#8ea7ff', stroke: 'rgba(0,0,0,.6)' }); if (G.msg.sub) text(G.msg.sub, W / 2, GY - 16, 18, 'rgba(255,255,255,.8)'); ctx.restore(); }
  if (G.state === 'over') text(G.cleared ? 'PERFECT!!' : 'GAME OVER', W / 2, H * 0.47, 60, G.cleared ? '#ffd36e' : '#ff4d8d', { glow: G.cleared ? '#ffd36e' : '#ff4d8d', stroke: 'rgba(0,0,0,.6)' });
  if (G.state === 'title') drawTitle();
  if (G.state === 'count') drawCount();
}
function drawHUD() {
  if (G.state === 'title') return;
  // 左: ラウンド・ライフ
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.roundRect(24, 24, 200, 130, 16); ctx.fill();
  text('ROUND', 124, 46, 12, 'rgba(255,255,255,.6)'); text(`${Math.max(1, G.round)} / ${MAX_ROUND}`, 124, 78, 32, '#fff');
  text('LIFE', 124, 112, 12, 'rgba(255,255,255,.6)'); text('❤'.repeat(Math.max(0, G.lives)) + '♡'.repeat(LIVES - Math.max(0, G.lives)), 124, 136, 22, '#ff4d8d');
  // 右: スコア
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.roundRect(W - 224, 24, 200, 130, 16); ctx.fill();
  text('SCORE', W - 124, 46, 12, 'rgba(255,255,255,.6)'); text(Math.round(G.dispScore).toLocaleString(), W - 124, 80, 32, '#ffd36e', { glow: 'rgba(255,211,110,.6)' });
  text('おぼえる数', W - 124, 112, 12, 'rgba(255,255,255,.6)'); text(String(G.seq.length || START_LEN), W - 124, 136, 24, '#5ee7ff');
}
function drawTitle() {
  G.titleT += 1 / 60; const t = G.titleT;
  ctx.fillStyle = 'rgba(4,4,20,.6)'; ctx.fillRect(0, 0, W, H);
  // 飾り: パッドが順に光る
  const demo = Math.floor(t * 1.6) % N;
  for (let i = 0; i < N; i++) { const r = padRect(i); const s = 0.42; const x = 170 + (i % 3) * 64, y = 170 + Math.floor(i / 3) * 64; ctx.save(); ctx.shadowColor = PAD_COLORS[i]; ctx.shadowBlur = i === demo ? 24 : 4; ctx.fillStyle = i === demo ? PAD_COLORS[i] : 'rgba(255,255,255,.1)'; ctx.beginPath(); ctx.roundRect(x, y, r.w * s, r.h * s, 10); ctx.fill(); ctx.restore(); }
  text('メモリーフラッシュ', 600, 140, 66, '#fff', { glow: '#b06bff', stroke: 'rgba(0,0,0,.5)' });
  text('— MEMORY FLASH —', 600, 192, 18, 'rgba(255,255,255,.7)', { w: 700 });
  text(`HI-SCORE ${FES.getHiScore().toLocaleString()}`, 600, 232, 20, '#ffd36e');
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.roundRect(360, 262, 480, 124, 16); ctx.fill();
  text('光った順番をおぼえて、同じ順番に押そう', 600, 288, 17, '#fff', { w: 700 });
  text('🧠 1ラウンドごとに 1つずつ長くなる（最初は 3つ）', 600, 316, 16, '#ffd36e', { w: 700 });
  text('❤ ライフは 3つ。まちがえても もう一度 見られる', 600, 342, 16, 'rgba(255,255,255,.85)', { w: 700 });
  text('タップ / クリック ・ キー Q W E / A S D / Z X C ・ テンキー', 600, 368, 14, 'rgba(255,255,255,.6)', { w: 700 });
  const pulse = 1 + Math.sin(t * 4) * 0.04;
  ctx.save(); ctx.translate(600, 445); ctx.scale(pulse, pulse);
  ctx.shadowColor = '#b06bff'; ctx.shadowBlur = 24; ctx.fillStyle = '#b06bff'; ctx.beginPath(); ctx.roundRect(-130, -30, 260, 60, 30); ctx.fill(); ctx.shadowBlur = 0;
  text('▶ スタート！', 0, 2, 26, '#fff'); ctx.restore();
  text('タップ / クリック / Enter / Space でスタート', 600, 500, 13, 'rgba(255,255,255,.55)', { w: 700 });
}
function drawCount() {
  const step = G.countStep, k = (G.countT - step * 0.7) / 0.7;
  const label = ['3', '2', '1'][step] || 'GO!';
  const sc = 1.6 - Math.min(1, k) * 0.6;
  ctx.save(); ctx.translate(W / 2, H * 0.45); ctx.scale(sc, sc);
  text(label, 0, 0, 120, label === 'GO!' ? '#5cff8d' : '#fff', { glow: label === 'GO!' ? '#5cff8d' : '#b06bff', stroke: 'rgba(0,0,0,.6)' });
  ctx.restore();
}

/* ------------------------------------------------------------ 入力 */
let paused = false;
function togglePause() {
  if (!['show', 'input', 'clear', 'retry'].includes(G.state)) return;
  paused = !paused;
  if (paused) FES.pause(true, { onResume: () => { if (paused) togglePause(); }, onRetry: () => { FES.pause(false); paused = false; startGame(); } });
  else FES.pause(false);
}
function padAt(gx, gy) { for (let i = 0; i < N; i++) { const r = padRect(i); if (gx >= r.x - 6 && gx <= r.x + r.w + 6 && gy >= r.y - 6 && gy <= r.y + r.h + 6) return i; } return -1; }
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'Escape' || e.code === 'KeyP') { togglePause(); return; }
  if (paused) return;
  if (G.state === 'title') { if (e.code === 'Space' || e.code === 'Enter') { startGame(); FES.sfx('start'); } return; }
  const i = KEYMAP[e.code];
  if (i != null) pressPad(i);
});
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); if (paused) return;
  if (G.state === 'title') { startGame(); FES.sfx('start'); return; }
  const p = view.toGame(e.clientX, e.clientY);
  const i = padAt(p.x, p.y);
  if (i >= 0) pressPad(i);
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ------------------------------------------------------------ ループ */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) update(dt);
  render();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
