<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ランキングボード | NEON FESTA</title>
<style>
  :root { --gold: #ffd36e; --muted: rgba(255,255,255,.6); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #07071a; color: #fff; overflow: hidden; cursor: none;
    font-family: "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; }
  body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(ellipse at 50% -10%, rgba(110,70,255,.45), transparent 60%),
    radial-gradient(ellipse at 100% 100%, rgba(255,77,141,.2), transparent 50%); pointer-events: none; }
  .app { position: relative; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 2.2vh 2.6vw; gap: 2vh; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 2vw; }
  .brand { font-size: 4.2vh; font-weight: 900; letter-spacing: .08em;
    background: linear-gradient(90deg,#fff,#ffd36e,#fff,#8ed6ff,#fff); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 6s linear infinite; }
  .brand small { display: block; font-size: 1.8vh; letter-spacing: .4em; color: var(--muted); -webkit-text-fill-color: var(--muted); }
  @keyframes shine { to { background-position: 200% 0 } }
  .live { font-size: 1.8vh; color: var(--muted); display: flex; align-items: center; gap: .6em; }
  .live i { width: 1.2vh; height: 1.2vh; border-radius: 50%; background: #5cff8d; box-shadow: 0 0 12px #5cff8d; animation: blink 1.6s infinite; }
  .live.off i { background: #ff7a7a; box-shadow: 0 0 12px #ff7a7a; }
  @keyframes blink { 50% { opacity: .35 } }
  main { display: grid; grid-template-columns: 1.35fr 1fr; gap: 2.4vw; min-height: 0; }
  .panel { background: linear-gradient(160deg, rgba(30,30,70,.85), rgba(10,10,30,.92)); border: 1px solid rgba(255,255,255,.14); border-radius: 3vh; padding: 3vh 2.4vw; min-height: 0; position: relative; overflow: hidden; }
  /* 左: ゲームごとの TOP5（順番に切り替わる） */
  .slide { position: absolute; inset: 3vh 2.4vw; opacity: 0; transform: translateY(2vh); transition: opacity .6s, transform .6s; display: flex; flex-direction: column; }
  .slide.show { opacity: 1; transform: none; }
  .g-head { display: flex; align-items: center; gap: 1.4vw; margin-bottom: 2.4vh; }
  .g-icon { font-size: 7vh; width: 11vh; height: 11vh; display: grid; place-items: center; border-radius: 2.4vh; background: color-mix(in srgb, var(--accent) 25%, transparent); box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 45%, transparent); }
  .g-genre { font-size: 1.8vh; letter-spacing: .3em; color: var(--accent); font-weight: 800; }
  .g-title { font-size: 5vh; font-weight: 900; line-height: 1.15; }
  .g-sub { font-size: 2vh; color: var(--muted); }
  ol.top { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.2vh; flex: 1; }
  ol.top li { display: grid; grid-template-columns: 7vh 1fr auto; align-items: center; gap: 1.2vw; padding: 1.4vh 1.6vw; border-radius: 1.8vh; background: rgba(255,255,255,.06); font-size: 3.6vh; font-weight: 800; }
  ol.top li.r1 { background: linear-gradient(90deg, rgba(255,211,110,.35), rgba(255,77,141,.18)); font-size: 4.6vh; box-shadow: 0 0 0 2px rgba(255,211,110,.55) inset, 0 0 40px rgba(255,211,110,.25); }
  ol.top li .rk { font-weight: 900; text-align: center; }
  ol.top li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol.top li .sc { font-variant-numeric: tabular-nums; }
  ol.top li .tag { display: inline-block; margin-left: .6em; font-size: .45em; padding: .2em .7em; border-radius: 999px; background: linear-gradient(90deg,#ff4d8d,#ffb347); vertical-align: middle; letter-spacing: .1em; }
  ol.top li.empty { grid-template-columns: 1fr; color: var(--muted); font-size: 3vh; text-align: center; background: none; }
  /* 右: 全ゲームのチャンピオン */
  .champ { display: flex; flex-direction: column; }
  .champ h2 { margin: 0 0 1.2vh; font-size: 2.6vh; letter-spacing: .2em; color: var(--gold); }
  .champ ul { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; display: grid; grid-auto-rows: 1fr; gap: .5vh; }
  .champ li { display: grid; grid-template-columns: 4.6vh 1fr auto; align-items: center; gap: .9vw; padding: 0 1vw; min-height: 0; overflow: hidden; border-radius: 1.4vh; background: rgba(255,255,255,.05); font-size: 2.1vh; line-height: 1.15; transition: background .4s; }   /* 13 ゲーム分が縦に収まる大きさ */
  .champ li.cur { background: color-mix(in srgb, var(--accent) 28%, transparent); }
  .champ li .ic { font-size: 2.6vh; text-align: center; }
  .champ li .gt { font-size: 1.4vh; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .champ li .who { display: block; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .champ li .pt { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold); }
  .champ li.none .who { color: var(--muted); font-weight: 600; }
  footer { display: flex; align-items: center; justify-content: space-between; font-size: 2vh; color: var(--muted); gap: 2vw; }
  footer b { color: #fff; }
  .dots { display: flex; gap: .6vw; }
  .dots i { width: 1vh; height: 1vh; border-radius: 50%; background: rgba(255,255,255,.25); }
  .dots i.on { background: var(--gold); }
  /* 殿堂スライド（スタンプラリー全クリアの速い順） */
  .slide.hall .g-icon { background: rgba(255,211,110,.22); box-shadow: 0 0 40px rgba(255,211,110,.4); }
  ol.top li .tm { font-family: Consolas, "Courier New", monospace; font-variant-numeric: tabular-nums; color: var(--gold); }
  ol.top.hall li { font-size: 3vh; padding: 1vh 1.6vw; }
  ol.top.hall li.r1 { font-size: 3.8vh; }
  /* 案内スライド（スタンプラリー・遊び方） */
  .slide.info .steps { display: flex; flex-direction: column; gap: 1.6vh; flex: 1; justify-content: center; }
  .slide.info .st { display: grid; grid-template-columns: 7vh 1fr; align-items: center; gap: 1.4vw; padding: 1.6vh 1.6vw; border-radius: 1.8vh; background: rgba(255,255,255,.06); font-size: 3.2vh; font-weight: 800; line-height: 1.3; }
  .slide.info .st .n { width: 6vh; height: 6vh; border-radius: 50%; display: grid; place-items: center; font-size: 3.4vh; font-weight: 900; color: #1a1040; background: linear-gradient(135deg,#ffd36e,#ff9f43); }
  .slide.info .st small { display: block; font-size: 2vh; color: var(--muted); font-weight: 700; margin-top: .3vh; }
  .slide.info .st b { color: var(--gold); }
  .slide.info .st.hot { background: linear-gradient(90deg, rgba(255,211,110,.3), rgba(255,77,141,.18)); box-shadow: 0 0 0 2px rgba(255,211,110,.5) inset; }
  /* 新チャンピオンのお知らせ */
  #flash { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(5,5,20,.82); backdrop-filter: blur(6px); z-index: 10; text-align: center; }
  #flash.open { display: flex; animation: pop .6s cubic-bezier(.2,1.4,.4,1); }
  #flash .k { font-size: 3vh; letter-spacing: .5em; color: var(--gold); font-weight: 900; }
  #flash .n { font-size: 12vh; font-weight: 900; margin: 1vh 0; text-shadow: 0 0 60px rgba(255,211,110,.7); }
  #flash .g { font-size: 4vh; font-weight: 800; }
  #flash .s { font-size: 6vh; font-weight: 900; color: var(--gold); margin-top: 1vh; }
  @keyframes pop { from { transform: scale(.7); opacity: 0 } }
  /* 空き PC（部屋の PC が知らせてくる） */
  .vac { display: none; align-items: center; gap: .8vw; padding: .9vh 1.6vw; border-radius: 999px; font-size: 2.6vh; font-weight: 900; background: rgba(92,255,141,.14); border: 2px solid #5cff8d; color: #c9ffd9; }
  .vac.show { display: flex; }
  .vac b { font-size: 3.6vh; color: #5cff8d; font-variant-numeric: tabular-nums; }
  .vac.zero { background: rgba(255,107,139,.14); border-color: #ff6b8b; color: #ffc2cf; }
  .vac.zero b { color: #ff6b8b; }
  .vac small { font-size: 1.7vh; color: var(--muted); font-weight: 700; }
  /* ラストスパート（14:00〜15:00） */
  footer .ev { display: none; font-weight: 900; color: #fff; padding: .6vh 1.4vw; border-radius: 999px; background: linear-gradient(90deg, #ff4d8d, #ff9f43); box-shadow: 0 0 30px rgba(255,120,80,.5); animation: blink 1.6s infinite; }
  footer .ev b { font-variant-numeric: tabular-nums; font-size: 2.6vh; }
  body.event footer .ev { display: block; }
  body.event footer .rule { display: none; }
  @media (max-aspect-ratio: 1/1) { main { grid-template-columns: 1fr; } .champ { display: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" id="brand">NEON FESTA<small>LIVE RANKING</small></div>
    <div class="vac" id="vac"></div>
    <div class="live" id="live"><i></i><span id="liveText">接続中…</span></div>
  </header>
  <main>
    <div class="panel" id="slides"></div>
    <div class="panel champ">
      <h2>👑 チャンピオン</h2>
      <ul id="champ"></ul>
    </div>
  </main>
  <footer>
    <div class="rule">ハイスコアで <b>チャンピオン</b>、3個・5個で <b>景品</b>、8個で <b>殿堂入り</b> をめざそう！</div>
    <div class="ev" id="ev"></div>
    <div class="dots" id="dots"></div>
  </footer>
</div>
<div id="flash"><div class="k">NEW CHAMPION!</div><div class="n" id="fName"></div><div class="g" id="fGame"></div><div class="s" id="fScore"></div></div>
<script>
'use strict';
// 大画面（テレビ）用のランキング表示。誰でも見られる API (/api/rankings) を読むだけなので、ルームキーはいらない。
const DEFAULT_API = 'https://neon-festa-api.brainrot-rumble.workers.dev';
const GAMES = [
  { id: 'rhythm',   title: 'リズムスターズ',       genre: '音楽',         icon: '🎵', accent: '#ff4d8d', ids: [['rhythm_easy', 'やさしい'], ['rhythm', 'ふつう'], ['rhythm_hard', 'むずかしい'], ['rhythm_expert', 'エキスパート'], ['rhythm_master', 'マスター'], ['rhythm_tas', 'TAS'], ['rhythm_tas2', 'TAS∞']] },
  { id: 'shooter',  title: 'ギャラクシーブラスター', genre: 'シューティング', icon: '🚀', accent: '#5ee7ff' },
  { id: 'puzzle',   title: 'ジュエルラッシュ',      genre: 'パズル',        icon: '💎', accent: '#b06bff' },
  { id: 'typing',   title: 'タイピングバトル',      genre: 'タイピング',     icon: '⌨️', accent: '#5cff8d' },
  { id: 'racing',   title: 'ネオンドライブ',        genre: 'レース',        icon: '🏎️', accent: '#ff9f43' },
  { id: 'runner',   title: 'ダッシュ！ネコ忍者',    genre: 'アクション',     icon: '🐱', accent: '#ffd36e' },
  { id: 'mole',     title: 'もぐらパニック',        genre: '反射神経',       icon: '🔨', accent: '#8bd346' },
  { id: 'hockey',   title: 'ネオンエアホッケー',    genre: '対戦',          icon: '🏒', accent: '#3fd8ff' },
  { id: 'quiz',     title: '早押しクイズ王',        genre: 'クイズ',        icon: '❓', accent: '#ff6b6b' },
  { id: 'breakout', title: 'ネオンブレイカー',      genre: 'アーケード',     icon: '🧱', accent: '#a5f3fc' },
  { id: 'drops',    title: 'ネオンドロップバトル',   genre: 'パズルRPG',      icon: '🐉', accent: '#b45cff' },
  { id: 'fps',      title: 'ネオンストライク',      genre: 'FPSシューティング', icon: '🎯', accent: '#ff7ab8' },
  { id: 'stack',    title: 'ネオンスタック',        genre: 'タイミング',     icon: '🏗️', accent: '#ffb347' },
  { id: 'memory',   title: 'メモリーフラッシュ',    genre: '記憶',          icon: '🧠', accent: '#c86bff' },
];
const N_GAMES = GAMES.length + 1;   // スタンプラリーの対象（ランキングのないネオンデュエルも入る）
const HALL_NEED = 8;                // 殿堂入りに必要なスタンプ（common.js の HALL_NEED と同じ）
const SLIDE_SEC = 8, POLL_SEC = 15;
const fmtTime = ms => { const s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60; return (h ? h + ':' : '') + (h ? String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0'); };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let api = DEFAULT_API;
try { const r = JSON.parse(localStorage.getItem('fes:room')); if (r && r.api) api = r.api; } catch (e) {}
try { const t = localStorage.getItem('fes:title'); if (t) $('brand').firstChild.textContent = t; } catch (e) {}

// ラストスパート（軽音部の時間 14:00〜15:00 も人を呼ぶためのイベント。common.js の EVENT と同じ）。
// 本番の日だけ動く。ためすときは board.html?evnow=2026-11-03T14:10 のように時刻を決めて開く
const EVENT = { date: '2026-11-03', start: '14:00', end: '15:00' };
const evOffset = (() => { const q = new URLSearchParams(location.search).get('evnow'); const t = q && Date.parse(q); return t ? t - Date.now() : 0; })();
const evNow = () => new Date(Date.now() + evOffset);
const evAt = hm => new Date(`${EVENT.date}T${hm}:00`);
function eventPhase(d) {
  const t = +d, a = +evAt(EVENT.start), b = +evAt(EVENT.end);
  if (t < a - 6 * 3600e3 || t > b + 6 * 3600e3) return null;   // 本番の日以外は出さない
  return t < a ? 'before' : t < b ? 'on' : 'after';
}

let data = { rankings: {}, hall: [] };
let champs = null;        // 前回のチャンピオン（新チャンピオンの検出用）
let slideIdx = 0, slideEls = [];

// ゲームのいちばん良い記録（リズムは難易度ごとに別ランキングなので、その中の最高）
function bestOf(g) {
  let best = null;
  (g.ids || [[g.id, '']]).forEach(([id, label]) => { const r = (data.rankings[id] || [])[0]; if (r && (!best || r.score > best.score)) best = { ...r, label, id }; });
  return best;
}
// スライドにする単位: 記録のあるランキング（リズムは難易度ごと）。記録がないゲームも1枚は出す
function slideList() {
  const out = [];
  GAMES.forEach(g => {
    const ids = g.ids || [[g.id, '']];
    const withData = ids.filter(([id]) => (data.rankings[id] || []).length);
    (withData.length ? withData : [ids[ids.length > 1 ? 1 : 0]]).forEach(([id, label]) => out.push({ g, id, label }));
  });
  return out;
}
function renderSlides() {
  const wrap = $('slides'); wrap.innerHTML = '';
  slideEls = slideList().map(({ g, id, label }) => {
    const r = (data.rankings[id] || []).slice(0, 5);
    const s = document.createElement('div');
    s.className = 'slide'; s.style.setProperty('--accent', g.accent);
    const fresh = Date.now() - 10 * 60 * 1000;
    s.innerHTML = `<div class="g-head"><div class="g-icon">${g.icon}</div><div><div class="g-genre">${esc(g.genre)}${label ? ' · ' + esc(label) : ''}</div><div class="g-title">${esc(g.title)}</div><div class="g-sub">TOP 5</div></div></div>
      <ol class="top">${r.length ? r.map((e, i) => `<li class="r${i + 1}"><span class="rk">${['🥇', '🥈', '🥉'][i] || i + 1}</span><span class="nm">${esc(e.name)}${e.date > fresh ? '<span class="tag">NEW</span>' : ''}</span><span class="sc">${e.score.toLocaleString()}</span></li>`).join('')
        : '<li class="empty">まだ記録なし — 1番乗りでチャンピオン！</li>'}</ol>`;
    wrap.appendChild(s);
    s.dataset.game = g.id;
    return s;
  });
  // 殿堂（スタンプラリー全クリア、速い順）
  const hall = document.createElement('div');
  hall.className = 'slide hall'; hall.style.setProperty('--accent', '#ffd36e');
  const fresh = Date.now() - 10 * 60 * 1000;
  const top = (data.hall || []).slice(0, 8);
  hall.innerHTML = `<div class="g-head"><div class="g-icon">🏅</div><div><div class="g-genre">STAMP RALLY</div><div class="g-title">殿堂</div><div class="g-sub">スタンプ ${HALL_NEED} 個を集めた人 · 速い順</div></div></div>
    <ol class="top hall">${top.length ? top.map((e, i) => `<li class="r${i + 1}"><span class="rk">${['🥇', '🥈', '🥉'][i] || i + 1}</span><span class="nm">${esc(e.name)}${e.date > fresh ? '<span class="tag">NEW</span>' : ''}</span><span class="tm">${fmtTime(e.timeMs)}</span></li>`).join('')
      : `<li class="empty">まだいない — スタンプ ${HALL_NEED} 個で殿堂入り！</li>`}</ol>`;
  wrap.appendChild(hall); slideEls.push(hall);
  // 案内（スタンプラリー・遊び方）
  const info = document.createElement('div');
  info.className = 'slide info'; info.style.setProperty('--accent', '#5ee7ff');
  info.innerHTML = `<div class="g-head"><div class="g-icon">🎮</div><div><div class="g-genre">HOW TO PLAY</div><div class="g-title">スタンプラリー開催中</div><div class="g-sub">ゲームを1つ遊ぶごとにスタンプ1つ</div></div></div>
    <div class="steps">
      <div class="st"><span class="n">1</span><span>「次の人」を押して、なまえを選ぶ<small>色＋どうぶつをボタンで。🎲 おまかせでもOK</small></span></div>
      <div class="st"><span class="n">2</span><span>好きなゲームを選んで「スタート」<small>全 ${N_GAMES} ゲーム · 1回 1〜3分 · ⚔️ 2人対戦「ネオンデュエル」もあり</small></span></div>
      <div class="st"><span class="n">3</span><span>ハイスコアで <b>チャンピオン</b> に名前が出る<small>1位をとると、この画面に大きく出ます</small></span></div>
      <div class="st hot"><span class="n">🏅</span><span>スタンプを ${HALL_NEED} 個集めると <b>殿堂入り</b><small>名前とタイムが殿堂に残り、表彰状ももらえる。スタンプ 3 個・5 個で自作ゲームの QR、遊んだ人はみんな出口でシール</small></span></div>
    </div>`;
  wrap.appendChild(info); slideEls.push(info);
  $('dots').innerHTML = slideEls.map(() => '<i></i>').join('');
  showSlide(Math.min(slideIdx, slideEls.length - 1));
}
function showSlide(i) {
  if (!slideEls.length) return;
  slideIdx = (i + slideEls.length) % slideEls.length;
  slideEls.forEach((s, k) => s.classList.toggle('show', k === slideIdx));
  document.querySelectorAll('#dots i').forEach((d, k) => d.classList.toggle('on', k === slideIdx));
  const gid = slideEls[slideIdx].dataset.game;
  document.querySelectorAll('#champ li').forEach(li => li.classList.toggle('cur', li.dataset.game === gid));
}
function renderChamps() {
  $('champ').innerHTML = GAMES.map(g => {
    const b = bestOf(g);
    return `<li style="--accent:${g.accent}" data-game="${g.id}" class="${b ? '' : 'none'}"><span class="ic">${g.icon}</span>
      <span><span class="gt">${esc(g.title)}${b && b.label ? '（' + esc(b.label) + '）' : ''}</span><span class="who">${b ? esc(b.name) : 'まだいない'}</span></span>
      <span class="pt">${b ? b.score.toLocaleString() : ''}</span></li>`;
  }).join('');
}
// 新しいチャンピオンが出たら大きく表示
const flashQueue = [];
function detectNewChamps() {
  const now = {};
  GAMES.forEach(g => { const b = bestOf(g); if (b) now[g.id] = b; });
  if (champs) GAMES.forEach(g => {
    const a = champs[g.id], b = now[g.id];
    if (b && (!a || a.name !== b.name || a.score !== b.score)) flashQueue.push({ g, b });
  });
  champs = now;
  if (flashQueue.length && !$('flash').classList.contains('open')) nextFlash();
}
// 新しく殿堂入りした人も大きく表示（起動時にすでにある記録は出さない）
let hallSeen = null;
function detectNewHall() {
  const key = e => `${e.name}|${e.timeMs}|${e.date}`;
  const now = new Set((data.hall || []).map(key));
  if (hallSeen) (data.hall || []).forEach(e => { if (!hallSeen.has(key(e))) flashQueue.push({ hall: e }); });
  hallSeen = now;
  if (flashQueue.length && !$('flash').classList.contains('open')) nextFlash();
}
function nextFlash() {
  const f = flashQueue.shift();
  if (!f) { $('flash').classList.remove('open'); return; }
  if (f.ev) {
    $('flash').firstElementChild.textContent = f.ev.k;
    $('fName').textContent = f.ev.n; $('fGame').textContent = f.ev.g; $('fScore').textContent = f.ev.s;
  } else if (f.hall) {
    $('flash').firstElementChild.textContent = 'HALL OF FAME!';
    $('fName').textContent = f.hall.name;
    $('fGame').textContent = `🏅 殿堂入り！ スタンプ ${HALL_NEED} 個`;
    $('fScore').textContent = fmtTime(f.hall.timeMs);
  } else {
    $('flash').firstElementChild.textContent = 'NEW CHAMPION!';
    $('fName').textContent = f.b.name;
    $('fGame').textContent = `${f.g.icon} ${f.g.title}${f.b.label ? '（' + f.b.label + '）' : ''}`;
    $('fScore').textContent = f.b.score.toLocaleString();
  }
  $('flash').classList.remove('open'); void $('flash').offsetWidth; $('flash').classList.add('open');
  setTimeout(nextFlash, 6000);
}

async function poll() {
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
    const [r, rh] = await Promise.all([
      fetch(api + '/api/rankings', { signal: ctl.signal, cache: 'no-store' }),
      fetch(api + '/api/hall', { signal: ctl.signal, cache: 'no-store' }).catch(() => null),   // 殿堂が取れなくてもランキングは出す
    ]); clearTimeout(t);
    if (!r.ok) throw new Error(r.status);
    const rankings = await r.json();
    const hall = rh && rh.ok ? await rh.json() : data.hall;
    const changed = JSON.stringify(rankings) !== JSON.stringify(data.rankings) || JSON.stringify(hall) !== JSON.stringify(data.hall);
    data.rankings = rankings; data.hall = Array.isArray(hall) ? hall : [];
    if (changed || !slideEls.length) { renderSlides(); renderChamps(); detectNewChamps(); detectNewHall(); }
    $('live').classList.remove('off');
    const d = new Date(); $('liveText').textContent = `LIVE · ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')} 更新`;
  } catch (e) {
    $('live').classList.add('off'); $('liveText').textContent = '通信待ち（前の記録を表示中）';
    if (!slideEls.length) { renderSlides(); renderChamps(); }
  }
}
poll();
setInterval(poll, POLL_SEC * 1000);

// ---- 空き PC（10 秒ごと）----
async function pollVacancy() {
  try {
    const r = await fetch(api + '/api/vacancy', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const v = await r.json();
    const live = (v.pcs || []).filter(p => v.now - p.at <= 3 * 60 * 1000);
    const free = live.filter(p => p.state === 'free').length;
    const el = $('vac');
    el.classList.toggle('show', live.length > 0); el.classList.toggle('zero', !free);
    el.innerHTML = free ? `🟢 空き <b>${free}</b> 台 <small>/ ${live.length} 台</small>` : `🔴 満席 <small>まもなく空きます（1 人 15 分くらい）</small>`;
  } catch (e) { /* 出せないときは消したまま */ }
}
pollVacancy(); setInterval(pollVacancy, 10000);

// ---- ラストスパート ----
const evShown = {};
function evFlash(id, ev) { if (evShown[id]) return; evShown[id] = true; flashQueue.push({ ev }); if (!$('flash').classList.contains('open')) nextFlash(); }
function tickEvent() {
  const d = evNow(), ph = eventPhase(d);
  document.body.classList.toggle('event', ph === 'on' || ph === 'after');
  if (ph === 'on') {
    const left = Math.max(0, Math.round((+evAt(EVENT.end) - d) / 1000)), m = Math.floor(left / 60), s = left % 60;
    $('ev').innerHTML = `⏰ ラストスパート！ 本日のチャンピオン決定まで あと <b>${m}:${String(s).padStart(2, '0')}</b>`;
    if (left > 50 * 60) evFlash('start', { k: 'LAST SPURT!', n: 'ラストスパート', g: `${EVENT.end} で 本日のチャンピオンが決まる！`, s: 'いまの 1 位をぬかそう' });
    if (left <= 10 * 60 && left > 9 * 60) evFlash('ten', { k: 'LAST 10 MINUTES!', n: 'のこり 10 分', g: '本日のチャンピオン決定まで あと少し！', s: '最後の 1 回、いこう' });
  } else if (ph === 'after') {
    $('ev').innerHTML = '👑 本日のチャンピオン 決定！ 遊んでくれてありがとう！';
    $('champ').previousElementSibling.textContent = '👑 本日のチャンピオン（決定）';
    evFlash('end', { k: 'CHAMPIONS DECIDED!', n: '本日のチャンピオン決定', g: '右の表がきょうのチャンピオン！', s: 'ありがとうございました' });
  }
}
tickEvent(); setInterval(tickEvent, 1000);
setInterval(() => showSlide(slideIdx + 1), SLIDE_SEC * 1000);
// クリック / キーで全画面
const full = () => { if (!document.fullscreenElement) (document.documentElement.requestFullscreen || (() => {})).call(document.documentElement); };
addEventListener('click', full); addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.key === 'Enter') full(); if (e.key === 'ArrowRight') showSlide(slideIdx + 1); if (e.key === 'ArrowLeft') showSlide(slideIdx - 1); });
</script>
