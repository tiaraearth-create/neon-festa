<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部屋のPC登録 | NEON FESTA</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #07071a; color: #fff; font-family: "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { width: min(100%, 520px); background: linear-gradient(160deg, rgba(30,30,70,.95), rgba(10,10,30,.97)); border: 1px solid rgba(255,255,255,.18);
    border-radius: 24px; padding: 28px; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(120,90,255,.25); }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p.lead { margin: 0 0 20px; opacity: .75; font-size: 14px; line-height: 1.7; }
  label { display: block; font-size: 13px; font-weight: 700; margin: 14px 0 6px; opacity: .85; }
  input { width: 100%; font-size: 18px; padding: 10px 12px; border-radius: 12px; border: 2px solid rgba(255,255,255,.3); background: rgba(0,0,0,.4); color: #fff; outline: none; }
  input:focus { border-color: #ffd36e; }
  small { display: block; margin-top: 4px; opacity: .55; font-size: 12px; }
  details { margin-top: 14px; font-size: 13px; opacity: .85; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  button, a.btn { padding: 12px 22px; border-radius: 14px; border: 0; font-size: 16px; font-weight: 900; cursor: pointer; color: #fff; text-decoration: none;
    background: linear-gradient(135deg,#6a5cff,#b04dff); box-shadow: 0 8px 24px rgba(120,80,255,.45); }
  button.alt, a.btn.alt { background: rgba(255,255,255,.12); box-shadow: none; }
  button.danger { background: rgba(255,80,80,.25); box-shadow: none; }
  #status { margin-top: 18px; padding: 12px 14px; border-radius: 12px; font-weight: 700; font-size: 15px; display: none; line-height: 1.6; }
  #status.ok { display: block; background: rgba(92,255,141,.15); border: 1px solid rgba(92,255,141,.5); }
  #status.ng { display: block; background: rgba(255,90,90,.15); border: 1px solid rgba(255,90,90,.5); }
  #status.info { display: block; background: rgba(255,255,255,.08); }
</style>
</head>
<body>
<div class="card">
  <h1>🖥 部屋のPC登録</h1>
  <p class="lead">文化祭の部屋で使うPCを登録します（準備の日に1台につき1回）。<br>登録したPCの記録だけが、全部のPCで共有されるランキングに載ります。</p>

  <div id="current"></div>

  <label for="key">ルームキー</label>
  <input id="key" type="password" autocomplete="off" placeholder="運営から聞いたキー">
  <small>お客さんに見られないように入力してください。</small>

  <label for="pc">PCの番号・名前</label>
  <input id="pc" maxlength="20" placeholder="例: 12">
  <small>空のままでも登録できます（自動で番号をつけます）。</small>

  <details>
    <summary>くわしい設定</summary>
    <label for="api">サーバーのURL</label>
    <input id="api" placeholder="https://neon-festa-api.brainrot-rumble.workers.dev">
    <small>ふつうは空のままでOK。</small>
  </details>

  <div class="row">
    <button id="save">登録する</button>
    <a class="btn alt" href="index.html">ホームへ</a>
    <button id="remove" class="danger" style="display:none">登録を外す</button>
  </div>
  <div id="status"></div>
</div>
<script>
'use strict';
const DEFAULT_API = 'https://neon-festa-api.brainrot-rumble.workers.dev';
const $ = id => document.getElementById(id);
const status = (cls, msg) => { const s = $('status'); s.className = cls; s.textContent = msg; };
const load = () => { try { return JSON.parse(localStorage.getItem('fes:room')); } catch (e) { return null; } };

// URL の #key=... でキーを渡されたら入力欄に入れて、アドレスバーからは消す
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get('key')) { $('key').value = hash.get('key'); history.replaceState(null, '', location.pathname); }
if (hash.get('pc')) $('pc').value = hash.get('pc');

function showCurrent() {
  const r = load();
  $('current').innerHTML = '';
  $('remove').style.display = r ? '' : 'none';
  if (r) {
    const d = document.createElement('div');
    d.id = 'status'; d.className = 'ok'; d.style.display = 'block'; d.style.margin = '0 0 6px';
    d.textContent = `✅ このPCは登録済み（PC: ${r.pc}）`;
    $('current').appendChild(d);
    if (!$('pc').value) $('pc').value = r.pc;
    if (r.api && r.api !== DEFAULT_API) $('api').value = r.api;
  }
}
showCurrent();

$('save').onclick = async () => {
  const key = $('key').value.trim();
  if (!key) { status('ng', 'ルームキーを入れてください。'); $('key').focus(); return; }
  const pc = $('pc').value.trim() || 'PC-' + Math.random().toString(36).slice(2, 6).toUpperCase();
  const api = $('api').value.trim().replace(/\/+$/, '') || DEFAULT_API;
  status('info', 'サーバーに確認しています…');
  try {
    const r = await fetch(api + '/api/room/check?pc=' + encodeURIComponent(pc), { headers: { 'X-Room-Key': key } });
    if (r.status === 403) { status('ng', '❌ ルームキーがちがいます。'); return; }
    if (!r.ok) throw new Error(r.status);
  } catch (e) {
    status('ng', '❌ サーバーにつながりません。インターネットにつながっているか確認してください。');
    return;
  }
  const room = { key, pc };
  if (api !== DEFAULT_API) room.api = api;
  localStorage.setItem('fes:room', JSON.stringify(room));
  // 前のこのPCだけのランキングは、共有ランキングと混ざらないようにそのまま残す（表示はされなくなる）
  $('key').value = '';
  showCurrent();
  status('ok', `✅ 登録しました（PC: ${pc}）。「ホームへ」で始められます。`);
};

$('remove').onclick = () => {
  localStorage.removeItem('fes:room');
  localStorage.removeItem('fes:cloud');
  showCurrent();
  status('info', '登録を外しました。このPCの記録は、このPCの中だけに保存されます。');
};
</script>
</body>
</html>
