<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空いている PC | NEON FESTA</title>
<style>
  :root { --gold: #ffd36e; --muted: rgba(255,255,255,.62); --free: #5cff8d; --busy: #ff6b8b; --off: #6b6b85; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #07071a; color: #fff; font-family: "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; }
  body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(ellipse at 50% -10%, rgba(110,70,255,.4), transparent 60%); pointer-events: none; }
  .wrap { position: relative; max-width: 760px; margin: 0 auto; padding: 18px 16px 28px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .06em; }
  h1 small { display: block; font-size: 12px; color: var(--muted); letter-spacing: .3em; margin-bottom: 2px; }
  .big { margin: 16px 0 8px; padding: 18px 16px; border-radius: 22px; text-align: center; background: linear-gradient(160deg, rgba(30,30,70,.9), rgba(10,10,30,.95)); border: 1px solid rgba(255,255,255,.16); }
  .big .n { font-size: 72px; font-weight: 900; line-height: 1; color: var(--free); text-shadow: 0 0 30px rgba(92,255,141,.5); font-variant-numeric: tabular-nums; }
  .big .n.zero { color: var(--busy); text-shadow: 0 0 30px rgba(255,107,139,.5); }
  .big .l { font-size: 18px; font-weight: 900; margin-top: 4px; }
  .big .m { font-size: 14px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .free-list { font-size: 15px; font-weight: 800; margin-top: 10px; line-height: 1.7; }
  .free-list b { display: inline-block; min-width: 2.2em; margin: 2px; padding: 2px 8px; border-radius: 8px; background: rgba(92,255,141,.18); border: 1px solid var(--free); color: #c9ffd9; }
  .legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 14px 0 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 5px; vertical-align: -1px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
  .pc { aspect-ratio: 1; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; border: 2px solid; }
  .pc small { font-size: 10px; font-weight: 800; margin-top: 2px; }
  .pc.free { background: rgba(92,255,141,.16); border-color: var(--free); color: #c9ffd9; }
  .pc.busy { background: rgba(255,107,139,.12); border-color: rgba(255,107,139,.6); color: #ffc2cf; }
  .pc.off { background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.15); color: var(--off); }
  .foot { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.7; text-align: center; }
  .err { color: #ffb3b3; }
  .play { display: block; margin: 16px auto 0; max-width: 360px; padding: 14px; border-radius: 16px; text-align: center; font-weight: 900; font-size: 16px; color: #1a1040; text-decoration: none; background: linear-gradient(90deg, var(--gold), #ff9f43); }
</style>
</head>
<body>
<div class="wrap">
  <h1><small>NEON FESTA ・ 7F パソコン室</small>空いている PC</h1>
  <div class="big">
    <div class="n" id="n">-</div>
    <div class="l" id="nl">台 空いています</div>
    <div class="free-list" id="freeList"></div>
    <div class="m" id="msg">よみこみ中…</div>
  </div>
  <div class="legend"><span><i style="background:var(--free)"></i>空き</span><span><i style="background:var(--busy)"></i>遊んでいる</span><span><i style="background:var(--off)"></i>休み中</span></div>
  <div class="grid" id="grid"></div>
  <a class="play" href="index.html">📱 待っているあいだ、スマホで遊ぶ</a>
  <div class="foot" id="foot">10 秒ごとに自動で新しくなります。番号は PC に貼ってある番号札と同じです。</div>
</div>
<script>
'use strict';
// 部屋の PC が 60 秒ごとに「空き／使用中」を知らせてくる（common.js）。それを読むだけなので、だれが開いても OK。
const API = (() => { const q = new URLSearchParams(location.search).get('api'); return q && /^https?:\/\//.test(q) ? q.replace(/\/+$/, '') : 'https://neon-festa-api.brainrot-rumble.workers.dev'; })();   // ?api= はためす用
const STALE_MS = 3 * 60 * 1000;   // 3 分知らせてこない PC は「休み中」（電源が切れた・ブラウザを閉じた）
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byNum = (a, b) => (parseFloat(a.pc) || 9999) - (parseFloat(b.pc) || 9999) || String(a.pc).localeCompare(String(b.pc), 'ja');

function render(data) {
  const pcs = (data.pcs || []).map(p => Object.assign({}, p, { state: data.now - p.at > STALE_MS ? 'off' : p.state })).sort(byNum);
  const free = pcs.filter(p => p.state === 'free');
  const n = $('n'); n.textContent = free.length; n.classList.toggle('zero', !free.length);
  $('freeList').innerHTML = free.length ? 'すぐ遊べる番号：' + free.map(p => `<b>${esc(p.pc)}</b>`).join('') : '';
  const busy = pcs.filter(p => p.state === 'busy').length;
  $('msg').textContent = !pcs.length ? 'まだ PC の情報がありません（開場前か、PC が起動していません）'
    : free.length ? '受付で番号を言ってね。空いている PC にどうぞ！'
    : `いま ${busy} 台ぜんぶ遊んでいます。1 人 15 分くらいで交代するので、少しだけお待ちください`;
  $('grid').innerHTML = pcs.map(p => `<div class="pc ${p.state}">${esc(p.pc)}<small>${p.state === 'free' ? '空き' : p.state === 'busy' ? '使用中' : '休み'}</small></div>`).join('');
  const d = new Date(data.now); $('foot').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')} 更新 ・ 10 秒ごとに自動で新しくなります。番号は PC に貼ってある番号札と同じです。`;
}
async function poll() {
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(API + '/api/vacancy', { cache: 'no-store', signal: ctl.signal }); clearTimeout(t);
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    $('msg').innerHTML = '<span class="err">通信できませんでした。少し待つと自動でもう一度読みます</span>';
  }
}
poll(); setInterval(poll, 10000);
</script>
</body>
</html>
